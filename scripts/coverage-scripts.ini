# coverage.py configuration for `make scripts-coverage`, which measures the
# repository scripts the checks run and writes coverage-scripts.xml.
[run]
# Repo-relative paths, which is what the SonarCloud scan resolves against.
relative_files = true
include =
    scripts/*.py
    clients/python/scripts/*.py
# The scripts' tests are test code, not lines to cover.
omit =
    scripts/*-test.py
data_file = .coverage-scripts

[xml]
output = coverage-scripts.xml
