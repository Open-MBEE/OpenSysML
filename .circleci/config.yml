version: 2.1

orbs:
  go: circleci/go@1.10.0

parameters:
  release_rehearsal:
    type: boolean
    default: false
    description: Run the release workflow on a branch without publishing anything (docs/project/releasing.md).

executors:
  go-executor:
    docker:
      # The -node variant of the same image: the WebAssembly gate runs the wasm
      # binaries under Node, and an absent runtime would make it skip.
      # It carries Node LTS, 24 or later, which the gate needs.
      - image: cimg/go:1.25-node
    resource_class: medium
  
  python-executor:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

  rust-executor:
    docker:
      - image: cimg/rust:1.83
    resource_class: medium

  # JDK 17, the client's compile target, with Maven 3.9 preinstalled. Testing on
  # the baseline is the point: a 21-only construct must fail here.
  java-executor:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: medium

  # Node 22 is the active LTS; the client supports >=20.11 for `await using`.
  node-executor:
    docker:
      - image: cimg/node:22.12
    resource_class: medium

  # Julia 1.10 is the client's declared [compat] floor.
  julia-executor:
    docker:
      - image: julia:1.10
    resource_class: medium

  # GNU Octave on the smallest base: MATLAB itself has no CI image, and
  # Octave >= 7 is the floor the client supports.
  octave-executor:
    docker:
      - image: cimg/base:current
    resource_class: medium

commands:
  # In a rehearsal (the release_rehearsal pipeline parameter) CIRCLE_TAG is
  # unset; this stands in for the tag the release steps read, before any of
  # them runs. sed rather than python: the go and cibuilds images may lack it.
  rehearsal-tag:
    steps:
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: stand in for the release tag"
                command: |
                  version=$(sed -n 's/^VERSION *= *"\(.*\)" *$/\1/p' \
                    client/python/opensysml/_version.py)
                  # _version.py is PEP 440; the tag spells SemVer.
                  case "$version" in
                    *a[0-9]*) semver="${version%%a*}-alpha.${version##*a}" ;;
                    *b[0-9]*) semver="${version%%b*}-beta.${version##*b}" ;;
                    *rc[0-9]*) semver="${version%%rc*}-rc.${version##*rc}" ;;
                    *) semver="$version" ;;
                  esac
                  if ! echo "$semver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$'; then
                    echo "Error: VERSION '$version' is not a release or an a/b/rc"
                    echo "pre-release; there is no SemVer tag spelling for it."
                    exit 1
                  fi
                  echo "export CIRCLE_TAG=v${semver}" >> "$BASH_ENV"
                  echo "REHEARSAL: standing in for tag v${semver} (no tag exists; nothing will be published)"

  # Names the irreversible step a rehearsal leaves out.
  rehearsal-skip:
    parameters:
      what:
        type: string
    steps:
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: skip << parameters.what >>"
                command: 'echo "REHEARSAL: skipping << parameters.what >>"'

  # The solver is an external process: without one on PATH the
  # solver-dependent tests would skip rather than run.
  install-solvers:
    steps:
      - run:
          name: Install Z3
          command: |
            sudo apt-get update
            sudo apt-get install -y z3
            z3 --version

      # The second verified backend, for the portability gate: cvc5 has no apt
      # package, so the official static release is what CI runs, pinned by
      # digest so a substituted asset is not run.
      - run:
          name: Install cvc5
          command: |
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/cvc5.zip \
              https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
            echo "dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  /tmp/cvc5.zip" | sha256sum --check --strict
            unzip -p /tmp/cvc5.zip '*/bin/cvc5' > /tmp/cvc5-bin
            sudo install -m 0755 /tmp/cvc5-bin /usr/local/bin/cvc5
            cvc5 --version | head -1

  # The FMI gate runs `python3` over FMPy; the executor's python3 has no pip and is
  # externally managed, so FMPy goes in a venv that later steps put first on PATH.
  install-fmpy:
    steps:
      - run:
          name: Install fmpy
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3-venv
            python3 -m venv "$HOME/fmpy-venv"
            "$HOME/fmpy-venv/bin/pip" install --only-binary ":all:" fmpy==0.3.32
            echo 'export PATH="$HOME/fmpy-venv/bin:$PATH"' >> "$BASH_ENV"

  # The corpora are not vendored and the gates skip while they are absent, so a
  # release tag could be cut over a corpus regression without them.
  download-corpora:
    steps:
      # Every corpus below comes through this downloader, so it is checked first.
      - run:
          name: Test the pilot downloader
          command: scripts/pilot-pin-test.sh

      - restore_cache:
          keys:
            - training-corpus-v1-{{ checksum "scripts/download-training-examples.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}

      - run:
          name: Download the OMG training corpus
          command: ./scripts/download-training-examples.sh

      - save_cache:
          key: training-corpus-v1-{{ checksum "scripts/download-training-examples.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}
          paths:
            - examples/sysml-v2-training

      # The three pilot corpora, gated the same way and keyed the same way. Their
      # gate is our-side-only: the comparison against the reference implementation
      # (tools/referee/diff) needs Java validators and is not run in CI.
      - restore_cache:
          keys:
            - pilot-corpora-v1-{{ checksum "scripts/download-pilot-corpora.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}

      - run:
          name: Download the OMG pilot corpora
          command: ./scripts/download-pilot-corpora.sh

      - save_cache:
          key: pilot-corpora-v1-{{ checksum "scripts/download-pilot-corpora.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}
          paths:
            - examples/pilot-corpora

      # The PSSM test suite, one pinned file, gated the same way by tools/referee/pssm.
      - restore_cache:
          keys:
            - pssm-suite-v1-{{ checksum "scripts/download-pssm-suite.sh" }}-{{ checksum "scripts/pssm-pin.sh" }}

      - run:
          name: Download the OMG PSSM test suite
          command: ./scripts/download-pssm-suite.sh

      - save_cache:
          key: pssm-suite-v1-{{ checksum "scripts/download-pssm-suite.sh" }}-{{ checksum "scripts/pssm-pin.sh" }}
          paths:
            - build/pssm

      # The SysML v1 to v2 transformation model, one pinned file, gated by
      # tools/census/transformation.
      - restore_cache:
          keys:
            - sysml-v1tov2-v1-{{ checksum "scripts/download-sysml-v1tov2.sh" }}-{{ checksum "scripts/sysml-v1tov2-pin.sh" }}

      - run:
          name: Download the SysML v1 to v2 transformation model
          command: ./scripts/download-sysml-v1tov2.sh

      - save_cache:
          key: sysml-v1tov2-v1-{{ checksum "scripts/download-sysml-v1tov2.sh" }}-{{ checksum "scripts/sysml-v1tov2-pin.sh" }}
          paths:
            - build/sysml-v1tov2

      # The fUML reference implementation's models and jar, gated by tools/referee/fuml;
      # the jar is never run here (docs/project/fuml-referee.md).
      - restore_cache:
          keys:
            - fuml-suite-v1-{{ checksum "scripts/download-fuml-suite.sh" }}-{{ checksum "scripts/fuml-pin.sh" }}

      - run:
          name: Download the fUML reference-implementation suite
          command: ./scripts/download-fuml-suite.sh

      - save_cache:
          key: fuml-suite-v1-{{ checksum "scripts/download-fuml-suite.sh" }}-{{ checksum "scripts/fuml-pin.sh" }}
          paths:
            - build/fuml

      # The pilot's XMI of the standard library, gated by tests/identity.
      - restore_cache:
          keys:
            - pilot-library-xmi-v1-{{ checksum "scripts/download-pilot-library-xmi.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}

      - run:
          name: Download the pilot library XMI
          command: ./scripts/download-pilot-library-xmi.sh

      - save_cache:
          key: pilot-library-xmi-v1-{{ checksum "scripts/download-pilot-library-xmi.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}
          paths:
            - build/pilot-library-xmi

      # The Modelica Reference-FMUs, gated by tests/fmi and the Python runner's
      # real test; pinned by tag and checksum like the corpora above.
      - restore_cache:
          keys:
            - reference-fmus-v1-{{ checksum "scripts/download-reference-fmus.sh" }}-{{ checksum "scripts/reference-fmus-pin.sh" }}

      - run:
          name: Download the Reference-FMUs
          command: ./scripts/download-reference-fmus.sh

      - save_cache:
          key: reference-fmus-v1-{{ checksum "scripts/download-reference-fmus.sh" }}-{{ checksum "scripts/reference-fmus-pin.sh" }}
          paths:
            - examples/reference-fmus

      - run:
          name: Verify the OMG pilot corpora
          command: |
            for root in sysml-examples sysml-validation kerml-examples; do
              count=$(find "examples/pilot-corpora/$root" -type f \( -name '*.sysml' -o -name '*.kerml' \) | wc -l)
              echo "pilot corpus $root: $count model files"
              if [ "$count" -eq 0 ]; then
                echo "error: pilot corpus $root is empty; the corpora gate would not run" >&2
                exit 1
              fi
            done

# The Go suite is four jobs rather than one because the plan caps a job at 60
# minutes and the race run and the coverage run alone take ~45 of them. The
# race run gates the workflow but not the client tests or the scan, which need
# only the coverage profile and the binaries.
jobs:
  # Formatting, vet, static analysis, the documentation gates and the protobuf
  # schema checks: everything that needs neither a solver nor the corpora.
  go-static:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache

      - run:
          name: Check Go formatting
          command: |
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "The following files are not gofmt'd:"
              echo "$unformatted"
              exit 1
            fi

      - run:
          name: Run Go vet
          command: |
            go vet ./...
            go vet -C tools ./...

      # The third-party notices link the licence text this bundle copies into
      # docs/assets/landing, which is generated rather than tracked.
      - run:
          name: Build the landing-page diagram
          command: make docs-landing-assets

      - run:
          name: Check documentation links
          command: python3 scripts/check-doc-links.py

      # python-test runs the same link check under coverage (make scripts-coverage)
      # on an executor without Node, so it reads the bundle built here instead.
      - persist_to_workspace:
          root: .
          paths:
            - docs/assets/landing

      # The shipped pages are generated from each command's description, so a
      # flag added without regenerating them would ship a page for a command
      # that no longer exists.
      - run:
          name: Verify the committed manual pages are current
          command: |
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mandoc
            make man-check

      # Internal work-item labels (waves, F<n>, P<n>, K<n>/S<n>) have no public
      # referent, so they may not appear in the pages a user reads.
      - run:
          name: Check for internal labels in reader-facing documentation
          command: python3 scripts/check-doc-ids.py

      # An oracle total quoted outside the generated block is a snapshot, and a
      # reader cannot tell that from a current figure unless the page says so.
      - run:
          name: Check quoted oracle figures name the round they measured
          command: python3 scripts/check-doc-figures.py

      # The census figures are derived from the committed baseline, and every
      # table row must be a constraint the baseline records (and vice versa).
      - run:
          name: Check the validation-constraint census matches its baseline
          command: go run -C tools ./cmd/validation-census -check

      # Same for the transformation census; this job provisions neither input,
      # so the model and measurement comparisons run in the gate job that does.
      - run:
          name: Check the transformation census matches its baseline
          command: go run -C tools ./cmd/transformation-census -check
          environment:
            OPENSYSML_REQUIRE_PSSM_SUITE: ""
            OPENSYSML_REQUIRE_SYSML_V1TOV2: ""

      # Changelog entries live in changes/unreleased/ until a release folds them in.
      - run:
          name: Check changelog fragments
          command: python3 scripts/changelog-test.py && python3 scripts/changelog.py check

      - run:
          name: Check the release provenance writer
          command: python3 scripts/release-provenance-test.py

      # The compliance census is counted when the site is built, never committed.
      - run:
          name: Check the compliance census hook
          command: python3 scripts/mkdocs_census-test.py

      # The test-suite figures are counted when the site is built, never committed.
      - run:
          name: Check the test-suite figures hook
          command: python3 scripts/mkdocs_suite_figures-test.py

      # Each client verifies a download against the copy of the pinned digests it
      # ships, so a copy that drifts from the table pins something else.
      - run:
          name: Check the clients ship the pinned release digests
          command: python3 scripts/sync-release-digests.py --check

      # no_output_timeout: gosec runs with -quiet and prints nothing until it has
      # walked every package, which now takes longer than CircleCI's 10m default.
      - run:
          name: Run static analysis (staticcheck + gosec)
          command: make lint
          no_output_timeout: 30m

      - run:
          name: Check grpc-go stays out of production code
          command: ./scripts/check-grpc-imports.sh

      - run:
          name: Lint the protobuf schema
          command: make proto-lint

      # Baseline is an ancestor of HEAD, never a live branch tip (a merge landing meanwhile would
      # read as deletions): the first parent on main or develop, the previous release on a `v*` tag.
      - run:
          name: Check the protobuf schema for breaking changes
          command: |
            if [ -n "${CIRCLE_TAG:-}" ]; then
              git fetch --tags --quiet origin
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                git fetch --unshallow --quiet origin
              fi
              baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$CIRCLE_TAG" HEAD)
              echo "release tag ${CIRCLE_TAG}: comparing against the previous release, ${baseline}"
            else
              git rev-parse --verify --quiet HEAD^1 > /dev/null \
                || git fetch --quiet --depth=2 origin "$CIRCLE_SHA1"
              baseline=HEAD^1
              echo "branch build: comparing against the first parent, $(git rev-parse --short HEAD^1)"
            fi
            make proto-breaking BUF_BREAKING_REF="$baseline"

      # Committed stubs must be what buf generates, or the checked-in code and
      # the schema can drift apart silently. `git add -N` puts a regenerated
      # file the commit had deleted into the diff.
      - run:
          name: Verify the committed Go and Java stubs are current
          command: |
            make proto-buf
            git add -N api/proto \
              client/java/opensysml-client/src/main/java/org/openmbee/opensysml/proto
            git diff --exit-code api/proto \
              client/java/opensysml-client/src/main/java/org/openmbee/opensysml/proto

  # The race-enabled suite. It is the longest single step in the pipeline, so
  # it gets the larger class and four executors, one named package shard each.
  go-race-test:
    executor: go-executor
    resource_class: large
    parallelism: 4
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - install-solvers
      - download-corpora

      - install-fmpy

      # One scripts/race-shard.sh shard per node: internal/exec/runtime alone peaks near
      # 8.5 GB under -race, so it shares its 8 GB node only sequentially (tests/wasm, tools).
      # The race detector's memory is per process and the corpus-wide exploration alone
      # accounts for half of that peak, so the package runs as two processes: the
      # exploration, then everything else (4 GB each).
      - run:
          name: Run Go race tests
          command: |
            set -o pipefail
            shards=(runtime model export rest)
            if [ "$CIRCLE_NODE_TOTAL" != "${#shards[@]}" ]; then
              echo "error: parallelism is $CIRCLE_NODE_TOTAL, but scripts/race-shard.sh has ${#shards[@]} shards" >&2
              exit 1
            fi
            shard=${shards[$CIRCLE_NODE_INDEX]}
            pkgs=$(scripts/race-shard.sh "$shard")
            echo "shard $shard:"; echo "$pkgs"
            if [ "$shard" = runtime ]; then
              exploration='^TestExploreWithIsExploreOverTheConformanceCorpus$'
              go test -v -race -pgo=off -timeout 30m -run "$exploration" $pkgs
              go test -v -race -pgo=off -timeout 30m -skip "$exploration" $pkgs
              go test -v -race -pgo=off -timeout 30m ./tests/wasm
              go test -C tools -v -race -pgo=off -timeout 30m ./...
            else
              go test -v -race -pgo=off -timeout 30m $pkgs
            fi
          no_output_timeout: 30m
          environment:
            # Turns "corpus absent" into a failure rather than a skip, as the
            # GitHub Actions PR workflow already does.
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"
            OPENSYSML_REQUIRE_PSSM_SUITE: "1"
            OPENSYSML_REQUIRE_SYSML_V1TOV2: "1"
            OPENSYSML_REQUIRE_FUML_SUITE: "1"
            OPENSYSML_REQUIRE_PILOT_LIBRARY_XMI: "1"
            # Same for the solver installed above: absent means failure, not skip.
            OPENSYSML_REQUIRE_SMT: "1"
            # Same for Node, which the executor carries: the WebAssembly gate runs
            # the wasm binaries rather than skipping without a runtime (tests/wasm).
            OPENSYSML_REQUIRE_WASM: "1"
            # Same for the Reference-FMUs and fmpy, fetched and installed above:
            # the FMI gate runs rather than skips (tests/fmi).
            OPENSYSML_REQUIRE_REFERENCE_FMUS: "1"

  # A second, race-free pass, because the profile the scan reads is written
  # with -coverpkg, which is too slow to instrument under -race. Serially the
  # instrumented suite overran the 60-minute job limit even on large, so it runs
  # as the race test's four package shards, and go-coverage-merge joins them.
  go-coverage:
    executor: go-executor
    resource_class: large
    parallelism: 4
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - install-solvers
      - download-corpora

      - install-fmpy

      - run:
          name: Write this shard's coverage profile
          command: |
            shards=(runtime model export rest)
            if [ "$CIRCLE_NODE_TOTAL" != "${#shards[@]}" ]; then
              echo "error: parallelism is $CIRCLE_NODE_TOTAL, but scripts/race-shard.sh has ${#shards[@]} shards" >&2
              exit 1
            fi
            make coverage-shard SHARD="${shards[$CIRCLE_NODE_INDEX]}"
          no_output_timeout: 30m
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"
            OPENSYSML_REQUIRE_PSSM_SUITE: "1"
            OPENSYSML_REQUIRE_SYSML_V1TOV2: "1"
            OPENSYSML_REQUIRE_FUML_SUITE: "1"
            OPENSYSML_REQUIRE_PILOT_LIBRARY_XMI: "1"
            OPENSYSML_REQUIRE_SMT: "1"
            # Node is on the executor, so the WebAssembly gate runs rather than
            # skips without a runtime (tests/wasm).
            OPENSYSML_REQUIRE_WASM: "1"
            # Same for the Reference-FMUs and fmpy (tests/fmi).
            OPENSYSML_REQUIRE_REFERENCE_FMUS: "1"

      - persist_to_workspace:
          root: .
          paths:
            # coverage-<shard>.txt, one per node.
            - coverage-*.txt

  # Joins the shards' profiles into the one the scan reads.
  go-coverage-merge:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download

      - attach_workspace:
          at: .

      - run:
          name: Write the coverage profile the scan reads
          command: make coverage-merge

      - persist_to_workspace:
          root: .
          paths:
            # The scan job reads this profile; without it Sonar shows no coverage.
            - coverage.txt

  # The gates that re-run part of the suite on their own so their verdicts are
  # legible in the log, the conformance suite over every transport, and the
  # host binaries the client jobs test against.
  go-gates:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - install-solvers
      - download-corpora

      # The metamodel table is generated from the pilot's SysML.ecore at the pin;
      # a pin bump without regenerating it fails here.
      - restore_cache:
          keys:
            - pilot-metamodel-v1-{{ checksum "scripts/download-pilot-metamodel.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}

      - run:
          name: Download the pilot metamodel
          command: ./scripts/download-pilot-metamodel.sh

      - save_cache:
          key: pilot-metamodel-v1-{{ checksum "scripts/download-pilot-metamodel.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}
          paths:
            - build/pilot-metamodel

      - run:
          name: Check the metamodel table matches the pinned SysML.ecore
          command: make ontology-table-check

      - run:
          name: Check generated Python metaclasses are current
          command: make python-metamodel-check

      # The corpora gate alone, so its per-root verdict lines are legible in the
      # log and a skip cannot hide behind a green suite.
      - run:
          name: Run pilot corpora gate
          command: |
            set -o pipefail
            go test -count=1 -v ./tests/corpus -run 'TestPilotCorpora' | tee pilot-corpora-gate.log
            grep -E 'pilot corpus files clean' pilot-corpora-gate.log
            if grep -qE '^\s*--- SKIP' pilot-corpora-gate.log; then
              echo "error: the pilot corpora gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"

      # The normative-identity gate alone, for the same reason.
      - run:
          name: Run pilot library identity gate
          command: |
            set -o pipefail
            go test -count=1 -v ./tests/identity -run 'TestPilotLibraryXMI' | tee pilot-library-xmi-gate.log
            grep -E 'pilot library XMI: [0-9]+ derived' pilot-library-xmi-gate.log
            if grep -qE '^\s*--- SKIP' pilot-library-xmi-gate.log; then
              echo "error: the pilot library identity gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_PILOT_LIBRARY_XMI: "1"

      # The RDF round-trip ratchet over every example alone, so its per-verdict
      # counts are legible in the log and a skip cannot hide behind a green suite.
      - run:
          name: Run RDF corpus round-trip gate
          command: |
            set -o pipefail
            go test -count=1 -v ./tests/corpus -run 'TestCorpusRoundTrip' | tee corpus-roundtrip-gate.log
            grep -E 'corpus round trip: [0-9]+ files:' corpus-roundtrip-gate.log
            if grep -qE '^\s*--- SKIP' corpus-roundtrip-gate.log; then
              echo "error: the RDF corpus round-trip gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"

      # The same ratchet over the API's JSON element form, beside the RDF one.
      - run:
          name: Run api-json corpus round-trip gate
          command: |
            set -o pipefail
            go test -count=1 -v ./tests/corpus -run 'TestCorpusAPIJSONRoundTrip' | tee api-json-roundtrip-gate.log
            grep -E 'api-json corpus round trip: [0-9]+ files:' api-json-roundtrip-gate.log
            if grep -qE '^\s*--- SKIP' api-json-roundtrip-gate.log; then
              echo "error: the api-json corpus round-trip gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"

      # The PSSM suite gates alone, then the referee's bucket-count check
      # (never pass/fail; see docs/project/pssm-referee.md).
      - run:
          name: Run PSSM suite gates
          command: |
            set -o pipefail
            go test -C tools -count=1 -v ./referee/pssm -run 'TestSuiteRead|TestSuiteClassification|TestEmitSuite' | tee pssm-gate.log
            if grep -qE '^\s*--- SKIP' pssm-gate.log; then
              echo "error: the PSSM suite gate skipped" >&2
              exit 1
            fi
            go run -C tools ./cmd/pssm-referee -check
          environment:
            OPENSYSML_REQUIRE_PSSM_SUITE: "1"

      # The transformation census's baseline lists the mapping classes the pinned
      # model declares; here the model is provisioned, so the baseline is
      # compared against a fresh extraction.
      - run:
          name: Transformation census lists what the pinned model contains
          command: go run -C tools ./cmd/transformation-census -check -require-xmi
          environment:
            OPENSYSML_REQUIRE_SYSML_V1TOV2: "1"

      # The migration of the PSSM suite to v2 notation alone, so its report totals
      # are legible in the log and a skip cannot hide behind a green suite
      # (docs/project/pssm-migration.md).
      - run:
          name: Run PSSM migration gate
          command: |
            set -o pipefail
            go test -count=1 -v ./tests/corpus -run 'TestPSSMSuiteMigration' | tee pssm-migration-gate.log
            grep -E 'PSSM_TestSuite.xmi: migrated [0-9]+ element' pssm-migration-gate.log
            if grep -qE '^\s*--- SKIP' pssm-migration-gate.log; then
              echo "error: the PSSM migration gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_PSSM_SUITE: "1"

      # The fUML reader and classifier over the pinned models, likewise, then the
      # referee's bucket-count check against the committed record; the jar never runs.
      - run:
          name: Run fUML suite gates
          command: |
            set -o pipefail
            go test -C tools -count=1 -v ./referee/fuml -run 'TestSuite' | tee fuml-gate.log
            if grep -qE '^\s*--- SKIP' fuml-gate.log; then
              echo "error: the fUML suite gate skipped" >&2
              exit 1
            fi
            go run -C tools ./cmd/fuml-referee -check
          environment:
            OPENSYSML_REQUIRE_FUML_SUITE: "1"

      # Re-run the differential gate alone so its summary counts, which make
      # coverage drift reviewable, are visible rather than buried in the suite.
      - run:
          name: Run solver differential gate
          command: |
            set -o pipefail
            go test -count=1 -v ./internal/exec/solve -run TestDifferential | tee differential-gate.log
            grep -E 'differential gate .*: .* elements:' differential-gate.log
            if grep -qE '^\s*--- SKIP' differential-gate.log; then
              echo "error: a differential gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_SMT: "1"

      # Portability: the same subset against both verified backends, so a feature
      # one of them refuses is reported here rather than found by a user. The
      # requirement flag makes an absent solver a failure rather than a skip.
      - run:
          name: Run solver portability gate
          command: |
            set -o pipefail
            for solver in z3 cvc5; do
              OPENSYSML_SMT="$solver" go test -count=1 -v ./internal/exec/solve \
                -run 'TestPortability' | tee "portability-$solver.log"
              grep -E "portability of $solver" "portability-$solver.log"
              if grep -qE '^\s*--- SKIP' "portability-$solver.log"; then
                echo "error: the portability gate skipped for $solver" >&2
                exit 1
              fi
            done
          environment:
            OPENSYSML_REQUIRE_SMT: "1"

      # The solver gate against the second backend: what z3 answers, cvc5 must
      # answer too, the portability subset alone not being the whole contract.
      - run:
          name: Run solver gate (cvc5)
          command: |
            set -o pipefail
            OPENSYSML_SMT=cvc5 go test -count=1 -v ./internal/exec/solve ./internal/frontend/repl \
              -run 'TestSolver|TestDiscovery|TestSolved|TestDivisor|TestCheck|TestSolve|TestConfigure|TestSynthesis|TestPinned|TestFixed|TestExplain|TestCore' \
              | tee cvc5-gate.log
            if grep -qE '^\s*--- SKIP' cvc5-gate.log; then
              echo "error: a solver-dependent test skipped under cvc5" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_SMT: "1"

      # The other half of the solver contract: with discovery pointed at an
      # executable that does not exist, solver-dependent tests skip and the
      # absent-solver paths must still report one. The whole of internal/frontend/repl
      # runs here, and it needs more than go test's default ten-minute budget.
      # no_output_timeout: go test prints a package's -v output only once it finishes,
      # and internal/frontend/repl alone takes eight to ten minutes, past CircleCI's 10m default.
      - run:
          name: Run solver-absent gate
          command: |
            set -o pipefail
            env -u OPENSYSML_REQUIRE_SMT OPENSYSML_SMT=/nonexistent/no-such-solver \
              go test -count=1 -v -timeout 30m ./internal/exec/solve ./internal/frontend/repl | tee no-solver-gate.log
            for name in TestCheckReportsAnAbsentSolver TestExplainReportsAnAbsentSolver \
              TestSolveReportsAnAbsentSolver TestConfigureReportsAnAbsentSolver \
              TestOptimizeReportsAnAbsentSolver; do
              grep -qE "^\s*--- PASS: $name" no-solver-gate.log || {
                echo "error: $name did not run without a solver" >&2
                exit 1
              }
            done
          no_output_timeout: 30m

      # The WebAssembly gate: both wasm targets compiled and vetted, the commands
      # linked and then run. Node is on the executor, so the require variable makes
      # an absent runtime a failure and the check below makes a skip one too.
      # Compiling both targets takes this executor about ten minutes, so the gate
      # needs more than go test's default ten-minute budget.
      - run:
          name: Run the WebAssembly gate
          command: |
            set -o pipefail
            node --version
            go test -count=1 -v -timeout 30m ./tests/wasm | tee wasm-gate.log
            if grep -qE '^\s*--- SKIP' wasm-gate.log; then
              echo "error: the WebAssembly gate skipped" >&2
              exit 1
            fi
          no_output_timeout: 30m
          environment:
            OPENSYSML_REQUIRE_WASM: "1"

      # The conformance suite: the runner builds and starts sysml-grpc itself, so
      # this gate proves the whole path a client takes, not a pre-started service.
      - run:
          name: Run conformance suite
          command: make conformance

      # when: always — the report matters most when the gate failed and halted the job.
      - store_artifacts:
          path: bin/conformance-report.json
          destination: conformance-report.json
          when: always

      # The same run as JUnit XML, so the Tests tab shows per-scenario results.
      - store_test_results:
          path: bin/conformance-report.xml
          when: always

      # The same suite against the legacy grpc-go transport, so -transport grpc
      # cannot rot untested.
      - run:
          name: Run conformance suite against -transport grpc
          command: go run -C tools ./cmd/conformance -transport grpc -protocols grpc -report bin/conformance-grpc-transport-report.json

      - store_artifacts:
          path: bin/conformance-grpc-transport-report.json
          destination: conformance-grpc-transport-report.json
          when: always

      # The same suite through the public Go API (client/opensysml), in-process and
      # remote; scenarios outside its v1 surface are counted skips, not hidden.
      - run:
          name: Conformance suite through client/opensysml
          command: make conformance-pkg

      - store_artifacts:
          path: bin/conformance-pkg-report.json
          destination: conformance-pkg-report.json
          when: always

      - run:
          name: Build binaries
          command: |
            VERSION=${CIRCLE_TAG:-dev}
            COMMIT=${CIRCLE_SHA1:-unknown}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')

            make build VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"

      - run:
          name: Verify binaries
          command: |
            ./bin/sysml --version
            ./bin/sysml-lsp --version
            ls -lh bin/

      # The client jobs test against this binary.
      - persist_to_workspace:
          root: .
          paths:
            - bin/sysml-grpc

      - store_artifacts:
          path: bin/
          destination: binaries
  # SonarCloud analysis. The `SonarCloud` context supplies SONAR_TOKEN.
  scan:
    docker:
      - image: cimg/go:1.25
    # The Go sensor holds a whole directory's parse in memory; internal/exec/runtime
    # (168 files) overflows the default heap. The 8 GB container, the largest
    # class in the plan, carries: 5.5 GB analysis heap + Node capped at 1 GB
    # (sonar-project.properties) + a small launcher JVM.
    resource_class: large
    environment:
      # sonar-scanner-cli 8 forks the analysis into a second JVM whose arguments
      # come from SONAR_SCANNER_JAVA_OPTS; SONAR_SCANNER_OPTS sizes the launcher
      # and carries -D properties appended by later steps.
      SONAR_SCANNER_JAVA_OPTS: -Xmx5500m
      SONAR_SCANNER_OPTS: -Xmx256m
    steps:
      # Forked PRs get no context, so the token is absent there: end green
      # rather than fail every outside contribution. With a token, a failing
      # scan still fails the job.
      - run:
          name: Halt when SONAR_TOKEN is absent (forked PR)
          command: |
            if [ -z "${SONAR_TOKEN:-}" ]; then
              echo "SONAR_TOKEN is empty (forked PR or missing context); skipping the scan."
              circleci-agent step halt
            fi

      # Sonar blames every file with JGit, which cannot fetch a blob on demand:
      # against CircleCI's default blobless clone it dies with
      # `MissingObjectException: Missing blob ...` as soon as it needs a
      # historical version of a file. This is the one job in the file that reads
      # history rather than the current tree, so it is the one that pays for a
      # full clone.
      - checkout:
          method: full

      - attach_workspace:
          at: .

      # Every coverage report the scan reads is expected at the path named in
      # sonar-project.properties, relative to the repo root. The Java classes and
      # jars are named there too: absent, the sensor only warns, so check here.
      - run:
          name: Show the reports and Java binaries the scan reads
          command: |
            ls -l coverage.txt coverage-python.xml coverage-scripts.xml coverage-node.lcov \
              client/java/opensysml-client/target/site/jacoco/jacoco.xml \
              client/java/opensysml-conformance/target/site/jacoco/jacoco.xml
            head -n 3 coverage.txt
            for module in opensysml-client opensysml-conformance; do
              for dir in classes test-classes dependency; do
                path="client/java/$module/target/$dir"
                if [ -z "$(ls -A "$path" 2>/dev/null)" ]; then
                  echo "$path is empty or missing; java-test must persist it."
                  exit 1
                fi
                echo "$path: $(find "$path" -type f | wc -l) file(s)"
              done
            done

      # SonarCloud needs full history for blame and new-code detection, and a
      # blame that silently covers 0 files dates every issue to the import. Fail
      # here, before the scan, if the clone is not one JGit can blame.
      - run:
          name: Verify the clone is complete
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow
            fi
            # A partial clone records the filter it was made with, and reports
            # the objects it left behind as missing; either one means JGit will
            # fail on the first historical blob it needs.
            if grep -q "partialclonefilter" .git/config; then
              echo "The clone is partial:"
              grep -n "partialclonefilter\|promisor" .git/config
              echo "JGit cannot fetch blobs on demand, so blame would fail; the"
              echo "checkout above must use method: full."
              exit 1
            fi
            missing=$(git rev-list --objects --missing=print --no-object-names HEAD | grep -c "^?" || true)
            if [ "$missing" != "0" ]; then
              echo "$missing object(s) reachable from HEAD are absent locally."
              exit 1
            fi
            echo "Full clone: $(git rev-list --count HEAD) commits, no filter, no missing objects."

      # An analysis that names no version carries the placeholder "not
      # provided", and the default "previous version" new-code period then
      # finds no earlier, different version to compare against and falls back
      # to the first analysis ever run. That collapse is not visible as a
      # failure: the scan succeeds and the new-code conditions quietly grade
      # the whole codebase (on 2026-08-27, 105,050 of 110,609 lines counted as
      # new). Naming the nearest release tag makes the period what it claims to
      # be — what has been committed since that release.
      - run:
          name: Derive sonar.projectVersion from the nearest release tag
          command: |
            # CircleCI fetches the ref being built, not the tag namespace.
            git fetch --tags --quiet origin || true
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [ -z "$version" ]; then
              echo "No v* tag is an ancestor of HEAD, so the version stays unset"
              echo "and the new-code period falls back to the first analysis."
              exit 0
            fi
            echo "sonar.projectVersion=${version#v}"
            # The launcher JVM turns its sonar.* system properties into scanner
            # properties and hands them to the forked analysis JVM.
            echo "export SONAR_SCANNER_OPTS=\"${SONAR_SCANNER_OPTS} -Dsonar.projectVersion=${version#v}\"" >> "$BASH_ENV"

      - run: mkdir -p /tmp/cache/scanner sonar-logs

      - restore_cache:
          keys:
            - v1-sonar-scanner-8.0.1.6346

      # The sonar-scanner-cli distribution, cached by version; what the
      # sonarsource/sonarcloud orb's scan command did. A transient SonarCloud
      # API failure retries once after 30s; an analysis failure exits at once.
      - run:
          name: SonarQube Cloud
          no_output_timeout: 20m
          command: |
            set -eo pipefail
            VERSION=8.0.1.6346
            if [ -z "${SONAR_TOKEN:-}" ]; then
              echo "SONAR_TOKEN is required to scan" >&2
              exit 1
            fi
            SCANNER_DIRECTORY=/tmp/cache/scanner
            export SONAR_USER_HOME=$SCANNER_DIRECTORY/.sonar
            if ! ls "$SCANNER_DIRECTORY/sonar-scanner-$VERSION-linux-x64/bin/sonar-scanner" >/dev/null 2>&1; then
              curl -sSLo /tmp/scanner-cli.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-$VERSION-linux-x64.zip"
              unzip -q -d "$SCANNER_DIRECTORY" /tmp/scanner-cli.zip
              rm /tmp/scanner-cli.zip
              chmod +x "$SCANNER_DIRECTORY/sonar-scanner-$VERSION-linux-x64/bin/sonar-scanner" "$SCANNER_DIRECTORY/sonar-scanner-$VERSION-linux-x64/jre/bin/java"
            fi
            scanner="$SCANNER_DIRECTORY/sonar-scanner-$VERSION-linux-x64/bin/sonar-scanner"
            transient='Failed to query JRE metadata|failed with HTTP 5[0-9][0-9]|Connection reset|Connect timed out|Read timed out|SocketTimeoutException|UnknownHostException'
            for attempt in 1 2; do
              set +e
              "$scanner" 2>&1 | tee "sonar-logs/sonar-scan-$attempt.log"
              status=${PIPESTATUS[0]}
              set -e
              [ "$status" -eq 0 ] && exit 0
              if [ "$attempt" -eq 1 ] && grep -Eq "$transient" "sonar-logs/sonar-scan-$attempt.log"; then
                echo "SonarCloud API error; retrying once in 30s"
                sleep 30
                continue
              fi
              exit "$status"
            done

      # An OOM kill surfaces as a bare exit 3 in the scan's log; the cgroup
      # counters name it (v2 first, v1 fallback).
      - run:
          name: Report the container's memory events
          when: always
          command: |
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true
            cat /sys/fs/cgroup/memory.peak 2>/dev/null || true
            cat /sys/fs/cgroup/memory.events 2>/dev/null || true
            cat /sys/fs/cgroup/memory/memory.max_usage_in_bytes 2>/dev/null || true
            cat /sys/fs/cgroup/memory/memory.oom_control 2>/dev/null || true

      - save_cache:
          key: v1-sonar-scanner-8.0.1.6346
          paths:
            - /tmp/cache/scanner

      - store_artifacts:
          path: sonar-logs/
          destination: sonar-logs
          when: always

      # SonarCloud does not create a project from a CI scan, so the first run
      # against an unprovisioned project fails; point at the setup doc.
      - run:
          name: Point at the setup doc on failure
          when: on_fail
          command: |
            echo "The scan failed. If it reported \"Could not find a default branch for"
            echo "project with key 'Open-MBEE_OpenSysML'\", the project has not been"
            echo "created on SonarCloud yet: see 'The SonarCloud scan' in"
            echo "docs/project/releasing.md for the one-time maintainer step."

  python-test:
    executor: python-executor
    steps:
      - checkout
      
      - attach_workspace:
          at: .

      # make scripts-coverage runs the test-suite figures test, which renders the figures with go run.
      - go/install:
          version: "1.25.0"

      - run:
          name: Verify Go version
          command: |
            go version

      # The FMI runner test reads the Reference-FMUs under examples/, downloaded
      # by the same command the Go jobs run.
      - download-corpora

      - run:
          name: Install sysml-grpc
          command: |
            mkdir -p ~/.opensysml/bin
            cp bin/sysml-grpc ~/.opensysml/bin/
            chmod +x ~/.opensysml/bin/sysml-grpc
      
      - run:
          name: Install Python client
          command: |
            make python-install
            # Pinned and wheel-only, as in .github/workflows/pr.yml.
            pip install --only-binary :all: pytest==9.0.3 pytest-mock==3.15.1 psutil==7.2.2 pytest-cov==7.0.0 fmpy==0.3.32 mypy==2.4.0 types-protobuf==7.35.1.20260906 'pyright[nodejs]==1.1.414'
            # make scripts-coverage runs the MkDocs hooks' tests, which build a site.
            pip install --only-binary :all: -r docs-requirements.txt
      
      # The integration tests connect to a service on the standard port with
      # auto_start=False, which is the explicit opt-in to one the client does not
      # manage; without it they skip, exercising nothing, so one runs here for
      # the rest of the job. Tests that name no address start a private child of
      # their own instead, from the binary installed above.
      - run:
          name: Start sysml-grpc
          command: ~/.opensysml/bin/sysml-grpc -port 50051
          background: true

      - run:
          name: Wait for sysml-grpc
          command: |
            # The backslash escapes the heredoc operator for a 2.1 config; the
            # shell sees a plain heredoc.
            python3 - \<<'PY'
            import socket, sys, time

            for _ in range(30):
                with socket.socket() as probe:
                    probe.settimeout(1)
                    if probe.connect_ex(("localhost", 50051)) == 0:
                        print("sysml-grpc is listening on 50051")
                        sys.exit(0)
                time.sleep(1)
            sys.exit("sysml-grpc never listened on 50051")
            PY

      # OPENSYSML_REQUIRE_SERVICE turns "no service, so skip" into a failure: a
      # service is provided here, so its absence is the bug, not a pass.
      - run:
          name: Run Python client tests
          command: OPENSYSML_REQUIRE_SERVICE=1 OPENSYSML_REQUIRE_REFERENCE_FMUS=1 OPENSYSML_REQUIRE_TYPECHECKERS=1 make python-coverage

      # The repository scripts the Go static checks run are Python too; running
      # them and their tests under coverage here credits what those checks execute.
      - run:
          name: Run the repository scripts with coverage
          command: make scripts-coverage

      # The scan job reads these reports; without them every Python line counts
      # as uncovered.
      - persist_to_workspace:
          root: .
          paths:
            - coverage-python.xml
            - coverage-scripts.xml

      # This executor has no Go toolchain, so buf comes from the official release
      # rather than `go run`, pinned by digest so a substituted asset is not run.
      - run:
          name: Install buf
          command: |
            curl -fsSL -o /tmp/buf \
              https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
            echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
            sudo install -m 0755 /tmp/buf /usr/local/bin/buf
            buf --version

      # Committed stubs must be what buf generates, or the checked-in client and
      # the schema can drift apart silently.
      - run:
          name: Verify the committed Python stubs are current
          command: |
            # Pinned to the version recorded in the committed stubs
            # (GRPC_GENERATED_VERSION), so a newer release cannot fail this check.
            pip install "grpcio-tools==1.83.0"
            make python-proto BUF=buf
            git add -N client/python/opensysml/proto
            git diff --exit-code client/python/opensysml/proto

      - run:
          name: Verify Python client import
          command: |
            python3 -c "import opensysml; print(f'opensysml {opensysml.__version__} imported successfully')"

  rust-test:
    executor: rust-executor
    steps:
      - checkout

      - run:
          name: Verify Rust 1.83
          command: |
            rustc --version
            cargo --version

      - go/install:
          version: "1.25.0"

      - run:
          name: Verify Go version
          command: |
            go version

      - run:
          name: Build sysml-grpc
          command: make build

      - run:
          name: Check Rust formatting
          command: cd client/rust && cargo fmt --all -- --check

      - run:
          name: Run Rust clippy
          command: cd client/rust && cargo clippy --all-targets -- -D warnings

      - run:
          name: Run Rust tests
          command: |
            cd client/rust
            OPENSYSML_GRPC_BINARY="$PWD/../../bin/sysml-grpc" \
            OPENSYSML_REQUIRE_SERVICE=1 \
              cargo test --workspace

      - run:
          name: Run Rust conformance
          command: make conformance-rust

      - run:
          name: Package Rust client
          command: cd client/rust && cargo package -p opensysml

      - run:
          name: Install Buf
          command: |
            curl -fsSL -o /tmp/buf \
              https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
            echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
            chmod +x /tmp/buf
            /tmp/buf --version

      - run:
          name: Verify Rust generated artifacts
          command: |
            make BUF=/tmp/buf proto-rust
            git add -N client/rust/opensysml/src/proto client/rust/conformance/sysml.descriptor.binpb
            git diff --exit-code client/rust/opensysml/src/proto client/rust/conformance/sysml.descriptor.binpb

      - store_artifacts:
          path: bin/conformance-report-rust.json
          destination: conformance-report-rust.json

  # The Julia client: Pkg.test plus the conformance suite, against a service
  # binary built here (this executor has no Go toolchain, so the orb installs
  # it like the Rust job does).
  julia-client:
    executor: julia-executor
    steps:
      - checkout

      # The julia image carries no make, which the build and conformance steps
      # run; it runs as root, so apt needs no sudo.
      - run:
          name: Install make
          command: |
            apt-get update
            apt-get install -y --no-install-recommends make
            make --version | head -1

      - go/install:
          version: "1.25.0"

      - run:
          name: Build sysml-grpc
          command: make build-grpc

      - run:
          name: Run Julia tests
          command: |
            cd client/julia/OpenSysML
            OPENSYSML_GRPC_BINARY="$PWD/../../../bin/sysml-grpc" \
              julia --project=. -e 'using Pkg; Pkg.test()'

      - run:
          name: Run Julia conformance
          command: make conformance-julia

      - store_artifacts:
          path: bin/conformance-report-julia.json
          destination: conformance-report-julia.json

  # The MATLAB client under GNU Octave: MATLAB has no CI image, so Octave is
  # the tested path (the matlab.net.http branch is exercised by no gate).
  # An Octave built without Java (the snap and the CI build) cannot spawn a
  # private child, so the job starts a service itself and hands the runner its
  # address.
  matlab-client:
    executor: octave-executor
    steps:
      - checkout

      - go/install:
          version: "1.25.0"

      - run:
          name: Install GNU Octave
          command: |
            sudo apt-get update
            sudo apt-get install -y octave

      - run:
          name: Build sysml-grpc
          command: make build-grpc

      - run:
          name: Run MATLAB client tests
          command: |
            bin/sysml-grpc -port 0 -health-port 0 -report-address > bin/octave-svc-addr &
            svc_pid=$!
            for i in $(seq 1 100); do [ -s bin/octave-svc-addr ] && break; sleep 0.1; done
            test -s bin/octave-svc-addr
            cd client/matlab/tests
            OPENSYSML_SERVICE="$(cat ../../../bin/octave-svc-addr)" octave --no-gui --eval "run_tests"
            rc=$?
            kill $svc_pid 2>/dev/null || true
            exit $rc

      - run:
          name: Run MATLAB conformance
          command: |
            bin/sysml-grpc -port 0 -health-port 0 -report-address > bin/octave-svc-addr &
            svc_pid=$!
            for i in $(seq 1 100); do [ -s bin/octave-svc-addr ] && break; sleep 0.1; done
            test -s bin/octave-svc-addr
            addr=$(cat bin/octave-svc-addr)
            octave --no-gui --eval "addpath('client/matlab'); addpath('client/matlab/conformance'); addpath('client/matlab/conformance/private'); run_conformance('--address','$addr','--report','bin/conformance-report-matlab.json')"
            rc=$?
            kill $svc_pid 2>/dev/null || true
            exit $rc

      - store_artifacts:
          path: bin/conformance-report-matlab.json
          destination: conformance-report-matlab.json

  # The Java client: unit tests, the conformance suite over both Connect
  # encodings, and the committed stubs checked against what buf generates.
  java-test:
    executor: java-executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Make the service binary executable
          command: |
            chmod +x bin/sysml-grpc
            bin/sysml-grpc -version || true

      - restore_cache:
          keys:
            - maven-v1-{{ checksum "client/java/pom.xml" }}-{{ checksum "client/java/opensysml-client/pom.xml" }}-{{ checksum "client/java/opensysml-conformance/pom.xml" }}
            - maven-v1-

      - run:
          name: Resolve dependencies
          command: mvn -B -f client/java/pom.xml -DskipTests dependency:go-offline

      - save_cache:
          key: maven-v1-{{ checksum "client/java/pom.xml" }}-{{ checksum "client/java/opensysml-client/pom.xml" }}-{{ checksum "client/java/opensysml-conformance/pom.xml" }}
          paths:
            - ~/.m2/repository

      # opensysml.requireService turns "no binary, so skip" into a failure: the
      # workspace carries one, so its absence is the bug, not a pass. `install`
      # rather than `test`, so the sources and javadoc jars a release needs are
      # built on every commit rather than first at release time.
      - run:
          name: Test and install the client
          command: |
            mvn -B -f client/java/pom.xml install -Dopensysml.requireService=true

      # The scan's Java sensor needs the dependency jars on a path it can read,
      # and ~/.m2 is this job's cache, not the workspace.
      - run:
          name: Collect the dependency jars the scan reads
          command: |
            mvn -B -q -f client/java/pom.xml dependency:copy-dependencies \
              -DincludeScope=test -DoutputDirectory=target/dependency

      # JaCoCo writes the reports during `test`, `install` writes the classes,
      # and the step above writes the jars; the scan job reads all of them.
      - persist_to_workspace:
          root: .
          paths:
            - client/java/opensysml-client/target/site/jacoco/jacoco.xml
            - client/java/opensysml-conformance/target/site/jacoco/jacoco.xml
            - client/java/opensysml-client/target/classes
            - client/java/opensysml-conformance/target/classes
            - client/java/opensysml-client/target/test-classes
            - client/java/opensysml-conformance/target/test-classes
            - client/java/opensysml-client/target/dependency
            - client/java/opensysml-conformance/target/dependency

      - run:
          name: Run the conformance suite through the client
          command: |
            mvn -B -q -f client/java/pom.xml -pl opensysml-conformance \
              dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt
            java -cp "client/java/opensysml-conformance/target/classes:$(cat /tmp/cp.txt)" \
              org.openmbee.opensysml.conformance.Main \
              -binary bin/sysml-grpc -protocols connect,connect-json -allow-skips \
              -report bin/conformance-report-java.json

      - store_test_results:
          path: client/java/opensysml-client/target/surefire-reports

      - store_artifacts:
          path: bin/conformance-report-java.json

      - store_artifacts:
          path: client/java/opensysml-client/target

      # The committed Java stubs are checked in go-static, which has the Go
      # toolchain the one buf template needs.

  # The npm client's gate. The service binary comes from the workspace because
  # this executor has no Go toolchain to build one with, and both the tests and
  # the conformance run start private children from it.
  node-test:
    executor: node-executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Install the client's dependencies
          command: |
            cd client/node
            npm ci

      - run:
          name: Build the package
          command: |
            cd client/node
            npm run build

      - run:
          name: Typecheck
          command: |
            cd client/node
            npm run typecheck

      - run:
          name: Lint
          command: |
            cd client/node
            npm run lint

      # The verification tests ask the service solver-backed questions; the
      # solver is an external process the service finds on PATH.
      - run:
          name: Install Z3
          command: |
            sudo apt-get update
            sudo apt-get install -y z3
            z3 --version

      - run:
          name: Run the tests
          command: |
            chmod +x bin/sysml-grpc
            export OPENSYSML_BINARY="$(pwd)/bin/sysml-grpc"
            make node-coverage

      # The scan job reads this report; without it every TypeScript line counts
      # as uncovered.
      - persist_to_workspace:
          root: .
          paths:
            - coverage-node.lcov

      # --allow-skips because three scenarios (parse/naming_no_source_is_invalid,
      # parse_sources/naming_no_document_is_invalid and
      # parse_sources/two_documents_of_one_name_are_invalid) ask for a request
      # the client's public API refuses before asking the service; the skipped
      # count is reported and the artifact records which scenarios they were.
      - run:
          name: Run the conformance suite through the client
          command: |
            export OPENSYSML_BINARY="$(pwd)/bin/sysml-grpc"
            cd client/node
            npm run conformance -- --binary "$OPENSYSML_BINARY" --allow-skips \
              --report /tmp/node-conformance.json

      # A runner that passes against a deliberately broken client tests nothing.
      - run:
          name: Check the conformance runner catches a broken client
          command: |
            export OPENSYSML_BINARY="$(pwd)/bin/sysml-grpc"
            cd client/node
            for mutation in hide-capability drop-diagnostics blank-symbol-kind shift-integer drop-feature-values; do
              if npm run conformance -- --binary "$OPENSYSML_BINARY" --allow-skips \
                   --protocols connect --mutate "$mutation" > /dev/null 2>&1; then
                echo "Error: the suite passed with the $mutation mutation applied"
                exit 1
              fi
              echo "ok: $mutation is caught"
            done

      - store_artifacts:
          path: /tmp/node-conformance.json
          destination: node-conformance.json

      # This executor has no Go toolchain, so buf comes from the official release
      # rather than `go run`, pinned by digest so a substituted asset is not run.
      - run:
          name: Install buf
          command: |
            curl -fsSL -o /tmp/buf \
              https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
            echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
            sudo install -m 0755 /tmp/buf /usr/local/bin/buf
            buf --version

      # Committed stubs must be what buf generates, or the checked-in client and
      # the schema can drift apart silently.
      - run:
          name: Verify the committed TypeScript stubs are current
          command: |
            make proto-ts BUF=buf
            git add -N client/node/src/generated
            git diff --exit-code client/node/src/generated

  # Builds the opensysml wheel and sdist on a core `v<version>` tag, which must name
  # the declared version; build-release and publish-pypi ship exactly these bytes.
  build-python-package:
    executor: python-executor
    steps:
      - checkout
      - rehearsal-tag
      # dist/grpc from build-release-binaries: the service binaries whose
      # digests the distribution ships.
      - attach_workspace:
          at: .

      - run:
          name: Install build tooling
          command: python -m pip install --upgrade pip build twine packaging

      - run:
          name: Resolve the version from the tag
          command: |
            # Fails loudly when the tag names a version other than the one the
            # package would publish, before anything is built.
            VERSION="$(python client/python/scripts/check_version.py)"
            PRE_RELEASE="$(python client/python/scripts/check_version.py --pre-release)"
            # The Node client is published at the same version, so a
            # client/node/package.json that disagrees fails the release here,
            # before anything is built; the Java client's pom and the Rust
            # crate's Cargo.toml the same.
            NPM_VERSION="$(python client/python/scripts/check_version.py --node)"
            JAVA_VERSION="$(python client/python/scripts/check_version.py --java)"
            RUST_VERSION="$(python client/python/scripts/check_version.py --rust)"
            # Nothing publishes the editors, but their manifests carry the same
            # version, so a tag fails here when one disagrees; no export needed.
            python client/python/scripts/check_version.py --editors > /dev/null
            echo "export OPENSYSML_VERSION=${VERSION}" >> "$BASH_ENV"
            echo "export NPM_VERSION=${NPM_VERSION}" >> "$BASH_ENV"
            echo "export JAVA_VERSION=${JAVA_VERSION}" >> "$BASH_ENV"
            echo "export RUST_VERSION=${RUST_VERSION}" >> "$BASH_ENV"
            echo "Building opensysml ${VERSION} (pre-release: ${PRE_RELEASE}, npm ${NPM_VERSION}, maven ${JAVA_VERSION}, crates ${RUST_VERSION})"

      # The committed table pins the releases that existed when it was last
      # back-filled, never the one being cut, so the wheel would otherwise rely
      # on the signed manifest (and the sigstore package at runtime) to install
      # its own release. Hashing the binaries build-release-binaries produced
      # pins this release in the table the distribution ships; the checkout's
      # copy is left for the release's commit to back-fill, as it is today.
      - run:
          name: Stamp this release's service digests into the distribution
          command: |
            ls -l dist/grpc
            python client/python/scripts/pin_release_checksums.py \
              --version "${CIRCLE_TAG}" \
              --from-binaries dist/grpc \
              --table client/python/opensysml/release-digests.json
            git diff --stat -- client/python/opensysml/release-digests.json

      - run:
          name: Build the wheel and the sdist
          command: |
            rm -rf client/python/dist
            python -m build --outdir client/python/dist client/python/
            ls -l client/python/dist
            # The version is PEP 440 in canonical form, so these are the names
            # the build tools give the files; the release jobs rely on them.
            ls client/python/dist/"opensysml-${OPENSYSML_VERSION}-py3-none-any.whl" \
               client/python/dist/"opensysml-${OPENSYSML_VERSION}.tar.gz" > /dev/null

      - run:
          name: Check the metadata (twine check --strict)
          command: python -m twine check --strict client/python/dist/*

      - run:
          name: Install the built wheel into a clean virtualenv and import it
          command: |
            # A broken artifact fails the job rather than PyPI.
            python -m venv /tmp/verify-wheel
            /tmp/verify-wheel/bin/python -m pip install --upgrade pip
            /tmp/verify-wheel/bin/python -m pip install client/python/dist/*.whl
            # The backslash is CircleCI's escape for a literal heredoc operator
            # in a 2.1 config; the shell sees a plain heredoc.
            /tmp/verify-wheel/bin/python - \<<'EOF'
            import os
            import opensysml
            expected = os.environ["OPENSYSML_VERSION"]
            assert opensysml.__version__ == expected, (
                f"installed wheel reports {opensysml.__version__}, expected {expected}"
            )
            print(f"opensysml {opensysml.__version__} imported from the built wheel")
            EOF

      # The crate job's assertion, for the wheel and the sdist: a distribution
      # whose table lacks any of the five service assets for the tag, or pins a
      # digest other than the one its binary hashes to, fails the job here. The
      # installed wheel is asked too, through the lookup connect() makes.
      - run:
          name: Verify the distribution embeds this release's service digests
          command: |
            /tmp/verify-wheel/bin/python - "${CIRCLE_TAG}" client/python/dist/opensysml-*-py3-none-any.whl client/python/dist/opensysml-[0-9]*.tar.gz \<<'EOF'
            import hashlib
            import json
            import os
            import sys
            import tarfile
            import zipfile

            from opensysml.binary import pinned_digest

            tag, wheel_path, sdist_path = sys.argv[1:]
            required = {
                "sysml-grpc-darwin-amd64",
                "sysml-grpc-darwin-arm64",
                "sysml-grpc-linux-amd64",
                "sysml-grpc-linux-arm64",
                "sysml-grpc-windows-amd64.exe",
            }
            built = {}
            for asset in sorted(required):
                with open(os.path.join("dist", "grpc", asset), "rb") as f:
                    built[asset] = hashlib.sha256(f.read()).hexdigest()

            def check(what, table):
                digests = table.get("Open-MBEE/OpenSysML", {}).get(tag, {})
                missing = sorted(required - digests.keys())
                if missing:
                    raise SystemExit(
                        f"Error: {what} has no complete digest pin for {tag}: "
                        f"{', '.join(missing)}"
                    )
                wrong = sorted(a for a in required if digests[a] != built[a])
                if wrong:
                    raise SystemExit(
                        f"Error: {what} pins a digest for {tag} other than the one "
                        f"its binary hashes to: {', '.join(wrong)}"
                    )
                print(f"Verified {what} embeds all five service digests for {tag}.")

            with zipfile.ZipFile(wheel_path) as wheel:
                with wheel.open("opensysml/release-digests.json") as member:
                    check("the wheel", json.load(member))
            with tarfile.open(sdist_path, "r:gz") as sdist:
                name = next(
                    (n for n in sdist.getnames() if n.endswith("/opensysml/release-digests.json")),
                    None,
                )
                if name is None:
                    raise SystemExit("Error: the sdist has no opensysml/release-digests.json.")
                with sdist.extractfile(name) as member:
                    check("the sdist", json.load(member))
            unpinned = sorted(a for a in required if pinned_digest(tag, a) != built[a])
            if unpinned:
                raise SystemExit(
                    f"Error: the installed wheel does not pin {tag} for: {', '.join(unpinned)}"
                )
            print(f"Verified the installed wheel pins {tag} for every service asset.")
            EOF

      - store_artifacts:
          path: client/python/dist
          destination: opensysml-dist

      - persist_to_workspace:
          root: .
          paths:
            - client/python/dist

  # Runs the built wheel against the release published by the same workflow.
  python-zero-config-smoke:
    executor: python-executor
    steps:
      - checkout
      - rehearsal-tag
      - attach_workspace:
          at: .

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: Install the built wheel in a fresh virtualenv
                command: |
                  python -m venv /tmp/verify-zero-config
                  /tmp/verify-zero-config/bin/python -m pip install --upgrade pip
                  /tmp/verify-zero-config/bin/python -m pip install client/python/dist/opensysml-*.whl

            - run:
                name: Load and evaluate a model without binary configuration
                command: |
                  set -eu
                  home="$(mktemp -d)"
                  trap 'rm -rf "$home"' EXIT
                  env -u OPENSYSML_BINARY -u OPENSYSML_GRPC_VERSION \
                    HOME="$home" PATH="/tmp/verify-zero-config/bin:/usr/bin:/bin" \
                    /tmp/verify-zero-config/bin/python - \<<'EOF'
                  import json
                  import os
                  from pathlib import Path

                  import opensysml

                  model_path = Path(os.environ["HOME"]) / "Demo.sysml"
                  model_path.write_text(
                      """package Demo {
                        part def Vehicle { attribute mass default = 1500.0; }
                        part sedan : Vehicle { attribute :>> mass = 1800.0; }
                      }""",
                      encoding="utf-8",
                  )
                  model = opensysml.load(str(model_path), strict=True)
                  actual = model.eval("mass", subject="Demo::sedan")
                  assert actual == 1800.0, actual
                  print(actual)

                  metadata = Path(os.environ["HOME"]) / ".opensysml" / "bin" / "sysml-grpc.json"
                  cached = json.loads(metadata.read_text())
                  expected = os.environ["CIRCLE_TAG"]
                  assert cached["version"] == expected, (cached["version"], expected)
                  print(f"cached release: {cached['version']}")
                  EOF
      - rehearsal-skip:
          what: "the zero-config binary smoke test (the rehearsal publishes no GitHub release)"

  # Uploads the distribution build-python-package made. PyPI has no OIDC publishing
  # for CircleCI (pypi/warehouse#13888), so a token from the `PyPI` context is used.
  publish-pypi:
    executor: python-executor
    steps:
      - checkout
      - rehearsal-tag
      - attach_workspace:
          at: .

      - run:
          name: Install publishing tooling
          command: python -m pip install --upgrade pip twine packaging

      - run:
          name: Resolve the version from the tag
          command: |
            VERSION="$(python client/python/scripts/check_version.py)"
            PRE_RELEASE="$(python client/python/scripts/check_version.py --pre-release)"
            echo "export OPENSYSML_VERSION=${VERSION}" >> "$BASH_ENV"
            echo "export OPENSYSML_PRE_RELEASE=${PRE_RELEASE}" >> "$BASH_ENV"
            echo "Publishing opensysml ${VERSION} (pre-release: ${PRE_RELEASE})"
            # The distribution must be the one build-python-package made for this tag.
            ls -l client/python/dist/"opensysml-${VERSION}-py3-none-any.whl" \
                  client/python/dist/"opensysml-${VERSION}.tar.gz"

      - run:
          name: Require the publishing token
          command: |
            # A pre-release version goes to TestPyPI (the dry run described in
            # docs/project/releasing.md), everything else to PyPI, so only the token for
            # the index actually being used is required.
            if [ "$OPENSYSML_PRE_RELEASE" = "yes" ]; then
              if [ -z "${TEST_PYPI_API_TOKEN:-}" ]; then
                echo "Error: TEST_PYPI_API_TOKEN is not set, and ${CIRCLE_TAG} names a"
                echo "pre-release version, which is published to TestPyPI."
                echo "Add it to the 'PyPI' context (Organization Settings ->"
                echo "Contexts) as a TestPyPI API token. See docs/project/releasing.md."
                exit 1
              fi
            elif [ -z "${PYPI_API_TOKEN:-}" ]; then
              echo "Error: PYPI_API_TOKEN is not set. This job authenticates to PyPI"
              echo "with an API token, not OIDC, and refuses to run twine without one"
              echo "rather than failing later with a 403."
              echo "Add it to the 'PyPI' context (Organization Settings ->"
              echo "Contexts) and make sure this job references that context."
              echo "See docs/project/releasing.md."
              exit 1
            fi

      - run:
          name: Refuse a version the index already has
          command: |
            if [ "$OPENSYSML_PRE_RELEASE" = "yes" ]; then
              INDEX_HOST="test.pypi.org"
            else
              INDEX_HOST="pypi.org"
            fi
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://${INDEX_HOST}/pypi/opensysml/${OPENSYSML_VERSION}/json")
            if [ "$STATUS" = "200" ]; then
              echo "Error: opensysml ${OPENSYSML_VERSION} is already on ${INDEX_HOST}."
              echo "A PyPI version is immutable: it can be yanked but never replaced,"
              echo "so this job fails rather than half-publishing. If this is a"
              echo "re-run of an already published release, this failure is expected"
              echo "and the package needs no action: publish-github-release replaces"
              echo "the GitHub assets on its own. If the package itself must change,"
              echo "that is a new core release: bump the version in"
              echo "client/python/opensysml/_version.py and tag v<new version>."
              exit 1
            fi
            echo "${INDEX_HOST} has no opensysml ${OPENSYSML_VERSION} (HTTP ${STATUS}); continuing"

      - run:
          name: Check the metadata (twine check --strict)
          command: python -m twine check --strict client/python/dist/*

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: Upload to the index
                command: |
                  # The token is read straight into twine's environment: nothing here
                  # echoes it, and nothing in this job prints the environment.
                  export TWINE_USERNAME=__token__
                  if [ "$OPENSYSML_PRE_RELEASE" = "yes" ]; then
                    export TWINE_REPOSITORY_URL=https://test.pypi.org/legacy/
                    export TWINE_PASSWORD="$TEST_PYPI_API_TOKEN"
                    echo "Uploading opensysml ${OPENSYSML_VERSION} to TestPyPI"
                  else
                    export TWINE_PASSWORD="$PYPI_API_TOKEN"
                    echo "Uploading opensysml ${OPENSYSML_VERSION} to PyPI"
                  fi
                  # No --skip-existing: a version that appeared since the check above
                  # must fail the job rather than pass silently.
                  python -m twine upload client/python/dist/*
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: no twine upload"
                command: |
                  echo "REHEARSAL: PyPI has no read-only token check; the token's presence was checked above."
      - rehearsal-skip:
          what: "twine upload"

  # Publishes packaging/pypi-pysysml on a `pysysml-v<version>` tag: the final
  # release of the pre-rename name, which raises on import to point at
  # opensysml. It shares the `PyPI` context, and like publish-pypi refuses to
  # run without a token or to overwrite a version the index already has.
  publish-pypi-pysysml:
    executor: python-executor
    steps:
      - checkout

      - run:
          name: Install build tooling
          command: python -m pip install --upgrade pip build twine packaging

      - run:
          name: Require the publishing token
          command: |
            if [ -z "${PYPI_API_TOKEN:-}" ]; then
              echo "Error: PYPI_API_TOKEN is not set. Add it to the 'PyPI' context"
              echo "(Organization Settings -> Contexts). See docs/project/releasing.md."
              exit 1
            fi

      - run:
          name: Resolve the version from the tag
          command: |
            # The placeholder has no _version.py to read, so the version comes
            # from its pyproject and the tag has to name it.
            DECLARED=$(sed -n 's/^version = "\(.*\)"/\1/p' packaging/pypi-pysysml/pyproject.toml)
            TAGGED=${CIRCLE_TAG#pysysml-v}
            if [ -z "$DECLARED" ] || [ "$DECLARED" != "$TAGGED" ]; then
              echo "Error: ${CIRCLE_TAG} names ${TAGGED}, but"
              echo "packaging/pypi-pysysml/pyproject.toml declares '${DECLARED}'."
              exit 1
            fi
            echo "export PYSYSML_PLACEHOLDER_VERSION=${DECLARED}" >> "$BASH_ENV"

      - run:
          name: Refuse a version the index already has
          command: |
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/pysysml/${PYSYSML_PLACEHOLDER_VERSION}/json")
            if [ "$STATUS" = "200" ]; then
              echo "Error: pysysml ${PYSYSML_PLACEHOLDER_VERSION} is already on PyPI,"
              echo "and a version can be yanked but never re-uploaded."
              exit 1
            fi
            echo "pypi.org has no pysysml ${PYSYSML_PLACEHOLDER_VERSION} (HTTP ${STATUS}); continuing"

      - run:
          name: Build the wheel and the sdist
          command: |
            rm -rf packaging/pypi-pysysml/dist
            python -m build --outdir packaging/pypi-pysysml/dist packaging/pypi-pysysml/
            ls -l packaging/pypi-pysysml/dist

      - run:
          name: Check the metadata (twine check --strict)
          command: python -m twine check --strict packaging/pypi-pysysml/dist/*

      - run:
          name: Install the built wheel and require the import to fail
          command: |
            # The artifact is only correct if importing it raises: a wheel that
            # imported cleanly would be the alias this release refuses to be.
            python -m venv /tmp/verify-placeholder
            /tmp/verify-placeholder/bin/python -m pip install --upgrade pip
            /tmp/verify-placeholder/bin/python -m pip install packaging/pypi-pysysml/dist/*.whl
            /tmp/verify-placeholder/bin/python - \<<'EOF'
            try:
                import pysysml
            except ImportError as err:
                assert "pip install opensysml" in str(err), str(err)
                print("pysysml placeholder raises ImportError as intended")
            else:
                raise SystemExit("the placeholder imported cleanly; it must raise")
            EOF

      - run:
          name: Upload to PyPI
          command: |
            export TWINE_USERNAME=__token__
            export TWINE_PASSWORD="$PYPI_API_TOKEN"
            echo "Uploading pysysml ${PYSYSML_PLACEHOLDER_VERSION} to PyPI"
            python -m twine upload packaging/pypi-pysysml/dist/*

      - store_artifacts:
          path: packaging/pypi-pysysml/dist
          destination: pysysml-placeholder-dist

  # Builds every binary a release publishes, so build-python-package can stamp
  # the service digests into the distribution before build-release writes and
  # signs the manifest that lists both.
  build-release-binaries:
    executor: go-executor
    steps:
      - checkout
      - rehearsal-tag
      - go/load-cache
      - go/mod-download
      - go/save-cache
      
      - run:
          name: Build release binaries
          command: |
            VERSION=${CIRCLE_TAG}
            COMMIT=${CIRCLE_SHA1}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')
            
            # Build for multiple platforms using make
            mkdir -p dist
            
            GOOS=linux GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-windows-amd64.exe
            
            GOOS=linux GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-windows-amd64.exe
            
            # The gRPC service backs the Python client, which downloads one
            # file per platform and verifies it against a .sha256 sidecar, so
            # these are published raw rather than archived. They are built into
            # a subdirectory to keep them out of the archive globs below.
            mkdir -p dist/grpc
            
            GOOS=linux GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-windows-amd64.exe

            # The Node client ships this combined WebAssembly module and matching Go runtime.
            mkdir -p dist/wasm
            make build-release-wasm VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/wasm/release/sysml-wasm.wasm bin/wasm/release/wasm_exec.js dist/wasm/
            
            # Create tarballs
            cd dist
            for binary in sysml-*; do
              if [[ $binary == *.exe ]]; then
                zip "${binary%.exe}.zip" "$binary"
              else
                tar czf "${binary}.tar.gz" "$binary"
              fi
            done
            
            # Bundle archives: both binaries under their plain names
            # (sysml, sysml-lsp), which is the layout a Homebrew formula or a
            # PATH install expects, with their manual pages beside them under
            # share/man/man1 for a formula or a package to install. sysml-grpc
            # is not in the bundle, so its page is not either. The per-binary
            # archives above are kept unchanged so existing download links keep
            # working.
            for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
              stage="stage/${platform}"
              mkdir -p "$stage/share/man/man1"
              cp "sysml-${platform}" "${stage}/sysml"
              cp "sysml-lsp-${platform}" "${stage}/sysml-lsp"
              cp ../packaging/man/man1/sysml.1 ../packaging/man/man1/sysml-lsp.1 "${stage}/share/man/man1/"
              tar czf "opensysml-${platform}.tar.gz" -C "$stage" sysml sysml-lsp share
            done
            mkdir -p stage/windows-amd64
            cp sysml-windows-amd64.exe stage/windows-amd64/sysml.exe
            cp sysml-lsp-windows-amd64.exe stage/windows-amd64/sysml-lsp.exe
            (cd stage/windows-amd64 && zip -q ../../opensysml-windows-amd64.zip sysml.exe sysml-lsp.exe)
            rm -rf stage
            
            # The checksum manifest and the per-file sidecars are
            # build-release's, once the Python distribution exists to list.
            ls -l . grpc

      # A Linux binary linked against this executor's glibc would not start on
      # older distributions; the Makefile builds without cgo, and this proves it.
      - run:
          name: Verify the Linux binaries are statically linked
          command: |
            scripts/check-static-binaries.sh \
              dist/sysml-linux-amd64 dist/sysml-linux-arm64 \
              dist/sysml-lsp-linux-amd64 dist/sysml-lsp-linux-arm64 \
              dist/grpc/sysml-grpc-linux-amd64 dist/grpc/sysml-grpc-linux-arm64

      # A binary whose version disagrees with its tag looks identical on the
      # release page. The host-platform builds are asked what they report; the
      # cross-compiled ones cannot run here, so they are checked for the version
      # string the ldflags should have written into them.
      - run:
          name: Verify the built binaries report the tag
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a tag"
              exit 1
            fi
            status=0
            fail() {
              echo "Error: $1 does not carry the tag ${CIRCLE_TAG} it is being"
              echo "released as: $2. The version ldflags (see the Makefile's"
              echo "LDFLAGS) did not reach this build; nothing was published."
              status=1
            }
            for binary in dist/sysml-linux-amd64 dist/sysml-lsp-linux-amd64 \
                          dist/grpc/sysml-grpc-linux-amd64; do
              reported="$("$binary" --version 2>&1 | head -n 1)"
              case " $reported " in
                *" ${CIRCLE_TAG} "*) echo "ok: $binary reports ${CIRCLE_TAG}" ;;
                *) fail "$binary" "it reports '${reported}'" ;;
              esac
            done
            for binary in dist/sysml-* dist/grpc/sysml-grpc-* dist/wasm/sysml-wasm.wasm; do
              case "$binary" in
                *.tar.gz|*.zip|*.sha256) continue ;;
                dist/sysml-linux-amd64|dist/sysml-lsp-linux-amd64) continue ;;
                dist/grpc/sysml-grpc-linux-amd64) continue ;;
              esac
              if grep -qa -- "${CIRCLE_TAG}" "$binary"; then
                echo "ok: $binary carries ${CIRCLE_TAG}"
              else
                fail "$binary" "the version string is absent from the binary"
              fi
            done
            exit $status

      - persist_to_workspace:
          root: .
          paths:
            - dist

  # Assembles the release from the binaries and the Python distribution the
  # upstream jobs built, writes the one checksum manifest covering both, and
  # signs it. Nothing is rebuilt here: the bytes hashed, signed and published
  # are the bytes those jobs verified.
  build-release:
    executor: go-executor
    steps:
      - checkout
      - rehearsal-tag
      - attach_workspace:
          at: .
      - go/load-cache
      - go/mod-download
      - go/save-cache

      - run:
          name: Assemble the release and write its checksum manifest
          command: |
            cd dist
            
            # The opensysml wheel and sdist, released with the binaries they drive.
            cp ../client/python/dist/opensysml-*.whl ../client/python/dist/opensysml-*.tar.gz .
            
            # Checksums over every published archive, so a Homebrew formula
            # (or a careful user) can verify a download.
            sha256sum ./*.tar.gz ./*.zip ./*.whl | sed 's|\./||' > SHA256SUMS.txt
            
            # Same for the raw gRPC binaries, plus a per-file sidecar, which is
            # the only checksum opensysml reads.
            (cd grpc && sha256sum sysml-grpc-* >> ../SHA256SUMS.txt)
            (cd grpc && for f in sysml-grpc-*; do sha256sum "$f" > "$f.sha256"; done)
            (cd wasm && sha256sum sysml-wasm.wasm wasm_exec.js >> ../SHA256SUMS.txt)
            (cd wasm && for f in sysml-wasm.wasm wasm_exec.js; do sha256sum "$f" > "$f.sha256"; done)
            cat SHA256SUMS.txt

      # The distribution was stamped from the binaries before the manifest
      # existed; this proves the manifest about to be signed lists the digests
      # it pins, so the wheel vouches for exactly the binaries released with it.
      - run:
          name: Verify the Python distribution pins the service digests the manifest lists
          command: |
            python3 - "${CIRCLE_TAG}" dist/SHA256SUMS.txt dist/opensysml-*-py3-none-any.whl \<<'EOF'
            import json
            import sys
            import zipfile

            tag, manifest_path, wheel_path = sys.argv[1:]
            listed = {}
            with open(manifest_path, encoding="utf-8") as manifest:
                for line in manifest:
                    fields = line.split()
                    if len(fields) != 2 or not fields[1].startswith("sysml-grpc-"):
                        continue
                    if not fields[1].endswith(".sha256"):
                        listed[fields[1]] = fields[0]
            with zipfile.ZipFile(wheel_path) as wheel:
                with wheel.open("opensysml/release-digests.json") as member:
                    pinned = json.load(member).get("Open-MBEE/OpenSysML", {}).get(tag, {})
            if len(listed) != 5 or pinned != listed:
                raise SystemExit(
                    f"Error: the wheel pins {json.dumps(pinned, indent=2, sort_keys=True)} "
                    f"for {tag}, but the manifest lists "
                    f"{json.dumps(listed, indent=2, sort_keys=True)}; nothing was signed."
                )
            print(f"Verified the wheel pins the five service digests the manifest lists for {tag}.")
            EOF

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            # Signs the manifest keylessly: the certificate identity comes from this
            # job's CircleCI OIDC token, so there is no signing key to store.
            - run:
                name: Sign the checksum manifest with cosign keyless
                command: |
                  go install github.com/sigstore/cosign/v3/cmd/cosign@v3.0.3
                  export PATH="$(go env GOPATH)/bin:$PATH"

                  # Fulcio requires the 'sigstore' audience, which the ambient
                  # $CIRCLE_OIDC_TOKEN_V2 does not carry.
                  SIGSTORE_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "sigstore"}')"
                  export SIGSTORE_ID_TOKEN

                  cd dist
                  cosign sign-blob SHA256SUMS.txt \
                    --oidc-issuer "https://oidc.circleci.com/org/${CIRCLE_ORGANIZATION_ID}" \
                    --bundle SHA256SUMS.txt.bundle \
                    --use-signing-config=false \
                    --yes

            # Fails the release rather than publish a signature the client's pinned
            # identity would reject, and prints the identity that signed.
            - run:
                name: Verify the signature against the identity clients pin
                command: |
                  export PATH="$(go env GOPATH)/bin:$PATH"
                  cd dist
                  cosign verify-blob SHA256SUMS.txt \
                    --bundle SHA256SUMS.txt.bundle \
                    --certificate-oidc-issuer "https://oidc.circleci.com/org/${CIRCLE_ORGANIZATION_ID}" \
                    --certificate-identity-regexp "^https://circleci\\.com/api/v2/projects/${CIRCLE_PROJECT_ID}/pipeline-definitions/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"
                  echo "Signed by:"
                  jq -r '.verificationMaterial.certificate.rawBytes' SHA256SUMS.txt.bundle \
                    | base64 -d | openssl x509 -inform DER -noout -text \
                    | grep -A1 -E '1\.3\.6\.1\.4\.1\.57264\.1\.8:|URI:' || true

            # SLSA provenance over every artifact the manifest lists, signed under the
            # same CircleCI identity as the manifest; the bundle carries the statement.
            - run:
                name: Attest the release's SLSA provenance with cosign keyless
                command: |
                  export PATH="$(go env GOPATH)/bin:$PATH"
                  python3 scripts/release-provenance.py \
                    --manifest dist/SHA256SUMS.txt --out dist/provenance.intoto.json
                  SIGSTORE_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "sigstore"}')"
                  export SIGSTORE_ID_TOKEN

                  cd dist
                  cosign attest-blob SHA256SUMS.txt \
                    --statement provenance.intoto.json \
                    --type slsaprovenance1 \
                    --oidc-issuer "https://oidc.circleci.com/org/${CIRCLE_ORGANIZATION_ID}" \
                    --bundle provenance.intoto.json.bundle \
                    --use-signing-config=false \
                    --yes

            # Verifies the attestation against a published artifact, so a statement
            # whose subjects do not name the release's bytes fails the release here.
            - run:
                name: Verify the provenance names the artifacts under the identity clients pin
                command: |
                  export PATH="$(go env GOPATH)/bin:$PATH"
                  cd dist
                  for artifact in opensysml-linux-amd64.tar.gz grpc/sysml-grpc-linux-amd64 wasm/sysml-wasm.wasm opensysml-*-py3-none-any.whl; do
                    cosign verify-blob-attestation "$artifact" \
                      --bundle provenance.intoto.json.bundle \
                      --type slsaprovenance1 \
                      --certificate-oidc-issuer "https://oidc.circleci.com/org/${CIRCLE_ORGANIZATION_ID}" \
                      --certificate-identity-regexp "^https://circleci\\.com/api/v2/projects/${CIRCLE_PROJECT_ID}/pipeline-definitions/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"
                    echo "ok: provenance names $artifact"
                  done
                  # Every manifest line must be a subject, and nothing else may be.
                  diff <(sed 's/^\([0-9a-f]*\)  \(.*\)$/\2 \1/' SHA256SUMS.txt | sort) \
                       <(jq -r '.dsseEnvelope.payload' provenance.intoto.json.bundle | base64 -d \
                         | jq -r '.subject[] | "\(.name) \(.digest.sha256)"' | sort)

      
      - rehearsal-skip:
          what: "cosign keyless signing and attestation (they write to the public Rekor log)"
      - run:
          name: Verify the release carries the tag's Python distribution
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a tag"
              exit 1
            fi
            status=0
            fail() {
              echo "Error: $1 is not the distribution for the tag ${CIRCLE_TAG} it is"
              echo "being released as: $2. Nothing was published."
              status=1
            }
            # build-python-package named the Python distribution after the tag's
            # version (SemVer 'v0.9.0-rc1' is PEP 440 '0.9.0rc1'); one of each is due.
            # The sdist is the one opensysml-*.tar.gz whose name continues with a digit;
            # the platform archives (opensysml-linux-amd64.tar.gz, ...) continue with a letter.
            for pattern in "dist/opensysml-*-py3-none-any.whl" "dist/opensysml-[0-9]*.tar.gz"; do
              set -- $pattern
              if [ ! -f "$1" ]; then
                fail "$pattern" "build-python-package did not produce it"
              elif [ $# -ne 1 ]; then
                fail "$pattern" "matches $# files, not one"
              else
                echo "ok: $1 is the distribution for ${CIRCLE_TAG}"
              fi
            done
            exit $status

      - store_artifacts:
          path: dist/
          destination: release-binaries

      # Workspace layers are additive and a path persisted by two upstream jobs
      # fails the downstream attach, so only what this job wrote is persisted:
      # the binaries and archives stay in build-release-binaries' layer.
      - persist_to_workspace:
          root: .
          paths:
            - dist/SHA256SUMS.txt
            - dist/grpc/*.sha256
            - dist/wasm/*.sha256
            - dist/opensysml-*-py3-none-any.whl
            - dist/opensysml-[0-9]*.tar.gz
      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - persist_to_workspace:
                root: .
                paths:
                  - dist/SHA256SUMS.txt.bundle
                  - dist/provenance.intoto.json
                  - dist/provenance.intoto.json.bundle

  # Publishes @openmbee/opensysml and its five per-platform packages from the
  # core `v<version>` tag, carrying the sysml-grpc binaries build-release
  # published — the same bytes as the GitHub release. npm has no trusted
  # publishing for CircleCI, so this authenticates with a granular token from
  # the restricted `npm` context. Everything that can fail runs before the
  # first publish: the tag/version check, the registry check, the token, the
  # client's own gate, and the digest check on every binary. The platform
  # packages go first, because the client's optionalDependencies name them at
  # this exact version.
  publish-npm:
    executor: node-executor
    steps:
      - checkout
      - rehearsal-tag

      - attach_workspace:
          at: .

      - run:
          name: Resolve the version from the tag
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a core v* tag."
              exit 1
            fi
            version=$(node -p "require('./client/node/package.json').version")
            # npm publishes the version package.json declares, so the tag must
            # spell it exactly; build-python-package has already checked
            # package.json against _version.py.
            if [ "${CIRCLE_TAG}" != "v${version}" ]; then
              echo "Error: tag ${CIRCLE_TAG} does not match client/node/package.json"
              echo "version ${version}; the tag for it is v${version}. Nothing was published."
              exit 1
            fi
            # check_version.py admits only alpha/beta/rc suffixes, so a SemVer
            # pre-release here is exactly a PEP 440 pre-release — the ones
            # publish-pypi routes to TestPyPI. npm has no test registry, so a
            # pre-release goes to the `next` dist-tag and `latest` is untouched.
            case "$version" in
              *-*) dist_tag=next ;;
              *) dist_tag=latest ;;
            esac
            echo "export NPM_VERSION=${version}" >> "$BASH_ENV"
            echo "export NPM_DIST_TAG=${dist_tag}" >> "$BASH_ENV"
            echo "Publishing ${version} to the '${dist_tag}' dist-tag"
            # Proves the workspace carries the release binaries and sidecars.
            ls -l dist/grpc/sysml-grpc-*
            ls -l dist/wasm/sysml-wasm.wasm dist/wasm/wasm_exec.js \
              dist/wasm/sysml-wasm.wasm.sha256 dist/wasm/wasm_exec.js.sha256

      # The package's own copy of the table is the only pin the published
      # client carries; stamping it here, from build-release's binaries, is
      # what lets @openmbee/opensysml download this release without sigstore.
      # The shared client/release-digests.json is not touched, so the
      # sync check elsewhere in this pipeline is unaffected.
      - run:
          name: Stamp this release's service digests into the package
          command: |
            if ! command -v python3 >/dev/null; then
              sudo apt-get update -q && sudo apt-get install -yq python3
            fi
            python3 client/python/scripts/pin_release_checksums.py \
              --version "${CIRCLE_TAG}" \
              --from-binaries dist/grpc \
              --table client/node/release-digests.json
            git diff --stat

      - run:
          name: Require the publishing token
          command: |
            # Checked early so a missing token fails before anything else;
            # never echoed. The 'npm' context supplies it — see
            # docs/project/releasing.md.
            if [ -z "${NPM_TOKEN}" ]; then
              echo "Error: NPM_TOKEN is not set; the restricted 'npm' context supplies it."
              echo "See docs/project/releasing.md for how to provision it."
              exit 1
            fi

      - run:
          name: Refuse a version already on the registry
          command: |
            # The package names come from package.json, not a literal list:
            # the client, platform binaries and optional WASM peer. Anything
            # but seven means the manifest drifted.
            names=$(node -e "
              const pkg = require('./client/node/package.json');
              const platforms = Object.keys(pkg.optionalDependencies || {})
                .filter(n => n.startsWith(pkg.name + '-sysml-grpc-'));
              const wasm = Object.keys(pkg.peerDependencies || {})
                .filter(n => n.startsWith(pkg.name + '-wasm'));
              console.log([pkg.name, ...platforms, ...wasm].join('\n'));
            ")
            count=$(echo "$names" | wc -l)
            if [ "$count" -ne 7 ]; then
              echo "Error: expected 7 packages to publish (client + 5 platform + WASM),"
              echo "package.json yields $count:"
              echo "$names"
              exit 1
            fi
            for name in $names; do
              if npm view "${name}@${NPM_VERSION}" version > /dev/null 2>&1; then
                echo "Error: ${name}@${NPM_VERSION} is already published; a version cannot be"
                echo "replaced. Bump client/node/package.json and cut the next core release."
                exit 1
              fi
            done

      - run:
          name: Build and test the package
          command: |
            chmod +x dist/grpc/sysml-grpc-linux-amd64
            export OPENSYSML_BINARY="$(pwd)/dist/grpc/sysml-grpc-linux-amd64"
            # Makes the suite assert that the table just stamped pins this tag.
            export OPENSYSML_EXPECT_PINNED_RELEASE="${CIRCLE_TAG}"
            cd client/node
            npm ci
            npm run build
            npm run typecheck
            npm run lint
            npm test

      - run:
          name: Build the platform and WASM packages
          command: |
            # These are build-release's bytes; the generator checks each one
            # against its .sha256 sidecar before packaging it.
            cd client/node
            npm run platform-packages -- --binaries ../../dist/grpc --wasm ../../dist/wasm

      - run:
          name: Pack the client and verify its pins
          command: |
            # The tarball packed here is the one published below, so what is
            # verified is what ships. Its table must pin this tag for every
            # service asset, with the digests of the binaries in dist/grpc.
            rm -rf dist/npm && mkdir -p dist/npm
            (cd client/node && npm pack --pack-destination ../../dist/npm)
            tarballs=$(ls dist/npm/openmbee-opensysml-*.tgz)
            if [ "$(echo "$tarballs" | wc -l)" -ne 1 ]; then
              echo "Error: expected exactly one client tarball in dist/npm:"
              echo "$tarballs"
              exit 1
            fi
            echo "export NPM_TARBALL=$(pwd)/${tarballs}" >> "$BASH_ENV"
            python3 - "${tarballs}" "${CIRCLE_TAG}" dist/grpc \<<'PY'
            import hashlib
            import json
            import os
            import sys
            import tarfile

            tarball_path, tag, binaries = sys.argv[1:]
            required = {
                "sysml-grpc-darwin-amd64",
                "sysml-grpc-darwin-arm64",
                "sysml-grpc-linux-amd64",
                "sysml-grpc-linux-arm64",
                "sysml-grpc-windows-amd64.exe",
            }
            with tarfile.open(tarball_path, "r:gz") as tarball:
                try:
                    member = tarball.extractfile("package/release-digests.json")
                except KeyError:
                    member = None
                if member is None:
                    raise SystemExit("Error: packed tarball has no release-digests.json.")
                with member:
                    table = json.load(member)

            digests = table.get("Open-MBEE/OpenSysML", {}).get(tag, {})
            missing = sorted(required - digests.keys())
            if missing:
                raise SystemExit(
                    f"Error: packed tarball has no complete digest pin for {tag}: "
                    f"{', '.join(missing)}"
                )
            for asset in sorted(required):
                with open(os.path.join(binaries, asset), "rb") as binary:
                    actual = hashlib.sha256(binary.read()).hexdigest()
                if digests[asset] != actual:
                    raise SystemExit(
                        f"Error: packed tarball pins {digests[asset]} for {asset} of {tag}, "
                        f"but the release binary is {actual}"
                    )
            print(f"Verified the packed tarball embeds all five service digests for {tag}.")
            PY

      - run:
          name: Authenticate to npm
          command: |
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            # A bad or expired token fails here, before the first publish.
            npm whoami

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            # No --provenance: the npm CLI only mints attestations on GitHub Actions and
            # GitLab CI/CD, and it fails rather than publish unattested when asked here.
            - run:
                name: Publish the WASM and per-platform packages
                command: |
                  npm publish client/node/packages/sysml-wasm --access public --tag "$NPM_DIST_TAG"
                  for directory in client/node/packages/sysml-grpc-*; do
                    npm publish "$directory" --access public --tag "$NPM_DIST_TAG"
                  done

            - run:
                name: Publish @openmbee/opensysml
                command: |
                  # The tarball verified above, not a fresh pack of the directory.
                  npm publish "$NPM_TARBALL" --access public --tag "$NPM_DIST_TAG"
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: pack every package"
                command: |
                  # The client itself was packed and verified above.
                  npm pack client/node/packages/sysml-wasm --dry-run
                  for directory in client/node/packages/sysml-grpc-*; do
                    npm pack "$directory" --dry-run
                  done
      - rehearsal-skip:
          what: "npm publish"

  # Publishes org.openmbee:opensysml and its parent pom to Maven Central
  # from the core `v<version>` tag. Central has no trusted publishing, so a
  # portal token and the release signing key come from the
  # restricted 'Maven Central' context. Everything that can fail runs before the upload:
  # the tag/version check, the Central availability check, the credentials, and
  # a proof the signing key and passphrase work. The deploy auto-publishes the
  # validated deployment and waits until it is published.
  publish-maven:
    executor: java-executor
    steps:
      - checkout
      - rehearsal-tag

      # build-release's dist/grpc: the binaries whose digests the jar pins.
      - attach_workspace:
          at: .

      - restore_cache:
          keys:
            - maven-v1-{{ checksum "client/java/pom.xml" }}-{{ checksum "client/java/opensysml-client/pom.xml" }}-{{ checksum "client/java/opensysml-conformance/pom.xml" }}
            - maven-v1-

      - run:
          name: Resolve the version from the tag
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a core v* tag."
              exit 1
            fi
            version=$(mvn -B -q -f client/java/pom.xml help:evaluate \
              -Dexpression=project.version -DforceStdout)
            # Central publishes the version the pom declares, so the tag must
            # spell it exactly; build-python-package has already checked the pom
            # against _version.py.
            if [ "${CIRCLE_TAG}" != "v${version}" ]; then
              echo "Error: tag ${CIRCLE_TAG} does not match client/java/pom.xml"
              echo "version ${version}; the tag for it is v${version}. Nothing was published."
              exit 1
            fi
            # Central has no test registry, so a pre-release (-rc1, -alpha.1…)
            # is published as an ordinary, permanent version that Maven orders
            # before the release; a snapshot is refused outright.
            case "$version" in
              *-SNAPSHOT)
                echo "Error: ${version} is a snapshot; Central releases are immutable."
                exit 1 ;;
            esac
            echo "export JAVA_VERSION=${version}" >> "$BASH_ENV"
            echo "Publishing org.openmbee:opensysml:${version}"
            # Proves the workspace carries the release binaries.
            ls -l dist/grpc/sysml-grpc-*

      # The jar's own copy of the table is the only pin the published client
      # carries; stamping it here, from build-release's binaries, is what lets
      # org.openmbee:opensysml download this release without sigstore. The
      # shared client/release-digests.json is not touched, so the sync check
      # elsewhere in this pipeline is unaffected.
      - run:
          name: Stamp this release's service digests into the jar's resources
          command: |
            if ! command -v python3 >/dev/null; then
              sudo apt-get update -q && sudo apt-get install -yq python3
            fi
            python3 client/python/scripts/pin_release_checksums.py \
              --version "${CIRCLE_TAG}" \
              --from-binaries dist/grpc \
              --table client/java/opensysml-client/src/main/resources/release-digests.json
            git diff --stat

      - run:
          name: Require the publishing credentials
          command: |
            # Names only, never values; the 'Maven Central' context supplies them.
            for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD \
                        GPG_PRIVATE_KEY GPG_PASSPHRASE; do
              if [ -z "${!name:-}" ]; then
                echo "Error: ${name} is not set; add it to the 'Maven Central' context (Organization Settings → Contexts)."
                exit 1
              fi
            done

      - run:
          name: Refuse a version already on Central
          command: |
            for artifact in opensysml-parent opensysml; do
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://repo1.maven.org/maven2/org/openmbee/${artifact}/${JAVA_VERSION}/")
              case "$code" in
                200)
                  echo "Error: org.openmbee:${artifact}:${JAVA_VERSION} is already on Central;"
                  echo "a published version cannot be replaced. Cut the next core release."
                  exit 1 ;;
                404) ;;
                *)
                  echo "Error: could not ask Central (HTTP $code); refusing rather than guessing."
                  exit 1 ;;
              esac
            done

      - run:
          name: Package the jar and verify its pins
          command: |
            # java-test ran the whole suite on this revision; only the test that
            # reads the stamped resource runs again, now asserting it pins this
            # tag. The jar packaged here is then opened and checked directly.
            OPENSYSML_EXPECT_PINNED_RELEASE="${CIRCLE_TAG}" mvn -B -f client/java/pom.xml \
              clean package -pl :opensysml -am \
              -Dtest=ReleaseAssetsTest -Dsurefire.failIfNoSpecifiedTests=false
            jar="client/java/opensysml-client/target/opensysml-${JAVA_VERSION}.jar"
            if [ ! -f "${jar}" ]; then
              echo "Error: mvn package did not create ${jar}."
              exit 1
            fi
            python3 - "${jar}" "${CIRCLE_TAG}" dist/grpc \<<'PY'
            import hashlib
            import json
            import os
            import sys
            import zipfile

            jar_path, tag, binaries = sys.argv[1:]
            required = {
                "sysml-grpc-darwin-amd64",
                "sysml-grpc-darwin-arm64",
                "sysml-grpc-linux-amd64",
                "sysml-grpc-linux-arm64",
                "sysml-grpc-windows-amd64.exe",
            }
            with zipfile.ZipFile(jar_path) as jar:
                if "release-digests.json" not in jar.namelist():
                    raise SystemExit("Error: packaged jar has no release-digests.json.")
                with jar.open("release-digests.json") as member:
                    table = json.load(member)

            digests = table.get("Open-MBEE/OpenSysML", {}).get(tag, {})
            missing = sorted(required - digests.keys())
            if missing:
                raise SystemExit(
                    f"Error: packaged jar has no complete digest pin for {tag}: "
                    f"{', '.join(missing)}"
                )
            for asset in sorted(required):
                with open(os.path.join(binaries, asset), "rb") as binary:
                    actual = hashlib.sha256(binary.read()).hexdigest()
                if digests[asset] != actual:
                    raise SystemExit(
                        f"Error: packaged jar pins {digests[asset]} for {asset} of {tag}, "
                        f"but the release binary is {actual}"
                    )
            print(f"Verified the packaged jar embeds all five service digests for {tag}.")
            PY

      - run:
          name: Import the signing key
          command: |
            if ! command -v gpg > /dev/null; then
              sudo apt-get update && sudo apt-get install -y gnupg
            fi
            # The context may hold the key ASCII-armoured or base64-encoded (the
            # CircleCI UI does not keep newlines), so accept both.
            case "$GPG_PRIVATE_KEY" in
              *"-----BEGIN PGP PRIVATE KEY BLOCK-----"*)
                printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import ;;
              *)
                printf '%s' "$GPG_PRIVATE_KEY" | tr -d ' \n' | base64 -d | gpg --batch --import ;;
            esac
            # Prove key and passphrase work before anything uploads: a clearsign
            # with an expired key or a wrong passphrase fails here.
            exec 3\<<<"$GPG_PASSPHRASE"
            echo check | gpg --batch --pinentry-mode loopback \
              --passphrase-fd 3 --clearsign > /dev/null
            exec 3<&-

      - run:
          name: Write the Maven settings
          command: |
            mkdir -p ~/.m2
            # Env interpolation keeps the portal token off disk.
            printf '%s\n' \
              '<settings>' \
              '  <servers>' \
              '    <server>' \
              '      <id>central</id>' \
              '      <username>${env.CENTRAL_TOKEN_USERNAME}</username>' \
              '      <password>${env.CENTRAL_TOKEN_PASSWORD}</password>' \
              '    </server>' \
              '  </servers>' \
              '</settings>' > ~/.m2/settings.xml
            chmod 600 ~/.m2/settings.xml

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            # java-test ran the suite on this revision in this workflow, so tests are
            # skipped; -am brings the parent pom the client's pom names, which Central
            # must hold too; opensysml-conformance is not published. The jar is
            # rebuilt from the tree whose stamped resource was verified above.
            # Never run this step with -X/debug output; the settings interpolation would print the token.
            - run:
                name: Sign, upload and publish
                command: |
                  MAVEN_GPG_PASSPHRASE="$GPG_PASSPHRASE" mvn -B -f client/java/pom.xml \
                    -Prelease deploy -pl :opensysml -am -DskipTests
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: check the Central token"
                command: |
                  auth=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
                  code=$(curl -s -o /tmp/central.json -w '%{http_code}' \
                    -H "Authorization: Bearer ${auth}" \
                    "https://central.sonatype.com/api/v1/publisher/published?namespace=org.openmbee&name=opensysml&version=${JAVA_VERSION}")
                  case "$code" in
                    200) echo "ok: the portal token authenticates" ;;
                    401|403)
                      echo "Error: Central rejected the portal token (HTTP $code)."
                      exit 1 ;;
                    *)
                      echo "Error: could not ask Central (HTTP $code); refusing rather than guessing."
                      exit 1 ;;
                  esac
            - run:
                name: "REHEARSAL: build and sign without deploying"
                command: |
                  # Never run this step with -X/debug output; the settings interpolation would print the token.
                  MAVEN_GPG_PASSPHRASE="$GPG_PASSPHRASE" mvn -B -f client/java/pom.xml \
                    -Prelease verify -pl :opensysml -am -DskipTests
                  ls client/java/opensysml-client/target/*.jar.asc > /dev/null
                  ls client/java/*/target/*.pom.asc > /dev/null
      - rehearsal-skip:
          what: "mvn deploy (upload and publish to Central)"

  # Publishes the opensysml crate to crates.io from the core `v<version>` tag.
  # The token comes from the restricted 'crates.io' context. Everything that can fail runs
  # before the upload: the tag/version check, the crates.io availability check,
  # the credential, and the package dry run.
  publish-crates:
    executor: rust-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - rehearsal-tag

      - run:
          name: Resolve the version from the tag
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a core v* tag."
              exit 1
            fi
            pkgid=$(cargo pkgid -p opensysml --manifest-path client/rust/Cargo.toml)
            version=${pkgid##*[#@]}
            # crates.io publishes the version Cargo.toml declares, so the tag
            # must spell it exactly; build-python-package has already checked
            # it against _version.py.
            if [ "${CIRCLE_TAG}" != "v${version}" ]; then
              echo "Error: tag ${CIRCLE_TAG} does not match client/rust/opensysml/Cargo.toml"
              echo "version ${version}; the tag for it is v${version}. Nothing was published."
              exit 1
            fi
            # crates.io has no test registry, so a pre-release (0.9.1-rc.1…)
            # is published as an ordinary version, which Cargo resolves only
            # when asked for explicitly.
            echo "export RUST_VERSION=${version}" >> "$BASH_ENV"
            echo "Publishing opensysml ${version} to crates.io"

      - run:
          name: Stamp this release's service digests into the crate
          command: |
            if ! command -v python3 >/dev/null; then
              sudo apt-get update -q && sudo apt-get install -yq python3
            fi
            python3 client/python/scripts/pin_release_checksums.py \
              --version "${CIRCLE_TAG}" \
              --from-manifest dist/SHA256SUMS.txt \
              --table client/rust/opensysml/release-digests.json
            git diff --stat

      - run:
          name: Require the publishing credential
          command: |
            # Name only, never the value; the 'crates.io' context supplies it.
            if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
              echo "Error: CARGO_REGISTRY_TOKEN is not set; add it to the 'crates.io' context (Organization Settings → Contexts)."
              exit 1
            fi

      - run:
          name: Refuse a version already on crates.io
          command: |
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: OpenSysML release (https://github.com/Open-MBEE/OpenSysML)' \
              "https://crates.io/api/v1/crates/opensysml/${RUST_VERSION}")
            case "$code" in
              200)
                echo "Error: opensysml ${RUST_VERSION} is already on crates.io;"
                echo "a published version cannot be replaced, only yanked."
                echo "Cut the next core release."
                exit 1 ;;
              404) ;;
              *)
                echo "Error: could not ask crates.io (HTTP $code); refusing rather than guessing."
                exit 1 ;;
            esac

      - run:
          name: Package the crate
          command: |
            # The crate's embedded table is its only trust anchor.
            cargo package -p opensysml --manifest-path client/rust/Cargo.toml --allow-dirty --locked
            crate="client/rust/target/package/opensysml-${RUST_VERSION}.crate"
            if [ ! -f "${crate}" ]; then
              echo "Error: cargo package did not create ${crate}."
              exit 1
            fi
            python3 - "${crate}" "${CIRCLE_TAG}" \<<'PY'
            import json
            import sys
            import tarfile

            crate_path, tag = sys.argv[1:]
            required = {
                "sysml-grpc-darwin-amd64",
                "sysml-grpc-darwin-arm64",
                "sysml-grpc-linux-amd64",
                "sysml-grpc-linux-arm64",
                "sysml-grpc-windows-amd64.exe",
            }
            with tarfile.open(crate_path, "r:gz") as crate:
                member_name = next(
                    (name for name in crate.getnames() if name.endswith("/release-digests.json")),
                    None,
                )
                if member_name is None:
                    raise SystemExit("Error: packaged crate has no release-digests.json.")
                with crate.extractfile(member_name) as member:
                    table = json.load(member)

            digests = table.get("Open-MBEE/OpenSysML", {}).get(tag, {})
            missing = sorted(required - digests.keys())
            if missing:
                raise SystemExit(
                    f"Error: packaged crate has no complete digest pin for {tag}: "
                    f"{', '.join(missing)}"
                )
            print(f"Verified the packaged crate embeds all five service digests for {tag}.")
            PY

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            # The package step above already built and verified the crate; cargo
            # reads CARGO_REGISTRY_TOKEN from the environment, so nothing is on disk.
            - run:
                name: Publish opensysml to crates.io
                command: |
                  cargo publish -p opensysml --manifest-path client/rust/Cargo.toml \
                    --locked --no-verify --allow-dirty
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: no cargo publish"
                command: |
                  echo "REHEARSAL: crates.io has no read-only token check (GET /api/v1/me accepts only a browser session); the token's presence was checked above."
      - rehearsal-skip:
          what: "cargo publish"

  publish-github-release:
    docker:
      - image: cibuilds/github:0.13
    steps:
      # A rehearsal needs a checkout for _version.py; the tag path does not.
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - checkout
            - rehearsal-tag
      - attach_workspace:
          at: .
      
      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: Publish Release on GitHub
                command: |
                  VERSION="${CIRCLE_TAG}"
                  if [ -z "$VERSION" ]; then
                    echo "Error: CIRCLE_TAG is empty"
                    exit 1
                  fi
                  echo "Publishing release $VERSION"
                  ls -la dist/
            
                  # Move only tarballs to a release directory
                  mkdir -p dist/release
                  mv dist/*.tar.gz dist/*.zip dist/release/ 2>/dev/null || true
                  # The opensysml wheel, the same bytes publish-pypi uploads.
                  mv dist/*.whl dist/release/
                  mv dist/grpc/* dist/release/
                  mv dist/wasm/* dist/release/
                  mv dist/SHA256SUMS.txt dist/release/
                  # The signature over that manifest, which the Python client verifies
                  # before it trusts a digest from it.
                  mv dist/SHA256SUMS.txt.bundle dist/release/
                  # The SLSA provenance statement over those assets and its signature.
                  mv dist/provenance.intoto.json dist/provenance.intoto.json.bundle dist/release/
                  echo "Release artifacts:"
                  ls -la dist/release/
            
                  # Try different token variable names
                  TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-${CIRCLE_TOKEN}}}"
                  if [ -z "$TOKEN" ]; then
                    echo "Error: No GitHub token found. Tried GITHUB_TOKEN, GH_TOKEN, CIRCLE_TOKEN"
                    exit 1
                  fi
            
                  # '-replace' reuses an existing release and only re-uploads assets of
                  # the same name, so hand-written notes, title and prerelease/latest
                  # flags survive a re-run. Never '-delete': that is an alias of
                  # '-recreate', which deletes the release *and its tag* and creates an
                  # empty one. A tag with no release yet still gets one created here.
                  ghr -t "${TOKEN}" \
                      -u "${CIRCLE_PROJECT_USERNAME}" \
                      -r "${CIRCLE_PROJECT_REPONAME}" \
                      -c "${CIRCLE_SHA1}" \
                      -replace \
                      "${VERSION}" \
                      dist/release/
      - when:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: "REHEARSAL: check the release assets and the GitHub token"
                command: |
                  ls dist/SHA256SUMS.txt > /dev/null
                  ls dist/wasm/sysml-wasm.wasm dist/wasm/wasm_exec.js > /dev/null
                  set -- dist/opensysml-*-py3-none-any.whl
                  if [ ! -f "$1" ] || [ $# -ne 1 ]; then
                    echo "Error: expected exactly one dist/opensysml-*-py3-none-any.whl"
                    exit 1
                  fi
                  ls dist/grpc/sysml-grpc-* > /dev/null
                  ls -la dist dist/grpc
                  TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-${CIRCLE_TOKEN}}}"
                  if [ -z "$TOKEN" ]; then
                    echo "Error: No GitHub token found. Tried GITHUB_TOKEN, GH_TOKEN, CIRCLE_TOKEN"
                    exit 1
                  fi
                  code=$(curl -s -o /tmp/repo.json -w '%{http_code}' \
                    -H "Authorization: Bearer ${TOKEN}" \
                    "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}")
                  if [ "$code" != "200" ] || ! grep -Eq '"push": *true' /tmp/repo.json; then
                    echo "Error: the GitHub token cannot push releases (HTTP $code)."
                    exit 1
                  fi
                  echo "ok: the release assets are present and the token can push releases"
      - rehearsal-skip:
          what: "ghr (the GitHub release)"

  # After the GitHub release exists, brings the committed shared table up to
  # date with it: stamps the release from the manifest build-release wrote,
  # syncs every client copy, and opens a pull request against develop with the
  # result. The packages published beside it already carry their own pins; this
  # is for a checkout, and for a later release's packages asked for this one,
  # and it is what the hygiene suite holds the next release branch to.
  pin-release-digests:
    executor: python-executor
    steps:
      - checkout
      # build-release's dist/SHA256SUMS.txt: the digests the table records.
      - attach_workspace:
          at: .
      - rehearsal-tag

      - run:
          name: Resolve the tag
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a core v* tag."
              exit 1
            fi
            ls -l dist/SHA256SUMS.txt
            echo "export PIN_BRANCH=chore/pin-${CIRCLE_TAG}" >> "$BASH_ENV"

      - run:
          name: Stamp the release into the shared table on a branch from develop
          command: |
            # The pull request targets develop, so the stamp is made on develop's
            # tree, not the tag's: what develop already pins stays as it is.
            git fetch --no-tags origin develop
            git checkout -B "${PIN_BRANCH}" origin/develop
            # The shared table is the target, so the script syncs every client
            # copy from it. A different pin already there for this tag is a
            # republished release, and the script refuses it.
            python3 client/python/scripts/pin_release_checksums.py \
              --version "${CIRCLE_TAG}" \
              --from-manifest dist/SHA256SUMS.txt
            python3 scripts/sync-release-digests.py --check
            git add client
            git diff --cached --stat
            if git diff --cached --quiet; then
              echo "develop already pins ${CIRCLE_TAG}; there is nothing to open."
              echo "export PIN_NOTHING_TO_DO=1" >> "$BASH_ENV"
            fi

      - unless:
          condition: << pipeline.parameters.release_rehearsal >>
          steps:
            - run:
                name: Push the branch and open the pull request against develop
                command: |
                  if [ -n "${PIN_NOTHING_TO_DO:-}" ]; then
                    echo "Nothing to push."
                    exit 0
                  fi
                  # The same token publish-github-release uses. Pushing a branch
                  # and opening a pull request need it to write contents and pull
                  # requests on this repository.
                  TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-${CIRCLE_TOKEN}}}"
                  if [ -z "$TOKEN" ]; then
                    echo "Error: No GitHub token found. Tried GITHUB_TOKEN, GH_TOKEN, CIRCLE_TOKEN"
                    exit 1
                  fi
                  repo="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
                  git config user.name "OpenSysML release"
                  git config user.email "opensysml-release@users.noreply.github.com"
                  git commit -q \
                    -m "chore(release): pin ${CIRCLE_TAG} in the shared digest table" \
                    -m "Stamped from the release's SHA256SUMS.txt by the tag's pipeline and synced into every client copy."
                  # The token travels in a header, never in a URL git would echo.
                  # The branch is rebuilt from develop on every run, so a run
                  # repeated after a failure replaces an earlier branch rather
                  # than failing on it.
                  auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')
                  git -c "http.https://github.com/.extraheader=Authorization: Basic ${auth}" \
                    push --force "https://github.com/${repo}.git" "HEAD:refs/heads/${PIN_BRANCH}"
                  PIN_TOKEN="$TOKEN" python3 - "$repo" "$PIN_BRANCH" "$CIRCLE_TAG" \<<'PY'
                  import json
                  import os
                  import sys
                  import urllib.error
                  import urllib.parse
                  import urllib.request

                  repo, branch, tag = sys.argv[1:]
                  api = f"https://api.github.com/repos/{repo}"
                  headers = {
                      "Authorization": f"Bearer {os.environ['PIN_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "OpenSysML release (https://github.com/Open-MBEE/OpenSysML)",
                  }

                  def call(method, url, body=None):
                      data = json.dumps(body).encode() if body is not None else None
                      request = urllib.request.Request(url, data=data, method=method, headers=headers)
                      try:
                          with urllib.request.urlopen(request) as response:
                              return response.status, json.load(response)
                      except urllib.error.HTTPError as error:
                          return error.code, json.load(error) if error.fp else {}

                  owner = repo.split("/")[0]
                  query = urllib.parse.urlencode({"head": f"{owner}:{branch}", "base": "develop", "state": "open"})
                  status, open_prs = call("GET", f"{api}/pulls?{query}")
                  if status != 200:
                      raise SystemExit(f"Error: could not list pull requests (HTTP {status}): {open_prs.get('message')}")
                  if open_prs:
                      print(f"The pull request already exists and now carries the branch: {open_prs[0]['html_url']}")
                      raise SystemExit(0)
                  status, created = call("POST", f"{api}/pulls", {
                      "title": f"chore(release): pin {tag} in the shared digest table",
                      "head": branch,
                      "base": "develop",
                      "body": (
                          f"Pins the five `sysml-grpc` assets of {tag} in `client/release-digests.json` and every "
                          f"client copy, from the release's `SHA256SUMS.txt`, so a checkout and the packages of "
                          f"later releases install {tag} on a pin. Opened by the tag's release pipeline; see "
                          "docs/project/releasing.md § Pinned release digests."
                      ),
                  })
                  if status != 201:
                      print(f"Error: could not open the pull request (HTTP {status}): {created.get('message')}")
                      if status in (403, 404):
                          print("The GitHub token must be able to write contents and pull requests on this")
                          print("repository (a classic token needs the 'repo' scope); see")
                          print("docs/project/releasing.md § Pinned release digests.")
                      raise SystemExit(1)
                  print(f"Opened {created['html_url']}")
                  PY
      - rehearsal-skip:
          what: "pushing the pin branch and opening its pull request"

workflows:
  version: 2

  # Build and test every merge into main or develop; pull requests run .github/workflows/pr.yml instead.
  # The race run gates the workflow but not the client tests or the scan, which
  # need only the coverage profile and the binaries.
  build-test:
    jobs:
      - go-static:
          name: Go static checks
          filters: &integration-branches
            branches:
              only: [main, develop]
            tags:
              ignore: /.*/
      - go-race-test:
          name: Go race tests
          filters: *integration-branches
      - go-coverage:
          name: Go coverage shards
          filters: *integration-branches
      - go-coverage-merge:
          name: Go coverage profile
          requires:
            - Go coverage shards
          filters: *integration-branches
      - go-gates:
          name: Go gates and binaries
          filters: *integration-branches
      - python-test:
          name: Python client tests
          requires: &scan-inputs
            - Go static checks
            - Go coverage profile
            - Go gates and binaries
          filters: *integration-branches
      - rust-test:
          name: Rust client tests
          requires: *scan-inputs
          filters: *integration-branches
      - julia-client:
          name: Julia client tests
          requires: *scan-inputs
          filters: *integration-branches
      - matlab-client:
          name: MATLAB client tests
          requires: *scan-inputs
          filters: *integration-branches
      - java-test:
          name: Java client tests
          requires: *scan-inputs
          filters: *integration-branches
      - node-test:
          name: Node client tests
          requires: *scan-inputs
          filters: *integration-branches
      - scan:
          name: SonarCloud scan
          # Matched exactly, like PyPI below; this context holds SONAR_TOKEN.
          context:
            - SonarCloud
          requires:
            - Go static checks
            # Persists coverage.txt, the Go report the scan reads.
            - Go coverage profile
            - Go gates and binaries
            # Each contributes a coverage report; without them the scan sees
            # only Go coverage and grades every other language at zero.
            - Python client tests
            - Java client tests
            - Node client tests
          filters: *integration-branches

  # Build and release on tags. The suite runs here too: a tag can point at any
  # commit, so a release is only published from a revision proven green. One tag
  # publishes the binaries and every published client, at the same version.
  # Branch pushes are kept out by the `when` below, not by job filters, so a
  # release_rehearsal run can run the same jobs on a branch; the jobs still
  # need a tag filter, because CircleCI runs no job on a tag without one.
  release:
    when:
      or:
        - << pipeline.parameters.release_rehearsal >>
        - matches: {pattern: "^v.*", value: << pipeline.git.tag >>}
    jobs:
      - go-static:
          name: Go static checks
          filters: &release-tags
            tags:
              only: /^v.*/
      - go-race-test:
          name: Go race tests
          filters: *release-tags
      - go-coverage:
          name: Go coverage shards
          filters: *release-tags
      - go-coverage-merge:
          name: Go coverage profile
          requires:
            - Go coverage shards
          filters: *release-tags
      - go-gates:
          name: Go gates and binaries
          filters: *release-tags

      - python-test:
          name: Python client tests
          requires: &go-suite
            - Go static checks
            - Go race tests
            - Go coverage profile
            - Go gates and binaries
          filters: *release-tags

      - node-test:
          name: Node client tests
          requires: *go-suite
          filters: *release-tags

      - java-test:
          name: Java client tests
          requires: *go-suite
          filters: *release-tags

      - rust-test:
          name: Rust client tests
          requires: *go-suite
          filters: *release-tags

      - build-release-binaries:
          name: Build release binaries
          requires: *go-suite
          filters: *release-tags

      # Fails the release when the tag does not name the version
      # client/python/opensysml/_version.py declares. Runs after the binaries
      # so their digests can be stamped into the distribution it builds.
      - build-python-package:
          name: Build Python distribution
          requires:
            - Build release binaries
          filters: *release-tags

      # Writes and signs the one manifest over the binaries and the distribution.
      - build-release:
          name: Build release artifacts
          requires:
            - Build release binaries
            - Build Python distribution
          filters: *release-tags

      - publish-github-release:
          name: Publish GitHub release
          requires:
            - Build release artifacts
            - Python client tests
            - Node client tests
            - Java client tests
            - Rust client tests
          filters: *release-tags

      - python-zero-config-smoke:
          name: Python zero-config release smoke
          requires:
            - Publish GitHub release
            - Build Python distribution
          filters: *release-tags

      - publish-pypi:
          name: Publish opensysml to PyPI
          # Last of all: an upload cannot be undone, so it waits for the GitHub
          # release the package version promises to exist. A re-run of a published
          # release fails here by design; the index has the version.
          # The organization context is named 'PyPI'; a context reference is
          # matched exactly, so the case here has to match it.
          context:
            - PyPI
          requires:
            - Publish GitHub release
            - Python client tests
            - Python zero-config release smoke
          filters: *release-tags

      - publish-npm:
          name: Publish opensysml to npm
          # Last of all, with publish-pypi: the npm publish cannot be undone,
          # so it waits for the GitHub release the version promises to exist.
          # It is independent of publish-pypi so neither registry refusing a
          # re-run blocks the other.
          # The organization context is named 'npm'; a context reference is
          # matched exactly, so the case here has to match it.
          context:
            - npm
          requires:
            - Publish GitHub release
            - Node client tests
          filters: *release-tags

      - publish-maven:
          name: Publish opensysml to Maven Central
          # Last of all, with publish-pypi and publish-npm: Central versions are
          # immutable, so it waits for the GitHub release. It is independent of
          # them so neither registry refusing a re-run blocks the other.
          # The organization context is named 'Maven Central'; a context
          # reference is matched exactly, so the case here has to match it.
          context:
            - "Maven Central"
          requires:
            - Publish GitHub release
            - Java client tests
          filters: *release-tags

      - publish-crates:
          name: Publish opensysml to crates.io
          # Last of all, with publish-pypi, publish-npm and publish-maven:
          # a crates.io version cannot be replaced, so it waits for the
          # GitHub release. It is independent of them so neither registry
          # refusing a re-run blocks the other. The organization context is
          # named 'crates.io'; a context reference is matched exactly, so the
          # case here has to match it.
          context:
            - crates.io
          requires:
            - Publish GitHub release
            - Rust client tests
          filters: *release-tags

      - pin-release-digests:
          name: Pin the release in the shared digest table
          # After the release exists: the pull request it opens against
          # develop records a release a reader can download and verify.
          requires:
            - Publish GitHub release
          filters: *release-tags

  # Publishes the final release of the pre-rename PyPI name on a `pysysml-v*`
  # tag. It is its own workflow because the artifact shares no code with the
  # client: the Python suite is what proves it, and the placeholder can be
  # published without a client release (or ever again).
  release-pysysml-placeholder:
    jobs:
      # python-test attaches the workspace the Go suite persists (it needs a
      # sysml-grpc to talk to), so it cannot run on its own.
      - go-static:
          name: Go static checks
          filters: &pysysml-tags
            branches:
              ignore: /.*/
            tags:
              only: /^pysysml-v.*/
      - go-race-test:
          name: Go race tests
          filters: *pysysml-tags
      - go-coverage:
          name: Go coverage shards
          filters: *pysysml-tags
      - go-coverage-merge:
          name: Go coverage profile
          requires:
            - Go coverage shards
          filters: *pysysml-tags
      - go-gates:
          name: Go gates and binaries
          filters: *pysysml-tags

      - python-test:
          name: Python client tests
          requires: *go-suite
          filters: *pysysml-tags

      - publish-pypi-pysysml:
          name: Publish pysysml placeholder to PyPI
          context:
            - PyPI
          requires:
            - Python client tests
          filters: *pysysml-tags
