version: 2.1

orbs:
  go: circleci/go@1.10.0
  # Pinned exactly, matching Open-MBEE/flexo-mms-layer1-service.
  sonarcloud: sonarsource/sonarcloud@4.0.0

executors:
  go-executor:
    docker:
      - image: cimg/go:1.25
    resource_class: medium
  
  python-executor:
    docker:
      - image: cimg/python:3.11
    resource_class: medium

  rust-executor:
    docker:
      - image: cimg/rust:1.83
    resource_class: medium

  # JDK 17, the client's compile target, with Maven 3.9 preinstalled. Testing on
  # the baseline is the point: a 21-only construct must fail here.
  java-executor:
    docker:
      - image: cimg/openjdk:17.0
    resource_class: medium

  # Node 22 is the active LTS; the client supports >=20.11 for `await using`.
  node-executor:
    docker:
      - image: cimg/node:22.12
    resource_class: medium

commands:
  # The solver is an external process: without one on PATH the
  # solver-dependent tests would skip rather than run.
  install-solvers:
    steps:
      - run:
          name: Install Z3
          command: |
            sudo apt-get update
            sudo apt-get install -y z3
            z3 --version

      # The second verified backend, for the portability gate: cvc5 has no apt
      # package, so the official static release is what CI runs, pinned by
      # digest so a substituted asset is not run.
      - run:
          name: Install cvc5
          command: |
            curl -fsSL -o /tmp/cvc5.zip \
              https://github.com/cvc5/cvc5/releases/download/cvc5-1.3.4/cvc5-Linux-x86_64-static.zip
            echo "dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6  /tmp/cvc5.zip" | sha256sum --check --strict
            unzip -p /tmp/cvc5.zip '*/bin/cvc5' > /tmp/cvc5-bin
            sudo install -m 0755 /tmp/cvc5-bin /usr/local/bin/cvc5
            cvc5 --version | head -1

  # The corpora are not vendored and the gates skip while they are absent, so a
  # release tag could be cut over a corpus regression without them.
  download-corpora:
    steps:
      - restore_cache:
          keys:
            - training-corpus-v1-{{ checksum "scripts/download-training-examples.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}

      - run:
          name: Download the OMG training corpus
          command: ./scripts/download-training-examples.sh

      - save_cache:
          key: training-corpus-v1-{{ checksum "scripts/download-training-examples.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}
          paths:
            - examples/sysml-v2-training

      # The three pilot corpora, gated the same way and keyed the same way. Their
      # gate is our-side-only: the comparison against the reference implementation
      # (cmd/pilot-diff) needs Java validators and is not run in CI.
      - restore_cache:
          keys:
            - pilot-corpora-v1-{{ checksum "scripts/download-pilot-corpora.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}

      - run:
          name: Download the OMG pilot corpora
          command: ./scripts/download-pilot-corpora.sh

      - save_cache:
          key: pilot-corpora-v1-{{ checksum "scripts/download-pilot-corpora.sh" }}-{{ checksum "scripts/pilot-pin.sh" }}
          paths:
            - examples/pilot-corpora

      - run:
          name: Verify the OMG pilot corpora
          command: |
            for root in sysml-examples sysml-validation kerml-examples; do
              count=$(find "examples/pilot-corpora/$root" -type f \( -name '*.sysml' -o -name '*.kerml' \) | wc -l)
              echo "pilot corpus $root: $count model files"
              if [ "$count" -eq 0 ]; then
                echo "error: pilot corpus $root is empty; the corpora gate would not run" >&2
                exit 1
              fi
            done

# The Go suite is four jobs rather than one because the plan caps a job at 60
# minutes and the race run and the coverage run alone take ~45 of them. Each
# job runs on its own executor and every downstream job requires all four.
jobs:
  # Formatting, vet, static analysis, the documentation gates and the protobuf
  # schema checks: everything that needs neither a solver nor the corpora.
  go-static:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache

      - run:
          name: Check Go formatting
          command: |
            unformatted=$(gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "The following files are not gofmt'd:"
              echo "$unformatted"
              exit 1
            fi

      - run:
          name: Run Go vet
          command: go vet ./...

      - run:
          name: Check documentation links
          command: python3 scripts/check-doc-links.py

      # The shipped pages are generated from each command's description, so a
      # flag added without regenerating them would ship a page for a command
      # that no longer exists.
      - run:
          name: Verify the committed manual pages are current
          command: |
            sudo apt-get update && sudo apt-get install -y --no-install-recommends mandoc
            make man-check

      # Internal work-item labels (waves, F<n>, P<n>, K<n>/S<n>) have no public
      # referent, so they may not appear in the pages a user reads.
      - run:
          name: Check for internal labels in reader-facing documentation
          command: python3 scripts/check-doc-ids.py

      # An oracle total quoted outside the generated block is a snapshot, and a
      # reader cannot tell that from a current figure unless the page says so.
      - run:
          name: Check quoted oracle figures name the round they measured
          command: python3 scripts/check-doc-figures.py

      # The census figures are derived from the committed baseline, and every
      # table row must be a constraint the baseline records (and vice versa).
      - run:
          name: Check the validation-constraint census matches its baseline
          command: go run ./cmd/validation-census -check

      # Changelog entries live in changes/unreleased/ until a release folds them in.
      - run:
          name: Check changelog fragments
          command: python3 scripts/changelog-test.py && python3 scripts/changelog.py check

      # The compliance census is counted when the site is built, never committed.
      - run:
          name: Check the compliance census hook
          command: python3 scripts/mkdocs_census-test.py

      # Each client verifies a download against the copy of the pinned digests it
      # ships, so a copy that drifts from the table pins something else.
      - run:
          name: Check the clients ship the pinned release digests
          command: python3 scripts/sync-release-digests.py --check

      - run:
          name: Run static analysis (staticcheck + gosec)
          command: make lint

      - run:
          name: Check grpc-go stays out of production code
          command: ./scripts/check-grpc-imports.sh

      - run:
          name: Lint the protobuf schema
          command: make proto-lint

      # Baseline is an ancestor of HEAD, never a live branch tip (a merge landing meanwhile would
      # read as deletions): the first parent on main or develop, the previous release on a `v*` tag.
      - run:
          name: Check the protobuf schema for breaking changes
          command: |
            if [ -n "${CIRCLE_TAG:-}" ]; then
              git fetch --tags --quiet origin
              if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                git fetch --unshallow --quiet origin
              fi
              baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$CIRCLE_TAG" HEAD)
              echo "release tag ${CIRCLE_TAG}: comparing against the previous release, ${baseline}"
            else
              git rev-parse --verify --quiet HEAD^1 > /dev/null \
                || git fetch --quiet --depth=2 origin "$CIRCLE_SHA1"
              baseline=HEAD^1
              echo "branch build: comparing against the first parent, $(git rev-parse --short HEAD^1)"
            fi
            make proto-breaking BUF_BREAKING_REF="$baseline"

      # Committed stubs must be what buf generates, or the checked-in code and
      # the schema can drift apart silently. `git add -N` puts a regenerated
      # file the commit had deleted into the diff.
      - run:
          name: Verify the committed Go and Java stubs are current
          command: |
            make proto-buf
            git add -N api/proto \
              clients/java/opensysml-client/src/main/java/org/openmbee/opensysml/proto
            git diff --exit-code api/proto \
              clients/java/opensysml-client/src/main/java/org/openmbee/opensysml/proto

  # The race-enabled suite. It is the longest single step in the pipeline, so
  # it gets the larger class and a job to itself.
  go-race-test:
    executor: go-executor
    resource_class: large
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - install-solvers
      - download-corpora

      # Per-package timeout: under -race, passes and model exceed go's 10m default
      # on this executor. Matches `make test` and the GitHub Actions PR workflow.
      # no_output_timeout: go test buffers a package's output until it finishes,
      # so a >10m package looks silent and trips CircleCI's 10m default.
      - run:
          name: Run Go race tests
          command: make test
          no_output_timeout: 30m
          environment:
            # Turns "corpus absent" into a failure rather than a skip, as the
            # GitHub Actions PR workflow already does.
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"
            # Same for the solver installed above: absent means failure, not skip.
            OPENSYSML_REQUIRE_SMT: "1"

  # A second, race-free pass, because the profile the scan reads is written
  # with -coverpkg, which is too slow to instrument under -race.
  go-coverage:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - install-solvers
      - download-corpora

      - run:
          name: Write the coverage profile the scan reads
          command: make coverage
          no_output_timeout: 30m
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"
            OPENSYSML_REQUIRE_SMT: "1"

      - persist_to_workspace:
          root: .
          paths:
            # The scan job reads this profile; without it Sonar shows no coverage.
            - coverage.txt

  # The gates that re-run part of the suite on their own so their verdicts are
  # legible in the log, the conformance suite over every transport, and the
  # host binaries the client jobs test against.
  go-gates:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      - install-solvers
      - download-corpora

      # The corpora gate alone, so its per-root verdict lines are legible in the
      # log and a skip cannot hide behind a green suite.
      - run:
          name: Run pilot corpora gate
          command: |
            set -o pipefail
            go test -count=1 -v ./internal/core/model -run 'TestPilotCorpora' | tee pilot-corpora-gate.log
            grep -E 'pilot corpus files clean' pilot-corpora-gate.log
            if grep -qE '^\s*--- SKIP' pilot-corpora-gate.log; then
              echo "error: the pilot corpora gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"

      # The RDF round-trip ratchet over every example alone, so its per-verdict
      # counts are legible in the log and a skip cannot hide behind a green suite.
      - run:
          name: Run RDF corpus round-trip gate
          command: |
            set -o pipefail
            go test -count=1 -v ./internal/core/export -run 'TestCorpusRoundTrip' | tee corpus-roundtrip-gate.log
            grep -E 'corpus round trip: [0-9]+ files:' corpus-roundtrip-gate.log
            if grep -qE '^\s*--- SKIP' corpus-roundtrip-gate.log; then
              echo "error: the RDF corpus round-trip gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_PILOT_CORPORA: "1"

      # Re-run the differential gate alone so its summary counts, which make
      # coverage drift reviewable, are visible rather than buried in the suite.
      - run:
          name: Run solver differential gate
          command: |
            set -o pipefail
            go test -count=1 -v ./internal/core/solve -run TestDifferential | tee differential-gate.log
            grep -E 'differential gate .*: .* elements:' differential-gate.log
            if grep -qE '^\s*--- SKIP' differential-gate.log; then
              echo "error: a differential gate skipped" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
            OPENSYSML_REQUIRE_SMT: "1"

      # Portability: the same subset against both verified backends, so a feature
      # one of them refuses is reported here rather than found by a user. The
      # requirement flag makes an absent solver a failure rather than a skip.
      - run:
          name: Run solver portability gate
          command: |
            set -o pipefail
            for solver in z3 cvc5; do
              OPENSYSML_SMT="$solver" go test -count=1 -v ./internal/core/solve \
                -run 'TestPortability' | tee "portability-$solver.log"
              grep -E "portability of $solver" "portability-$solver.log"
              if grep -qE '^\s*--- SKIP' "portability-$solver.log"; then
                echo "error: the portability gate skipped for $solver" >&2
                exit 1
              fi
            done
          environment:
            OPENSYSML_REQUIRE_SMT: "1"

      # The solver gate against the second backend: what z3 answers, cvc5 must
      # answer too, the portability subset alone not being the whole contract.
      - run:
          name: Run solver gate (cvc5)
          command: |
            set -o pipefail
            OPENSYSML_SMT=cvc5 go test -count=1 -v ./internal/core/solve ./internal/repl \
              -run 'TestSolver|TestDiscovery|TestSolved|TestDivisor|TestCheck|TestSolve|TestConfigure|TestSynthesis|TestPinned|TestFixed|TestExplain|TestCore' \
              | tee cvc5-gate.log
            if grep -qE '^\s*--- SKIP' cvc5-gate.log; then
              echo "error: a solver-dependent test skipped under cvc5" >&2
              exit 1
            fi
          environment:
            OPENSYSML_REQUIRE_SMT: "1"

      # The other half of the solver contract: with discovery pointed at an
      # executable that does not exist, solver-dependent tests skip and the
      # absent-solver paths must still report one.
      - run:
          name: Run solver-absent gate
          command: |
            set -o pipefail
            env -u OPENSYSML_REQUIRE_SMT OPENSYSML_SMT=/nonexistent/no-such-solver \
              go test -count=1 -v ./internal/core/solve ./internal/repl | tee no-solver-gate.log
            for name in TestCheckReportsAnAbsentSolver TestExplainReportsAnAbsentSolver \
              TestSolveReportsAnAbsentSolver TestConfigureReportsAnAbsentSolver \
              TestOptimizeReportsAnAbsentSolver; do
              grep -qE "^\s*--- PASS: $name" no-solver-gate.log || {
                echo "error: $name did not run without a solver" >&2
                exit 1
              }
            done

      # The conformance suite: the runner builds and starts sysml-grpc itself, so
      # this gate proves the whole path a client takes, not a pre-started service.
      - run:
          name: Run conformance suite
          command: make conformance

      # when: always — the report matters most when the gate failed and halted the job.
      - store_artifacts:
          path: bin/conformance-report.json
          destination: conformance-report.json
          when: always

      # The same run as JUnit XML, so the Tests tab shows per-scenario results.
      - store_test_results:
          path: bin/conformance-report.xml
          when: always

      # The same suite against the legacy grpc-go transport, so -transport grpc
      # cannot rot untested.
      - run:
          name: Run conformance suite against -transport grpc
          command: go run ./cmd/conformance -transport grpc -protocols grpc -report bin/conformance-grpc-transport-report.json

      - store_artifacts:
          path: bin/conformance-grpc-transport-report.json
          destination: conformance-grpc-transport-report.json
          when: always

      # The same suite through the public Go API (client/opensysml), in-process and
      # remote; scenarios outside its v1 surface are counted skips, not hidden.
      - run:
          name: Conformance suite through client/opensysml
          command: make conformance-pkg

      - store_artifacts:
          path: bin/conformance-pkg-report.json
          destination: conformance-pkg-report.json
          when: always

      - run:
          name: Build binaries
          command: |
            VERSION=${CIRCLE_TAG:-dev}
            COMMIT=${CIRCLE_SHA1:-unknown}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')

            make build VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"

      - run:
          name: Verify binaries
          command: |
            ./bin/sysml --version
            ./bin/sysml-lsp --version
            ls -lh bin/

      # The client jobs test against this binary.
      - persist_to_workspace:
          root: .
          paths:
            - bin/sysml-grpc

      - store_artifacts:
          path: bin/
          destination: binaries
  # SonarCloud analysis. The `SonarCloud` context supplies SONAR_TOKEN.
  scan:
    docker:
      - image: cimg/go:1.25
    # The Go sensor holds a whole directory's parse in memory; internal/core/runtime
    # (168 files) overflows the default heap (a quarter of the container). 8 GB is
    # the largest class in the project's plan (xlarge is rejected).
    resource_class: large
    environment:
      # sonar-scanner-cli 8 forks the analysis into a second JVM whose arguments
      # come from this variable only; SONAR_SCANNER_OPTS sizes just the launcher.
      SONAR_SCANNER_JAVA_OPTS: -Xmx6500m
    steps:
      # Forked PRs get no context, so the token is absent there: end green
      # rather than fail every outside contribution. With a token, a failing
      # scan still fails the job.
      - run:
          name: Halt when SONAR_TOKEN is absent (forked PR)
          command: |
            if [ -z "${SONAR_TOKEN:-}" ]; then
              echo "SONAR_TOKEN is empty (forked PR or missing context); skipping the scan."
              circleci-agent step halt
            fi

      # Sonar blames every file with JGit, which cannot fetch a blob on demand:
      # against CircleCI's default blobless clone it dies with
      # `MissingObjectException: Missing blob ...` as soon as it needs a
      # historical version of a file. This is the one job in the file that reads
      # history rather than the current tree, so it is the one that pays for a
      # full clone.
      - checkout:
          method: full

      - attach_workspace:
          at: .

      # Every coverage report the scan reads is expected at the path named in
      # sonar-project.properties, relative to the repo root. The Java classes and
      # jars are named there too: absent, the sensor only warns, so check here.
      - run:
          name: Show the reports and Java binaries the scan reads
          command: |
            ls -l coverage.txt coverage-python.xml coverage-scripts.xml coverage-node.lcov \
              clients/java/opensysml-client/target/site/jacoco/jacoco.xml \
              clients/java/opensysml-conformance/target/site/jacoco/jacoco.xml
            head -n 3 coverage.txt
            for module in opensysml-client opensysml-conformance; do
              for dir in classes test-classes dependency; do
                path="clients/java/$module/target/$dir"
                if [ -z "$(ls -A "$path" 2>/dev/null)" ]; then
                  echo "$path is empty or missing; java-test must persist it."
                  exit 1
                fi
                echo "$path: $(find "$path" -type f | wc -l) file(s)"
              done
            done

      # SonarCloud needs full history for blame and new-code detection, and a
      # blame that silently covers 0 files dates every issue to the import. Fail
      # here, before the scan, if the clone is not one JGit can blame.
      - run:
          name: Verify the clone is complete
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --unshallow
            fi
            # A partial clone records the filter it was made with, and reports
            # the objects it left behind as missing; either one means JGit will
            # fail on the first historical blob it needs.
            if grep -q "partialclonefilter" .git/config; then
              echo "The clone is partial:"
              grep -n "partialclonefilter\|promisor" .git/config
              echo "JGit cannot fetch blobs on demand, so blame would fail; the"
              echo "checkout above must use method: full."
              exit 1
            fi
            missing=$(git rev-list --objects --missing=print --no-object-names HEAD | grep -c "^?" || true)
            if [ "$missing" != "0" ]; then
              echo "$missing object(s) reachable from HEAD are absent locally."
              exit 1
            fi
            echo "Full clone: $(git rev-list --count HEAD) commits, no filter, no missing objects."

      # An analysis that names no version carries the placeholder "not
      # provided", and the default "previous version" new-code period then
      # finds no earlier, different version to compare against and falls back
      # to the first analysis ever run. That collapse is not visible as a
      # failure: the scan succeeds and the new-code conditions quietly grade
      # the whole codebase (on 2026-08-27, 105,050 of 110,609 lines counted as
      # new). Naming the nearest release tag makes the period what it claims to
      # be — what has been committed since that release.
      - run:
          name: Derive sonar.projectVersion from the nearest release tag
          command: |
            # CircleCI fetches the ref being built, not the tag namespace.
            git fetch --tags --quiet origin || true
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [ -z "$version" ]; then
              echo "No v* tag is an ancestor of HEAD, so the version stays unset"
              echo "and the new-code period falls back to the first analysis."
              exit 0
            fi
            echo "sonar.projectVersion=${version#v}"
            # The launcher JVM turns its sonar.* system properties into scanner
            # properties and hands them to the forked analysis JVM.
            echo "export SONAR_SCANNER_OPTS=\"${SONAR_SCANNER_OPTS} -Dsonar.projectVersion=${version#v}\"" >> "$BASH_ENV"

      - sonarcloud/scan

      # SonarCloud does not create a project from a CI scan, so the first run
      # against an unprovisioned project fails; point at the setup doc.
      - run:
          name: Point at the setup doc on failure
          when: on_fail
          command: |
            echo "The scan failed. If it reported \"Could not find a default branch for"
            echo "project with key 'Open-MBEE_OpenSysML'\", the project has not been"
            echo "created on SonarCloud yet: see 'The SonarCloud scan' in"
            echo "docs/project/releasing.md for the one-time maintainer step."

  python-test:
    executor: python-executor
    steps:
      - checkout
      
      - attach_workspace:
          at: .
      
      - run:
          name: Install sysml-grpc
          command: |
            mkdir -p ~/.opensysml/bin
            cp bin/sysml-grpc ~/.opensysml/bin/
            chmod +x ~/.opensysml/bin/sysml-grpc
      
      - run:
          name: Install Python client
          command: |
            make python-install
            # Pinned and wheel-only, as in .github/workflows/pr.yml.
            pip install --only-binary :all: pytest==9.0.3 pytest-mock==3.15.1 psutil==7.2.2 pytest-cov==7.0.0
      
      # The integration tests connect to a service on the standard port with
      # auto_start=False, which is the explicit opt-in to one the client does not
      # manage; without it they skip, exercising nothing, so one runs here for
      # the rest of the job. Tests that name no address start a private child of
      # their own instead, from the binary installed above.
      - run:
          name: Start sysml-grpc
          command: ~/.opensysml/bin/sysml-grpc -port 50051
          background: true

      - run:
          name: Wait for sysml-grpc
          command: |
            # The backslash escapes the heredoc operator for a 2.1 config; the
            # shell sees a plain heredoc.
            python3 - \<<'PY'
            import socket, sys, time

            for _ in range(30):
                with socket.socket() as probe:
                    probe.settimeout(1)
                    if probe.connect_ex(("localhost", 50051)) == 0:
                        print("sysml-grpc is listening on 50051")
                        sys.exit(0)
                time.sleep(1)
            sys.exit("sysml-grpc never listened on 50051")
            PY

      # OPENSYSML_REQUIRE_SERVICE turns "no service, so skip" into a failure: a
      # service is provided here, so its absence is the bug, not a pass.
      - run:
          name: Run Python client tests
          command: OPENSYSML_REQUIRE_SERVICE=1 make python-coverage

      # The repository scripts the Go static checks run are Python too; running
      # them and their tests under coverage here credits what those checks execute.
      - run:
          name: Run the repository scripts with coverage
          command: make scripts-coverage

      # The scan job reads these reports; without them every Python line counts
      # as uncovered.
      - persist_to_workspace:
          root: .
          paths:
            - coverage-python.xml
            - coverage-scripts.xml

      # This executor has no Go toolchain, so buf comes from the official release
      # rather than `go run`, pinned by digest so a substituted asset is not run.
      - run:
          name: Install buf
          command: |
            curl -fsSL -o /tmp/buf \
              https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
            echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
            sudo install -m 0755 /tmp/buf /usr/local/bin/buf
            buf --version

      # Committed stubs must be what buf generates, or the checked-in client and
      # the schema can drift apart silently.
      - run:
          name: Verify the committed Python stubs are current
          command: |
            # Pinned to the version recorded in the committed stubs
            # (GRPC_GENERATED_VERSION), so a newer release cannot fail this check.
            pip install "grpcio-tools==1.83.0"
            make python-proto BUF=buf
            git add -N clients/python/opensysml/proto
            git diff --exit-code clients/python/opensysml/proto

      - run:
          name: Verify Python client import
          command: |
            python3 -c "import opensysml; print(f'opensysml {opensysml.__version__} imported successfully')"

  rust-test:
    executor: rust-executor
    steps:
      - checkout

      - run:
          name: Verify Rust 1.83
          command: |
            rustc --version
            cargo --version

      - go/install:
          version: "1.25.0"

      - run:
          name: Verify Go version
          command: |
            go version

      - run:
          name: Build sysml-grpc
          command: make build

      - run:
          name: Check Rust formatting
          command: cd clients/rust && cargo fmt --all -- --check

      - run:
          name: Run Rust clippy
          command: cd clients/rust && cargo clippy --all-targets -- -D warnings

      - run:
          name: Run Rust tests
          command: |
            cd clients/rust
            OPENSYSML_GRPC_BINARY="$PWD/../../bin/sysml-grpc" \
            OPENSYSML_REQUIRE_SERVICE=1 \
              cargo test --workspace

      - run:
          name: Run Rust conformance
          command: make conformance-rust

      - run:
          name: Package Rust client
          command: cd clients/rust && cargo package -p opensysml

      - run:
          name: Install Buf
          command: |
            curl -fsSL -o /tmp/buf \
              https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
            echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
            chmod +x /tmp/buf
            /tmp/buf --version

      - run:
          name: Verify Rust generated artifacts
          command: |
            make BUF=/tmp/buf proto-rust
            git add -N clients/rust/opensysml/src/proto clients/rust/conformance/sysml.descriptor.binpb
            git diff --exit-code clients/rust/opensysml/src/proto clients/rust/conformance/sysml.descriptor.binpb

      - store_artifacts:
          path: bin/conformance-report-rust.json
          destination: conformance-report-rust.json

  # The Java client: unit tests, the conformance suite over both Connect
  # encodings, and the committed stubs checked against what buf generates.
  java-test:
    executor: java-executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Make the service binary executable
          command: |
            chmod +x bin/sysml-grpc
            bin/sysml-grpc -version || true

      - restore_cache:
          keys:
            - maven-v1-{{ checksum "clients/java/pom.xml" }}-{{ checksum "clients/java/opensysml-client/pom.xml" }}-{{ checksum "clients/java/opensysml-conformance/pom.xml" }}
            - maven-v1-

      - run:
          name: Resolve dependencies
          command: mvn -B -f clients/java/pom.xml -DskipTests dependency:go-offline

      - save_cache:
          key: maven-v1-{{ checksum "clients/java/pom.xml" }}-{{ checksum "clients/java/opensysml-client/pom.xml" }}-{{ checksum "clients/java/opensysml-conformance/pom.xml" }}
          paths:
            - ~/.m2/repository

      # opensysml.requireService turns "no binary, so skip" into a failure: the
      # workspace carries one, so its absence is the bug, not a pass. `install`
      # rather than `test`, so the sources and javadoc jars a release needs are
      # built on every commit rather than first at release time.
      - run:
          name: Test and install the client
          command: |
            mvn -B -f clients/java/pom.xml install -Dopensysml.requireService=true

      # The scan's Java sensor needs the dependency jars on a path it can read,
      # and ~/.m2 is this job's cache, not the workspace.
      - run:
          name: Collect the dependency jars the scan reads
          command: |
            mvn -B -q -f clients/java/pom.xml dependency:copy-dependencies \
              -DincludeScope=test -DoutputDirectory=target/dependency

      # JaCoCo writes the reports during `test`, `install` writes the classes,
      # and the step above writes the jars; the scan job reads all of them.
      - persist_to_workspace:
          root: .
          paths:
            - clients/java/opensysml-client/target/site/jacoco/jacoco.xml
            - clients/java/opensysml-conformance/target/site/jacoco/jacoco.xml
            - clients/java/opensysml-client/target/classes
            - clients/java/opensysml-conformance/target/classes
            - clients/java/opensysml-client/target/test-classes
            - clients/java/opensysml-conformance/target/test-classes
            - clients/java/opensysml-client/target/dependency
            - clients/java/opensysml-conformance/target/dependency

      - run:
          name: Run the conformance suite through the client
          command: |
            mvn -B -q -f clients/java/pom.xml -pl opensysml-conformance \
              dependency:build-classpath -Dmdep.outputFile=/tmp/cp.txt
            java -cp "clients/java/opensysml-conformance/target/classes:$(cat /tmp/cp.txt)" \
              org.openmbee.opensysml.conformance.Main \
              -binary bin/sysml-grpc -protocols connect,connect-json -allow-skips \
              -report bin/conformance-report-java.json

      - store_test_results:
          path: clients/java/opensysml-client/target/surefire-reports

      - store_artifacts:
          path: bin/conformance-report-java.json

      - store_artifacts:
          path: clients/java/opensysml-client/target

      # The committed Java stubs are checked in go-static, which has the Go
      # toolchain the one buf template needs.

  # The npm client's gate. The service binary comes from the workspace because
  # this executor has no Go toolchain to build one with, and both the tests and
  # the conformance run start private children from it.
  node-test:
    executor: node-executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Install the client's dependencies
          command: |
            cd clients/node
            npm ci

      - run:
          name: Build the package
          command: |
            cd clients/node
            npm run build

      - run:
          name: Typecheck
          command: |
            cd clients/node
            npm run typecheck

      - run:
          name: Lint
          command: |
            cd clients/node
            npm run lint

      - run:
          name: Run the tests
          command: |
            chmod +x bin/sysml-grpc
            export OPENSYSML_BINARY="$(pwd)/bin/sysml-grpc"
            make node-coverage

      # The scan job reads this report; without it every TypeScript line counts
      # as uncovered.
      - persist_to_workspace:
          root: .
          paths:
            - coverage-node.lcov

      # --allow-skips because v1 covers 5 of the 15 RPCs; the skipped count is
      # reported and the artifact records which scenarios they were.
      - run:
          name: Run the conformance suite through the client
          command: |
            export OPENSYSML_BINARY="$(pwd)/bin/sysml-grpc"
            cd clients/node
            npm run conformance -- --binary "$OPENSYSML_BINARY" --allow-skips \
              --report /tmp/node-conformance.json

      # A runner that passes against a deliberately broken client tests nothing.
      - run:
          name: Check the conformance runner catches a broken client
          command: |
            export OPENSYSML_BINARY="$(pwd)/bin/sysml-grpc"
            cd clients/node
            for mutation in hide-capability drop-diagnostics blank-symbol-kind shift-integer drop-feature-values; do
              if npm run conformance -- --binary "$OPENSYSML_BINARY" --allow-skips \
                   --protocols connect --mutate "$mutation" > /dev/null 2>&1; then
                echo "Error: the suite passed with the $mutation mutation applied"
                exit 1
              fi
              echo "ok: $mutation is caught"
            done

      - store_artifacts:
          path: /tmp/node-conformance.json
          destination: node-conformance.json

      # This executor has no Go toolchain, so buf comes from the official release
      # rather than `go run`, pinned by digest so a substituted asset is not run.
      - run:
          name: Install buf
          command: |
            curl -fsSL -o /tmp/buf \
              https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
            echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
            sudo install -m 0755 /tmp/buf /usr/local/bin/buf
            buf --version

      # Committed stubs must be what buf generates, or the checked-in client and
      # the schema can drift apart silently.
      - run:
          name: Verify the committed TypeScript stubs are current
          command: |
            make proto-ts BUF=buf
            git add -N clients/node/src/generated
            git diff --exit-code clients/node/src/generated

  # Publishes opensysml to PyPI on a `opensysml-v<version>` tag. PyPI has no
  # trusted-publishing (OIDC) support for CircleCI — the supported providers are
  # GitHub Actions, Google Cloud, ActiveState and GitLab CI/CD, and
  # pypi/warehouse#13888 is the open request — so this authenticates with an API
  # token supplied by the restricted `PyPI` context. An upload cannot be
  # taken back (a version can be yanked, never re-uploaded), so everything that
  # can fail is made to fail before `twine upload` runs: the tag/version check,
  # `twine check --strict`, an install of the built wheel into a clean
  # virtualenv, and a refusal when the version is already on the index.
  publish-pypi:
    executor: python-executor
    steps:
      - checkout

      - run:
          name: Install build tooling
          command: python -m pip install --upgrade pip build twine packaging

      - run:
          name: Require the publishing token
          command: |
            # A pre-release version goes to TestPyPI (the dry run described in
            # docs/project/releasing.md), everything else to PyPI, so only the token for
            # the index actually being used is required.
            if [ "$(python clients/python/scripts/check_version.py --pre-release)" = "yes" ]; then
              if [ -z "${TEST_PYPI_API_TOKEN:-}" ]; then
                echo "Error: TEST_PYPI_API_TOKEN is not set, and ${CIRCLE_TAG} names a"
                echo "pre-release version, which is published to TestPyPI."
                echo "Add it to the 'PyPI' context (Organization Settings ->"
                echo "Contexts) as a TestPyPI API token. See docs/project/releasing.md."
                exit 1
              fi
            elif [ -z "${PYPI_API_TOKEN:-}" ]; then
              echo "Error: PYPI_API_TOKEN is not set. This job authenticates to PyPI"
              echo "with an API token, not OIDC, and refuses to run twine without one"
              echo "rather than failing later with a 403."
              echo "Add it to the 'PyPI' context (Organization Settings ->"
              echo "Contexts) and make sure this job references that context."
              echo "See docs/project/releasing.md."
              exit 1
            fi

      - run:
          name: Resolve the version from the tag
          command: |
            # Fails loudly when the tag names a version other than the one the
            # package would publish, before anything is built.
            VERSION="$(python clients/python/scripts/check_version.py)"
            PRE_RELEASE="$(python clients/python/scripts/check_version.py --pre-release)"
            echo "export OPENSYSML_VERSION=${VERSION}" >> "$BASH_ENV"
            echo "export OPENSYSML_PRE_RELEASE=${PRE_RELEASE}" >> "$BASH_ENV"
            echo "Publishing opensysml ${VERSION} (pre-release: ${PRE_RELEASE})"

      - run:
          name: Refuse a version the index already has
          command: |
            if [ "$OPENSYSML_PRE_RELEASE" = "yes" ]; then
              INDEX_HOST="test.pypi.org"
            else
              INDEX_HOST="pypi.org"
            fi
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://${INDEX_HOST}/pypi/opensysml/${OPENSYSML_VERSION}/json")
            if [ "$STATUS" = "200" ]; then
              echo "Error: opensysml ${OPENSYSML_VERSION} is already on ${INDEX_HOST}."
              echo "A PyPI version is immutable: it can be yanked but never replaced,"
              echo "so this job fails rather than half-publishing. Re-running a"
              echo "release for the same version is therefore not an operation PyPI"
              echo "supports, unlike publish-github-release, which replaces assets"
              echo "with 'ghr -replace'. Bump the version in"
              echo "clients/python/opensysml/_version.py and tag opensysml-v<new version>."
              exit 1
            fi
            echo "${INDEX_HOST} has no opensysml ${OPENSYSML_VERSION} (HTTP ${STATUS}); continuing"

      - run:
          name: Build the wheel and the sdist
          command: |
            rm -rf clients/python/dist
            python -m build --outdir clients/python/dist clients/python/
            ls -l clients/python/dist

      - run:
          name: Check the metadata (twine check --strict)
          command: python -m twine check --strict clients/python/dist/*

      - run:
          name: Install the built wheel into a clean virtualenv and import it
          command: |
            # A broken artifact fails the job rather than PyPI.
            python -m venv /tmp/verify-wheel
            /tmp/verify-wheel/bin/python -m pip install --upgrade pip
            /tmp/verify-wheel/bin/python -m pip install clients/python/dist/*.whl
            # The backslash is CircleCI's escape for a literal heredoc operator
            # in a 2.1 config; the shell sees a plain heredoc.
            /tmp/verify-wheel/bin/python - \<<'EOF'
            import os
            import opensysml
            expected = os.environ["OPENSYSML_VERSION"]
            assert opensysml.__version__ == expected, (
                f"installed wheel reports {opensysml.__version__}, expected {expected}"
            )
            print(f"opensysml {opensysml.__version__} imported from the built wheel")
            EOF

      - run:
          name: Upload to the index
          command: |
            # The token is read straight into twine's environment: nothing here
            # echoes it, and nothing in this job prints the environment.
            export TWINE_USERNAME=__token__
            if [ "$OPENSYSML_PRE_RELEASE" = "yes" ]; then
              export TWINE_REPOSITORY_URL=https://test.pypi.org/legacy/
              export TWINE_PASSWORD="$TEST_PYPI_API_TOKEN"
              echo "Uploading opensysml ${OPENSYSML_VERSION} to TestPyPI"
            else
              export TWINE_PASSWORD="$PYPI_API_TOKEN"
              echo "Uploading opensysml ${OPENSYSML_VERSION} to PyPI"
            fi
            # No --skip-existing: a version that appeared since the check above
            # must fail the job rather than pass silently.
            python -m twine upload clients/python/dist/*

      - store_artifacts:
          path: clients/python/dist
          destination: opensysml-dist

  # Publishes packaging/pypi-pysysml on a `pysysml-v<version>` tag: the final
  # release of the pre-rename name, which raises on import to point at
  # opensysml. It shares the `PyPI` context, and like publish-pypi refuses to
  # run without a token or to overwrite a version the index already has.
  publish-pypi-pysysml:
    executor: python-executor
    steps:
      - checkout

      - run:
          name: Install build tooling
          command: python -m pip install --upgrade pip build twine packaging

      - run:
          name: Require the publishing token
          command: |
            if [ -z "${PYPI_API_TOKEN:-}" ]; then
              echo "Error: PYPI_API_TOKEN is not set. Add it to the 'PyPI' context"
              echo "(Organization Settings -> Contexts). See docs/project/releasing.md."
              exit 1
            fi

      - run:
          name: Resolve the version from the tag
          command: |
            # The placeholder has no _version.py to read, so the version comes
            # from its pyproject and the tag has to name it.
            DECLARED=$(sed -n 's/^version = "\(.*\)"/\1/p' packaging/pypi-pysysml/pyproject.toml)
            TAGGED=${CIRCLE_TAG#pysysml-v}
            if [ -z "$DECLARED" ] || [ "$DECLARED" != "$TAGGED" ]; then
              echo "Error: ${CIRCLE_TAG} names ${TAGGED}, but"
              echo "packaging/pypi-pysysml/pyproject.toml declares '${DECLARED}'."
              exit 1
            fi
            echo "export PYSYSML_PLACEHOLDER_VERSION=${DECLARED}" >> "$BASH_ENV"

      - run:
          name: Refuse a version the index already has
          command: |
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/pysysml/${PYSYSML_PLACEHOLDER_VERSION}/json")
            if [ "$STATUS" = "200" ]; then
              echo "Error: pysysml ${PYSYSML_PLACEHOLDER_VERSION} is already on PyPI,"
              echo "and a version can be yanked but never re-uploaded."
              exit 1
            fi
            echo "pypi.org has no pysysml ${PYSYSML_PLACEHOLDER_VERSION} (HTTP ${STATUS}); continuing"

      - run:
          name: Build the wheel and the sdist
          command: |
            rm -rf packaging/pypi-pysysml/dist
            python -m build --outdir packaging/pypi-pysysml/dist packaging/pypi-pysysml/
            ls -l packaging/pypi-pysysml/dist

      - run:
          name: Check the metadata (twine check --strict)
          command: python -m twine check --strict packaging/pypi-pysysml/dist/*

      - run:
          name: Install the built wheel and require the import to fail
          command: |
            # The artifact is only correct if importing it raises: a wheel that
            # imported cleanly would be the alias this release refuses to be.
            python -m venv /tmp/verify-placeholder
            /tmp/verify-placeholder/bin/python -m pip install --upgrade pip
            /tmp/verify-placeholder/bin/python -m pip install packaging/pypi-pysysml/dist/*.whl
            /tmp/verify-placeholder/bin/python - \<<'EOF'
            try:
                import pysysml
            except ImportError as err:
                assert "pip install opensysml" in str(err), str(err)
                print("pysysml placeholder raises ImportError as intended")
            else:
                raise SystemExit("the placeholder imported cleanly; it must raise")
            EOF

      - run:
          name: Upload to PyPI
          command: |
            export TWINE_USERNAME=__token__
            export TWINE_PASSWORD="$PYPI_API_TOKEN"
            echo "Uploading pysysml ${PYSYSML_PLACEHOLDER_VERSION} to PyPI"
            python -m twine upload packaging/pypi-pysysml/dist/*

      - store_artifacts:
          path: packaging/pypi-pysysml/dist
          destination: pysysml-placeholder-dist

  build-release:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download
      - go/save-cache
      
      - run:
          name: Build release binaries
          command: |
            VERSION=${CIRCLE_TAG}
            COMMIT=${CIRCLE_SHA1}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')
            
            # Static binaries: a host-linked libc would pin the release to the builder's glibc.
            export CGO_ENABLED=0
            
            # Build for multiple platforms using make
            mkdir -p dist
            
            GOOS=linux GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-sysml VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml dist/sysml-windows-amd64.exe
            
            GOOS=linux GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-lsp VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-lsp dist/sysml-lsp-windows-amd64.exe
            
            # The gRPC service backs the Python client, which downloads one
            # file per platform and verifies it against a .sha256 sidecar, so
            # these are published raw rather than archived. They are built into
            # a subdirectory to keep them out of the archive globs below.
            mkdir -p dist/grpc
            
            GOOS=linux GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-linux-amd64
            
            GOOS=linux GOARCH=arm64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-linux-arm64
            
            GOOS=darwin GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-darwin-amd64
            
            GOOS=darwin GOARCH=arm64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-darwin-arm64
            
            GOOS=windows GOARCH=amd64 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
            mv bin/sysml-grpc dist/grpc/sysml-grpc-windows-amd64.exe
            
            # Create tarballs
            cd dist
            for binary in sysml-*; do
              if [[ $binary == *.exe ]]; then
                zip "${binary%.exe}.zip" "$binary"
              else
                tar czf "${binary}.tar.gz" "$binary"
              fi
            done
            
            # Bundle archives: both binaries under their plain names
            # (sysml, sysml-lsp), which is the layout a Homebrew formula or a
            # PATH install expects, with their manual pages beside them under
            # share/man/man1 for a formula or a package to install. sysml-grpc
            # is not in the bundle, so its page is not either. The per-binary
            # archives above are kept unchanged so existing download links keep
            # working.
            for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
              stage="stage/${platform}"
              mkdir -p "$stage/share/man/man1"
              cp "sysml-${platform}" "${stage}/sysml"
              cp "sysml-lsp-${platform}" "${stage}/sysml-lsp"
              cp ../man/man1/sysml.1 ../man/man1/sysml-lsp.1 "${stage}/share/man/man1/"
              tar czf "opensysml-${platform}.tar.gz" -C "$stage" sysml sysml-lsp share
            done
            mkdir -p stage/windows-amd64
            cp sysml-windows-amd64.exe stage/windows-amd64/sysml.exe
            cp sysml-lsp-windows-amd64.exe stage/windows-amd64/sysml-lsp.exe
            (cd stage/windows-amd64 && zip -q ../../opensysml-windows-amd64.zip sysml.exe sysml-lsp.exe)
            rm -rf stage
            
            # Checksums over every published archive, so a Homebrew formula
            # (or a careful user) can verify a download.
            sha256sum ./*.tar.gz ./*.zip | sed 's|\./||' > SHA256SUMS.txt
            
            # Same for the raw gRPC binaries, plus a per-file sidecar, which is
            # the only checksum opensysml reads.
            (cd grpc && sha256sum sysml-grpc-* >> ../SHA256SUMS.txt)
            (cd grpc && for f in sysml-grpc-*; do sha256sum "$f" > "$f.sha256"; done)
            cat SHA256SUMS.txt

      # Signs the manifest keylessly: the certificate identity comes from this
      # job's CircleCI OIDC token, so there is no signing key to store.
      - run:
          name: Sign the checksum manifest with cosign keyless
          command: |
            go install github.com/sigstore/cosign/v3/cmd/cosign@v3.0.3
            export PATH="$(go env GOPATH)/bin:$PATH"

            # Fulcio requires the 'sigstore' audience, which the ambient
            # $CIRCLE_OIDC_TOKEN_V2 does not carry.
            SIGSTORE_ID_TOKEN="$(circleci run oidc get --claims '{"aud": "sigstore"}')"
            export SIGSTORE_ID_TOKEN

            cd dist
            cosign sign-blob SHA256SUMS.txt \
              --oidc-issuer "https://oidc.circleci.com/org/${CIRCLE_ORGANIZATION_ID}" \
              --bundle SHA256SUMS.txt.bundle \
              --use-signing-config=false \
              --yes

      # Fails the release rather than publish a signature the client's pinned
      # identity would reject, and prints the identity that signed.
      - run:
          name: Verify the signature against the identity clients pin
          command: |
            export PATH="$(go env GOPATH)/bin:$PATH"
            cd dist
            cosign verify-blob SHA256SUMS.txt \
              --bundle SHA256SUMS.txt.bundle \
              --certificate-oidc-issuer "https://oidc.circleci.com/org/${CIRCLE_ORGANIZATION_ID}" \
              --certificate-identity-regexp "^https://circleci\\.com/api/v2/projects/${CIRCLE_PROJECT_ID}/pipeline-definitions/[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$"
            echo "Signed by:"
            jq -r '.verificationMaterial.certificate.rawBytes' SHA256SUMS.txt.bundle \
              | base64 -d | openssl x509 -inform DER -noout -text \
              | grep -A1 -E '1\.3\.6\.1\.4\.1\.57264\.1\.8:|URI:' || true

      
      # An artifact whose version disagrees with its tag looks identical on the
      # release page. The host-platform builds are asked what they report; the
      # cross-compiled ones cannot run here, so they are checked for the version
      # string the ldflags should have written into them.
      - run:
          name: Verify the built artifacts report the tag
          command: |
            if [ -z "${CIRCLE_TAG}" ]; then
              echo "Error: CIRCLE_TAG is empty; this job only runs on a tag"
              exit 1
            fi
            status=0
            fail() {
              echo "Error: $1 does not carry the tag ${CIRCLE_TAG} it is being"
              echo "released as: $2. The version ldflags (see the Makefile's"
              echo "LDFLAGS) did not reach this build; nothing was published."
              status=1
            }
            for binary in dist/sysml-linux-amd64 dist/sysml-lsp-linux-amd64 \
                          dist/grpc/sysml-grpc-linux-amd64; do
              reported="$("$binary" --version 2>&1 | head -n 1)"
              case " $reported " in
                *" ${CIRCLE_TAG} "*) echo "ok: $binary reports ${CIRCLE_TAG}" ;;
                *) fail "$binary" "it reports '${reported}'" ;;
              esac
            done
            for binary in dist/sysml-* dist/grpc/sysml-grpc-*; do
              case "$binary" in
                *.tar.gz|*.zip|*.sha256) continue ;;
                dist/sysml-linux-amd64|dist/sysml-lsp-linux-amd64) continue ;;
                dist/grpc/sysml-grpc-linux-amd64) continue ;;
              esac
              if grep -qa -- "${CIRCLE_TAG}" "$binary"; then
                echo "ok: $binary carries ${CIRCLE_TAG}"
              else
                fail "$binary" "the version string is absent from the binary"
              fi
            done
            exit $status

      - store_artifacts:
          path: dist/
          destination: release-binaries
      
      - persist_to_workspace:
          root: .
          paths:
            - dist

  # The five sysml-grpc binaries the per-platform npm packages carry, built from
  # the tagged revision in this pipeline so the published bytes never travel.
  build-node-binaries:
    executor: go-executor
    steps:
      - checkout
      - go/load-cache
      - go/mod-download

      - run:
          name: Cross-compile sysml-grpc and write its checksum sidecars
          command: |
            VERSION=${CIRCLE_TAG}
            COMMIT=${CIRCLE_SHA1}
            BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
            GO_VERSION=$(go version | awk '{print $3}')
            mkdir -p dist/grpc
            build() {
              GOOS=$1 GOARCH=$2 make build-grpc VERSION="$VERSION" COMMIT="$COMMIT" \
                BUILD_TIME="$BUILD_TIME" GO_VERSION="$GO_VERSION"
              mv bin/sysml-grpc "dist/grpc/sysml-grpc-$1-$2$3"
            }
            build linux amd64 ""
            build linux arm64 ""
            build darwin amd64 ""
            build darwin arm64 ""
            build windows amd64 ".exe"
            cd dist/grpc
            for asset in sysml-grpc-*; do sha256sum "$asset" > "$asset.sha256"; done
            cat ./*.sha256

      - persist_to_workspace:
          root: .
          paths:
            - dist/grpc

  # Publishes @opensysml/client and its five per-platform packages on a
  # `client-node-v<version>` tag. npm has no trusted publishing for CircleCI, so
  # this authenticates with an automation token from the restricted `npm`
  # context. Everything that can fail runs before the first publish: the
  # tag/version check, the client's own gate, the digest check on every binary,
  # and a refusal when the version is already published. The platform
  # packages go first, because @opensysml/client's optionalDependencies name them
  # at this exact version.
  publish-npm:
    executor: node-executor
    steps:
      - checkout

      - attach_workspace:
          at: .

      - run:
          name: Check the tag matches the package version
          command: |
            version=$(node -p "require('./clients/node/package.json').version")
            expected="client-node-v${version}"
            if [ "${CIRCLE_TAG}" != "$expected" ]; then
              echo "Error: tag ${CIRCLE_TAG} does not match clients/node/package.json"
              echo "version ${version}; the tag for it is ${expected}. Nothing was published."
              exit 1
            fi

      - run:
          name: Refuse a version already on the registry
          command: |
            version=$(node -p "require('./clients/node/package.json').version")
            for name in @opensysml/client @opensysml/sysml-grpc-linux-x64 \
                        @opensysml/sysml-grpc-linux-arm64 @opensysml/sysml-grpc-darwin-x64 \
                        @opensysml/sysml-grpc-darwin-arm64 @opensysml/sysml-grpc-win32-x64; do
              if npm view "${name}@${version}" version > /dev/null 2>&1; then
                echo "Error: ${name}@${version} is already published; a version cannot be"
                echo "replaced. Bump clients/node/package.json and tag again."
                exit 1
              fi
            done

      - run:
          name: Build and test the package
          command: |
            chmod +x dist/grpc/sysml-grpc-linux-amd64
            export OPENSYSML_BINARY="$(pwd)/dist/grpc/sysml-grpc-linux-amd64"
            cd clients/node
            npm ci
            npm run build
            npm run typecheck
            npm run lint
            npm test

      - run:
          name: Build the per-platform packages
          command: |
            cd clients/node
            npm run platform-packages -- --binaries ../../dist/grpc

      - run:
          name: Authenticate to npm
          command: |
            if [ -z "${NPM_TOKEN}" ]; then
              echo "Error: NPM_TOKEN is not set; the 'npm' context supplies it."
              exit 1
            fi
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      # No --provenance: the npm CLI only mints attestations on GitHub Actions and
      # GitLab CI/CD, and it fails rather than publish unattested when asked here.
      - run:
          name: Publish the per-platform packages
          command: |
            for directory in clients/node/packages/sysml-grpc-*; do
              npm publish "$directory" --access public
            done

      - run:
          name: Publish @opensysml/client
          command: |
            cd clients/node
            npm publish --access public

  publish-github-release:
    docker:
      - image: cibuilds/github:0.13
    steps:
      - attach_workspace:
          at: .
      
      - run:
          name: Publish Release on GitHub
          command: |
            VERSION="${CIRCLE_TAG}"
            if [ -z "$VERSION" ]; then
              echo "Error: CIRCLE_TAG is empty"
              exit 1
            fi
            echo "Publishing release $VERSION"
            ls -la dist/
            
            # Move only tarballs to a release directory
            mkdir -p dist/release
            mv dist/*.tar.gz dist/*.zip dist/release/ 2>/dev/null || true
            mv dist/grpc/* dist/release/
            mv dist/SHA256SUMS.txt dist/release/
            # The signature over that manifest, which the Python client verifies
            # before it trusts a digest from it.
            mv dist/SHA256SUMS.txt.bundle dist/release/
            echo "Release artifacts:"
            ls -la dist/release/
            
            # Try different token variable names
            TOKEN="${GITHUB_TOKEN:-${GH_TOKEN:-${CIRCLE_TOKEN}}}"
            if [ -z "$TOKEN" ]; then
              echo "Error: No GitHub token found. Tried GITHUB_TOKEN, GH_TOKEN, CIRCLE_TOKEN"
              exit 1
            fi
            
            # '-replace' reuses an existing release and only re-uploads assets of
            # the same name, so hand-written notes, title and prerelease/latest
            # flags survive a re-run. Never '-delete': that is an alias of
            # '-recreate', which deletes the release *and its tag* and creates an
            # empty one. A tag with no release yet still gets one created here.
            ghr -t "${TOKEN}" \
                -u "${CIRCLE_PROJECT_USERNAME}" \
                -r "${CIRCLE_PROJECT_REPONAME}" \
                -c "${CIRCLE_SHA1}" \
                -replace \
                "${VERSION}" \
                dist/release/

workflows:
  version: 2

  # Build and test every merge into main or develop; pull requests run .github/workflows/pr.yml instead.
  # The Go suite is the four `Go …` jobs, and everything downstream requires all of them.
  build-test:
    jobs:
      - go-static:
          name: Go static checks
          filters: &integration-branches
            branches:
              only: [main, develop]
            tags:
              ignore: /.*/
      - go-race-test:
          name: Go race tests
          filters: *integration-branches
      - go-coverage:
          name: Go coverage profile
          filters: *integration-branches
      - go-gates:
          name: Go gates and binaries
          filters: *integration-branches
      - python-test:
          name: Python client tests
          requires: &go-suite
            - Go static checks
            - Go race tests
            - Go coverage profile
            - Go gates and binaries
          filters: *integration-branches
      - rust-test:
          name: Rust client tests
          requires: *go-suite
          filters: *integration-branches
      - java-test:
          name: Java client tests
          requires: *go-suite
          filters: *integration-branches
      - node-test:
          name: Node client tests
          requires: *go-suite
          filters: *integration-branches
      - scan:
          name: SonarCloud scan
          # Matched exactly, like PyPI below; this context holds SONAR_TOKEN.
          context:
            - SonarCloud
          requires:
            - Go static checks
            - Go race tests
            # Persists coverage.txt, the Go report the scan reads.
            - Go coverage profile
            - Go gates and binaries
            # Each contributes a coverage report; without them the scan sees
            # only Go coverage and grades every other language at zero.
            - Python client tests
            - Java client tests
            - Node client tests
          filters: *integration-branches

  # Build and release on tags. The suite runs here too: a tag can point at any
  # commit, so a release is only published from a revision proven green.
  release:
    jobs:
      - go-static:
          name: Go static checks
          filters: &release-tags
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - go-race-test:
          name: Go race tests
          filters: *release-tags
      - go-coverage:
          name: Go coverage profile
          filters: *release-tags
      - go-gates:
          name: Go gates and binaries
          filters: *release-tags

      - build-release:
          name: Build release artifacts
          requires: *go-suite
          filters: *release-tags

      - publish-github-release:
          name: Publish GitHub release
          requires:
            - Build release artifacts
          filters: *release-tags

  # Publish opensysml to PyPI on its own tag. The package's version is not
  # lockstep with the core's: it resolves a sysml-grpc binary at runtime from
  # whichever release the caller asks for (OPENSYSML_GRPC_VERSION, or 'latest'),
  # not from a release matching its own version, so a client fix should not need
  # a core release and a core release should not need a PyPI upload. Keeping the
  # irreversible half on its own tag also keeps `v*` re-runnable, which
  # publish-github-release relies on ('ghr -replace').
  release-python:
    jobs:
      - go-static:
          name: Go static checks
          filters: &python-tags
            branches:
              ignore: /.*/
            tags:
              only: /^opensysml-v.*/
      - go-race-test:
          name: Go race tests
          filters: *python-tags
      - go-coverage:
          name: Go coverage profile
          filters: *python-tags
      - go-gates:
          name: Go gates and binaries
          filters: *python-tags

      - python-test:
          name: Python client tests
          requires: *go-suite
          filters: *python-tags

      - publish-pypi:
          name: Publish opensysml to PyPI
          # Last, and only after the Go suite and the Python client's own tests
          # have passed on this revision: an upload cannot be undone.
          # The organization context is named 'PyPI'; a context reference is
          # matched exactly, so the case here has to match it.
          context:
            - PyPI
          requires:
            - Go static checks
            - Go race tests
            - Go coverage profile
            - Go gates and binaries
            - Python client tests
          filters: *python-tags

  # Publish the npm client on its own tag, for the same reason the Python client
  # has one: the package resolves a service binary at run time, so a client fix
  # should not need a core release and a core release should not need an npm
  # publish. The binaries the platform packages carry are built here rather than
  # downloaded from a release.
  release-node:
    jobs:
      - go-static:
          name: Go static checks
          filters: &node-tags
            branches:
              ignore: /.*/
            tags:
              only: /^client-node-v.*/
      - go-race-test:
          name: Go race tests
          filters: *node-tags
      - go-coverage:
          name: Go coverage profile
          filters: *node-tags
      - go-gates:
          name: Go gates and binaries
          filters: *node-tags

      - node-test:
          name: Node client tests
          requires: *go-suite
          filters: *node-tags

      - build-node-binaries:
          name: Build Node platform binaries
          requires: *go-suite
          filters: *node-tags

      - publish-npm:
          name: Publish npm client
          # The organization context is named 'npm'; a context reference is
          # matched exactly, so the case here has to match it. A publish cannot
          # be taken back, so it runs last and only on a revision proven green.
          context:
            - npm
          requires:
            - Go static checks
            - Go race tests
            - Go coverage profile
            - Go gates and binaries
            - Node client tests
            - Build Node platform binaries
          filters: *node-tags

  # Publishes the final release of the pre-rename PyPI name on a `pysysml-v*`
  # tag. It is its own workflow because the artifact shares no code with the
  # client: the Python suite is what proves it, and the placeholder can be
  # published without a client release (or ever again).
  release-pysysml-placeholder:
    jobs:
      # python-test attaches the workspace the Go suite persists (it needs a
      # sysml-grpc to talk to), so it cannot run on its own.
      - go-static:
          name: Go static checks
          filters: &pysysml-tags
            branches:
              ignore: /.*/
            tags:
              only: /^pysysml-v.*/
      - go-race-test:
          name: Go race tests
          filters: *pysysml-tags
      - go-coverage:
          name: Go coverage profile
          filters: *pysysml-tags
      - go-gates:
          name: Go gates and binaries
          filters: *pysysml-tags

      - python-test:
          name: Python client tests
          requires: *go-suite
          filters: *pysysml-tags

      - publish-pypi-pysysml:
          name: Publish pysysml placeholder to PyPI
          context:
            - PyPI
          requires:
            - Python client tests
          filters: *pysysml-tags
