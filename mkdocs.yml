# The site is the docs/ tree unmodified: every page stays a Markdown file read on
# GitHub, and MkDocs is only the renderer. The landing page is the exception: it
# frames docs/README.md with a hero that only makes sense on a web page.
site_name: OpenSysML
site_description: A SysML v2 and KerML implementation in Go — language server, REPL, execution runtime, and Go, Python, Node, Java and Rust clients
site_url: https://opensysml.org/
repo_url: https://github.com/Open-MBEE/OpenSysML
repo_name: Open-MBEE/OpenSysML
edit_uri: edit/develop/docs/
# The affiliation is a span rather than its own line because the footer's copyright is the
# only place the theme lets a site put text; stylesheets/footer.css moves it to the right.
copyright: >-
  Apache-2.0
  <span class="osml-affiliation">part of <a href="https://www.openmbee.org/">Open-MBEE</a>,
  a <a href="https://numfocus.org">NumFOCUS</a> project</span>

docs_dir: docs

theme:
  name: material
  # overrides/ holds the landing page template and the sidebar navigation (the
  # shipped partial minus tab-mode hiding of inactive top-level items); every
  # documentation page is otherwise the theme as shipped.
  custom_dir: overrides
  logo: assets/opensysml-mark-white.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/footer.css
  - stylesheets/header.css
  - stylesheets/ecosystem.css

extra:
  social:
    - icon: fontawesome/solid/dragon
      link: https://lord.opensysml.org/
      name: Legend of the Red Dragon

extra_javascript:
  - assets/sysml-engine-loader.js

plugins:
  - search
  # A page published under another name keeps answering there: the site redirects the old
  # URL, and the pointer file left at the old path answers the links GitHub serves.
  - redirects:
      redirect_maps:
        guide/09-python.md: clients/python/index.md
        ecosystem.md: README.md
  - mkdocstrings:
      handlers:
        python:
          paths: [client/python]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            extensions: [scripts/griffe_sphinx_roles.py]
            show_source: false
            members_order: source
            filters: ["!^_"]
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true

not_in_nav: |
  guide/09-python.md
  internals/README.md
  internals/architecture.md
  internals/testing.md
  internals/performance.md
  internals/interface-records.md
  internals/execution-ir-design.md
  project/README.md
  project/spec-compliance.md
  project/exact-rational-evaluation.md
  project/expansion-regions.md
  project/bitwise-complement.md
  project/exception-handlers.md
  project/pilot-differential.md
  project/spec-pilot-gap-register.md
  project/roadmap.md
  project/nightly.md

# repo_links: links out of docs/ (examples/, Go sources, CONTRIBUTING.md) are correct
# on GitHub and 404 here, so they are rewritten to the repository at build time.
# landing: docs/README.md is rendered with the landing page template.
hooks:
  - scripts/mkdocs_repo_links.py
  - scripts/mkdocs_landing.py
  - scripts/mkdocs_census.py
  - scripts/mkdocs_suite_figures.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's own slugger, so an anchor written for a page read on GitHub is
      # the same anchor here and #a--b (a dropped em dash) still resolves.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    # A page absent from both nav and not_in_nav fails the build: publishing a
    # page nothing navigates to is the mistake, not an omission.
    omitted_files: warn
    not_found: warn
  links:
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

# Publish what a user or contributor reads; engineering records under docs/project/
# and staged plans stay in the repository and are read on GitHub.
exclude_docs: |
  API.md
  ARCHITECTURE.md
  MACOS_DISTRIBUTION.md
  QUICKSTART.md
  RDF_INTEROP.md
