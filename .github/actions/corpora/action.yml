name: Provision the pinned corpora
description: >-
  Download the pinned OMG corpora and reference models the test suite is gated over,
  each behind a cache keyed on its download script and pin, so a change to the pinned
  tag or the layout invalidates the cache. A restored cache is verified rather than
  trusted. Every job that sets an OPENSYSML_REQUIRE_* variable runs this first.

inputs:
  reference-fmus:
    description: >-
      Also install fmpy and download the Modelica Reference-FMUs, which the FMI gate
      (tests/fmi) drives through the Python runner.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache the OMG training corpus
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: examples/sysml-v2-training
        key: training-corpus-${{ hashFiles('scripts/download-training-examples.sh', 'scripts/pilot-pin.sh') }}

    - name: Download the OMG training corpus
      shell: bash
      run: ./scripts/download-training-examples.sh

    - name: Verify the OMG training corpus
      shell: bash
      run: |
        count=$(find examples/sysml-v2-training -name '*.sysml' | wc -l)
        echo "training corpus: $count .sysml files"
        if [ "$count" -eq 0 ]; then
          echo "error: the training corpus is empty; the corpus gate would not run" >&2
          exit 1
        fi

    # Same keying as the training corpus: the download script plus the shared
    # pilot pin.
    - name: Cache the OMG pilot corpora
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: examples/pilot-corpora
        key: pilot-corpora-${{ hashFiles('scripts/download-pilot-corpora.sh', 'scripts/pilot-pin.sh') }}

    - name: Download the OMG pilot corpora
      shell: bash
      run: ./scripts/download-pilot-corpora.sh

    - name: Verify the OMG pilot corpora
      shell: bash
      run: |
        for root in sysml-examples sysml-validation kerml-examples; do
          count=$(find "examples/pilot-corpora/$root" -type f \( -name '*.sysml' -o -name '*.kerml' \) | wc -l)
          echo "pilot corpus $root: $count model files"
          if [ "$count" -eq 0 ]; then
            echo "error: pilot corpus $root is empty; the corpora gate would not run" >&2
            exit 1
          fi
        done

    # The specification examples, extracted from the two PDFs at the same pin:
    # the PDFs are cached, the extraction reruns from them (it is the tree's
    # own tool), and the result is verified rather than trusted.
    - name: Cache the OMG specification documents
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/spec-docs/pdf
        key: spec-docs-${{ hashFiles('scripts/download-spec-examples.sh', 'scripts/pilot-pin.sh') }}

    - name: Extract the OMG specification examples
      shell: bash
      run: |
        ./scripts/ci-apt-install.sh --no-install-recommends poppler-utils
        ./scripts/download-spec-examples.sh

    - name: Verify the OMG specification examples
      shell: bash
      run: |
        for root in sysml kerml; do
          count=$(find "examples/spec-examples/$root" -type f \( -name '*.sysml' -o -name '*.kerml' \) | wc -l)
          echo "specification examples $root: $count model files"
          if [ "$count" -eq 0 ]; then
            echo "error: specification examples $root is empty; the spec-examples gate would not run" >&2
            exit 1
          fi
        done

    # The PSSM suite is one pinned file; keyed on its download script and pin.
    - name: Cache the OMG PSSM test suite
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/pssm
        key: pssm-suite-${{ hashFiles('scripts/download-pssm-suite.sh', 'scripts/pssm-pin.sh') }}

    - name: Download the OMG PSSM test suite
      shell: bash
      run: ./scripts/download-pssm-suite.sh

    # The SysML v1 to v2 transformation model is one pinned file; keyed on its
    # download script and pin.
    - name: Cache the SysML v1 to v2 transformation model
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/sysml-v1tov2
        key: sysml-v1tov2-${{ hashFiles('scripts/download-sysml-v1tov2.sh', 'scripts/sysml-v1tov2-pin.sh') }}

    - name: Download the SysML v1 to v2 transformation model
      shell: bash
      run: ./scripts/download-sysml-v1tov2.sh

    # The fUML reference implementation's models and jar, checksummed; keyed
    # on its download script and pin. Never run in CI: the Go tests read the
    # committed expected-record (docs/project/fuml-referee.md).
    - name: Cache the fUML reference-implementation suite
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/fuml
        key: fuml-suite-${{ hashFiles('scripts/download-fuml-suite.sh', 'scripts/fuml-pin.sh') }}

    - name: Download the fUML reference-implementation suite
      shell: bash
      run: ./scripts/download-fuml-suite.sh

    # The pilot's XMI of the standard library, one subtree of the release
    # repository; keyed on its download script and the shared pilot pin.
    - name: Cache the pilot library XMI
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: build/pilot-library-xmi
        key: pilot-library-xmi-${{ hashFiles('scripts/download-pilot-library-xmi.sh', 'scripts/pilot-pin.sh') }}

    - name: Download the pilot library XMI
      shell: bash
      run: ./scripts/download-pilot-library-xmi.sh

    # The FMI gate's simulator: the reference runner (client/python) is a
    # Python subprocess, so the library it drives is installed here, pinned
    # and wheel-only like every pip install of the workflows.
    - name: Install fmpy
      if: inputs.reference-fmus == 'true'
      shell: bash
      run: pip install --only-binary ":all:" fmpy==0.3.32

    # The Modelica Reference-FMUs, checksummed; keyed on the download script
    # and its pin. A restored cache is verified by the script's own check.
    - name: Cache the Reference-FMUs
      if: inputs.reference-fmus == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: examples/reference-fmus
        key: reference-fmus-${{ hashFiles('scripts/download-reference-fmus.sh', 'scripts/reference-fmus-pin.sh') }}

    - name: Download the Reference-FMUs
      if: inputs.reference-fmus == 'true'
      shell: bash
      run: ./scripts/download-reference-fmus.sh
