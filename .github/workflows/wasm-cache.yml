name: WebAssembly build cache

# Pull-request caches are private to their branch, so the gate in pr.yml can only start warm
# from an entry saved on develop: this runs the gate on each develop push and saves what it built.
on:
  push:
    branches: [develop]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - scripts/ci-go-build-cache.sh
      - .github/workflows/wasm-cache.yml
  workflow_dispatch:

permissions:
  contents: read
  # Deleting the entries a new save supersedes.
  actions: write

concurrency:
  group: wasm-cache
  cancel-in-progress: true

env:
  OPENSYSML_REQUIRE_WASM: "1"

jobs:
  warm:
    name: Warm the WebAssembly build cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        id: go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the WebAssembly build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # After every setup step, so that whatever is marked is marked for a gate that then starts.
      - name: Mark the restored build cache entries unused
        run: scripts/ci-go-build-cache.sh age

      - name: Run the WebAssembly gate
        id: gate
        run: |
          set -o pipefail
          node --version
          make wasm-check 2>&1 | tee wasm-gate.log
          if grep -qE '^\s*--- SKIP' wasm-gate.log; then
            echo "error: the WebAssembly gate skipped" >&2
            exit 1
          fi

      # Go itself keeps an unused entry for five days, and each push adds the objects of
      # every package it changed: restored and saved whole, the entry grew past 5 GB.
      - name: Drop the build cache entries this gate did not use
        id: prune
        if: steps.gate.outcome == 'success'
        run: |
          du -sh ~/.cache/go-build
          scripts/ci-go-build-cache.sh prune
          du -sh ~/.cache/go-build

      # A failed gate may have stopped before using what a passing one needs, so its cache is saved
      # unpruned for the next passing gate to prune; one that never ran or was cancelled saves nothing.
      - name: Save the WebAssembly build cache
        id: save
        if: always() && (steps.prune.outcome == 'success' || steps.gate.outcome == 'failure')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # Only the newest entry is restored, and the others count against the 10 GB the
      # repository may keep, past which GitHub evicts the other caches saved on develop.
      - name: Delete the WebAssembly build caches this one supersedes
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED: wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        run: |
          set -euo pipefail
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key wasm-gate- --limit 100 --json id,key)
          # The save step succeeds over a failed upload, and the older entries are then the only warm ones.
          if ! jq -e 'any(.[]; .key == env.SAVED)' <<<"$caches" >/dev/null; then
            echo "::warning::$SAVED was not saved, so the older entries are kept"
            exit 0
          fi
          jq -r '.[] | select(.key != env.SAVED) | .id' <<<"$caches" |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
