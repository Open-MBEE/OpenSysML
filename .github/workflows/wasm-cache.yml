name: WebAssembly build cache

# Pull-request caches are private to their branch, so the gate in pr.yml can only start warm
# from an entry saved on develop: this runs the gate on each develop push and saves what it built.
on:
  push:
    branches: [develop]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - .github/workflows/wasm-cache.yml
  workflow_dispatch:

permissions:
  contents: read
  # Deleting the entries a new save supersedes.
  actions: write

concurrency:
  group: wasm-cache
  cancel-in-progress: true

env:
  OPENSYSML_REQUIRE_WASM: "1"

jobs:
  warm:
    name: Warm the WebAssembly build cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        id: go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore the WebAssembly build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Run the WebAssembly gate
        run: |
          set -o pipefail
          node --version
          make wasm-check 2>&1 | tee wasm-gate.log
          if grep -qE '^\s*--- SKIP' wasm-gate.log; then
            echo "error: the WebAssembly gate skipped" >&2
            exit 1
          fi

      # The objects a failed gate compiled are as good as a passing one's, so a red
      # develop still warms the next pull request.
      - name: Save the WebAssembly build cache
        id: save
        if: success() || failure()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

      # Each entry is some 3 GB and only the newest is restored; three fill the 10 GB the
      # repository may keep, and GitHub then evicts the other caches saved on develop.
      - name: Delete the WebAssembly build caches this one supersedes
        if: always() && steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SAVED: wasm-gate-${{ runner.os }}-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        run: |
          set -euo pipefail
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key wasm-gate- --limit 100 --json id,key)
          # The save step succeeds over a failed upload, and the older entries are then the only warm ones.
          if ! jq -e 'any(.[]; .key == env.SAVED)' <<<"$caches" >/dev/null; then
            echo "::warning::$SAVED was not saved, so the older entries are kept"
            exit 0
          fi
          jq -r '.[] | select(.key != env.SAVED) | .id' <<<"$caches" |
            xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
