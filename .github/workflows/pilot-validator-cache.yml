name: Pilot validator cache

# A cache saved by a pull request or merge group is private to its ref, and rebaseline.yml saves
# none, so they start with a built validator only from an entry saved on develop: this saves one.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-validator-cache
  cancel-in-progress: false

jobs:
  prime:
    name: Prime the pilot validator cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # An entry at the pin is only read, which also keeps it from eviction; a missing one is built.
      - name: Provision the pinned pilot validator, and save it when the cache holds none
        uses: ./.github/actions/pilot-validator
        with:
          save: 'true'
