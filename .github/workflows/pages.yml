name: Pages

# The site is docs/ rendered by MkDocs, republished when a page or the site
# configuration changes on main. --strict: a broken link fails the deployment.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - 'scripts/mkdocs_repo_links.py'
      - 'scripts/mkdocs_landing.py'
      - 'scripts/mkdocs_header_menu.py'
      - 'scripts/mkdocs_census.py'
      - 'scripts/mkdocs_suite_figures.py'
      - 'cmd/doc-counts/**'
      - 'internal/doccounts/**'
      - 'overrides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time; cancelling one in flight would leave the site behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Documentation site
    # The site is published from Open-MBEE/OpenSysML; a fork would deploy the same
    # pages under its own domain.
    if: github.repository == 'Open-MBEE/OpenSysML'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      # The test-suite figures are counted from the tree by cmd/doc-counts as the
      # site is built, so the build needs the Go toolchain.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install documentation toolchain
        run: make docs-install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation site
        run: make docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploying is the only step that writes; the build job only reads the tree.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
