name: Pages

# The site is docs/ rendered by MkDocs, republished on every push to develop: the
# test-suite figures are counted from the whole tree as it builds, so any
# fixture or test landing in a release moves them. --strict: a broken link
# fails the deployment.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# One deployment at a time; cancelling one in flight would leave the site behind. The group was
# renamed once: a deploy job stuck in `waiting` held the old group and no new run could start.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Documentation site
    # The site is published from Open-MBEE/OpenSysML; a fork would deploy the same
    # pages under its own domain.
    if: github.repository == 'Open-MBEE/OpenSysML'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the in-browser engine is stamped by git describe below.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      # The test-suite figures are counted from the tree by tools/cmd/doc-counts as the
      # site is built, so the build needs the Go toolchain.
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            editors/vscode/package-lock.json
            client/node/package-lock.json

      - name: Install documentation toolchain
        run: make docs-install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # /cli/ runs the engine in the browser; the same target a local preview uses
      # compiles it into docs/assets (never vendored) for mkdocs to copy into site/.
      - name: Build the in-browser modules
        run: make docs-engine-assets

      - name: Build the landing-page diagram
        run: make docs-landing-assets

      - name: Build documentation site
        run: make docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    # Deploying is the only step that writes; the build job only reads the tree.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
