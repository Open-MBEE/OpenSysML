name: Pages

# The site is docs/ rendered by MkDocs, republished on every push to develop: the
# test-suite figures are counted from the whole tree as it builds, so any
# fixture or test landing in a release moves them. --strict: a broken link
# fails the deployment.
on:
  push:
    branches: [develop]
  workflow_dispatch:

# One deployment at a time; cancelling one in flight would leave the site behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Documentation site
    # The site is published from Open-MBEE/OpenSysML; a fork would deploy the same
    # pages under its own domain.
    if: github.repository == 'Open-MBEE/OpenSysML'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the in-browser engine is stamped by git describe below.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      # The test-suite figures are counted from the tree by tools/cmd/doc-counts as the
      # site is built, so the build needs the Go toolchain.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install documentation toolchain
        run: make docs-install

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation site
        run: make docs

      # /cli/ runs the engine in the browser; building it from the same commit the site
      # publishes keeps it at the latest develop build without vendoring a binary in git.
      - name: Build the in-browser engine
        run: |
          mkdir -p site/assets
          CGO_ENABLED=0 GOOS=js GOARCH=wasm go build \
            -ldflags "-s -w -X main.Version=$(git describe --tags --always --dirty --match 'v[0-9]*' 2>/dev/null || echo dev) -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildTime=$(date -u '+%Y-%m-%d_%H:%M:%S') -X main.GoVersion=$(go version | awk '{print $3}')" \
            -o site/assets/sysml-engine.wasm ./cmd/sysml-engine
          gzip -9 site/assets/sysml-engine.wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" site/assets/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploying is the only step that writes; the build job only reads the tree.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
