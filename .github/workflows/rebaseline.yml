name: Rebaseline

# Re-records a pull request's generated baselines after merging develop, on the
# ci:rebaseline label; CONTRIBUTING.md § conventions describes the cycle it replaces.
on:
  # pull_request_target: a pull request in conflict with develop gets no pull_request run.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: rebaseline-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OPENSYSML_REQUIRE_TRAINING_CORPUS: "1"
  OPENSYSML_REQUIRE_PILOT_CORPORA: "1"
  OPENSYSML_REQUIRE_SPEC_EXAMPLES: "1"
  OPENSYSML_REQUIRE_PSSM_SUITE: "1"
  REBASELINE_LABEL: ci:rebaseline
  # The paths the merge may take develop's side of and the recorders rewrite; under
  # the golden directories only the goldens and digests, never a source fixture.
  GENERATED_PATHS: |
    docs/project/api-json-differential-baseline.json
    docs/project/api-json-differential
    docs/project/library-and-prefix-sweep-outcomes.txt
    internal/semantic/metamodel/derived_census_baseline.json
    internal/semantic/metamodel/derived_census_records.tsv
    internal/translate/export/testdata/structure_differential_expected.txt
    tests/corpus/testdata/pilot_corpora_expected.txt
    tests/corpus/testdata/spec_examples_expected.txt
    tests/corpus/testdata/pssm_migration_expected.txt
    tests/corpus/testdata/corpus_roundtrip_expected.txt
    tests/corpus/testdata/api_json_roundtrip_expected.txt
    tests/export/testdata/convert
    tests/parser/testdata/parse
    api/proto/sysml.pb.go
    api/proto/sysml_grpc.pb.go
    api/proto/protoconnect/sysml.connect.go
    client/python/opensysml/proto/sysml_pb2.py
    client/python/opensysml/proto/sysml_pb2.pyi
    client/python/opensysml/proto/sysml_pb2_grpc.py
    client/node/src/generated/sysml_pb.ts
    client/rust/opensysml/src/proto/sysml/sysml.rs
    client/rust/conformance/sysml.descriptor.binpb
  # Hand-written pages carrying a generated block `make docs-counts` rewrites.
  DOC_COUNT_PATHS: |
    README.md
    docs/internals/architecture.md
    docs/project/validation-constraints.md
    docs/project/spec-compliance

jobs:
  rebaseline:
    name: Merge develop and re-record the baselines
    # The label alone, on a branch of this repository alone (a fork's cannot be pushed to).
    if: >-
      github.event.label.name == 'ci:rebaseline' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    # A run takes about 20 minutes; a hung one must not hold a runner the merge queue is waiting for.
    timeout-minutes: 60
    steps:
      - name: Check out the pull request branch
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.REBASELINE_TOKEN || github.token }}

      # A stalled fetch hangs rather than fails, so the action's own retries never see it.
      - name: Check out the pull request branch again
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.REBASELINE_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # The count baselines merge cell by cell (tools/oracle/cellmerge) where git's line merge conflicts. The driver
      # and its paths are develop's, so a branch cut before them merges the same way; the checks below accept the result.
      - name: Install develop's cell-wise merge driver and merge script
        run: |
          set -euo pipefail
          git fetch -q origin develop
          git worktree add -q --detach "$RUNNER_TEMP/develop" origin/develop
          go build -C "$RUNNER_TEMP/develop/tools" -o "$RUNNER_TEMP/baseline-merge" ./cmd/baseline-merge
          git config merge.opensysml-cells.name "cell-wise merge of the count baselines"
          git config merge.opensysml-cells.driver "$RUNNER_TEMP/baseline-merge %O %A %B %P"
          grep 'merge=opensysml-cells' "$RUNNER_TEMP/develop/.gitattributes" > .git/info/attributes
          cp "$RUNNER_TEMP/develop/scripts/rebaseline-merge.sh" "$RUNNER_TEMP/rebaseline-merge.sh"
          git worktree remove --force "$RUNNER_TEMP/develop"

      - name: Merge origin/develop, taking develop's side of the generated paths only
        id: merge
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: '"$RUNNER_TEMP/rebaseline-merge.sh" "${{ github.event.pull_request.head.sha }}"'

      # The pilot JSON exporter the differential and the census run is Java, built against the pin.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      # Pinned by digest, so a substituted asset is not run.
      - name: Install buf
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' -o /tmp/buf \
            https://github.com/bufbuild/buf/releases/download/v1.57.2/buf-Linux-x86_64
          echo "644e6fa4a62afc2b0d425d3ac9538d2f512947c0f2e82fc95c41a5eab6729414  /tmp/buf" | sha256sum --check --strict
          sudo install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version

      # Pinned to the version recorded in the committed stubs (GRPC_GENERATED_VERSION).
      - name: Install the pinned grpcio-tools
        uses: ./.github/actions/pip-install
        with:
          packages: grpcio-tools==1.83.0

      # Restored only: this job runs a pull request's scripts in develop's cache scope.
      - name: Provision the pinned pilot validator
        uses: ./.github/actions/pilot-validator

      - name: Download the pinned pilot JSON exporter
        run: ./scripts/download-pilot-json-exporter.sh

      - name: Provision the pinned corpora
        uses: ./.github/actions/corpora

      - name: Download the OMG PSSM test suite
        run: ./scripts/download-pssm-suite.sh

      # The pilot's export the nightly recorded for this pin (oracle-reproduction.yml); a root it does not hold is exported here.
      - name: Restore the recorded pilot export
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/pilot-apijson-record
          key: pilot-apijson-record-${{ hashFiles('scripts/pilot-pin.sh', 'scripts/pilot-json-exporter/**', 'scripts/download-pilot-json-exporter.sh') }}-${{ github.run_id }}
          restore-keys: |
            pilot-apijson-record-${{ hashFiles('scripts/pilot-pin.sh', 'scripts/pilot-json-exporter/**', 'scripts/download-pilot-json-exporter.sh') }}-

      - name: Re-record the baselines
        uses: ./.github/actions/rebaseline-record
        with:
          base: ${{ steps.merge.outputs.base }}
          ours: ${{ steps.merge.outputs.ours }}
          theirs: ${{ steps.merge.outputs.theirs }}
          merged: ${{ steps.merge.outputs.merged }}

      # The recorders ran for minutes, and the branch or develop may have moved under them. What they recorded is not
      # pushed over a branch that moved, nor in a conflict with develop it would leave open: the next steps start again.
      - name: Push the re-recorded baselines
        id: push
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch -q origin develop
          if ! git merge-tree --write-tree HEAD origin/develop > /dev/null; then
            echo "develop moved under the recorders and conflicts with what they recorded; merging it and re-recording"
          elif git push origin "HEAD:$BRANCH"; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          else
            git fetch -q origin "$BRANCH"
            if [ "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" ]; then
              echo "the push was refused though the branch has not moved" >&2
              exit 1
            fi
            echo "the branch moved under the recorders; merging and re-recording from its new head"
          fi
          git fetch -q origin "$BRANCH"
          echo "restart=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge origin/develop again
        id: remerge
        if: steps.push.outputs.restart
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          RESTART: ${{ steps.push.outputs.restart }}
          PROVISIONED: ${{ steps.merge.outputs.merged }}
        run: |
          set -euo pipefail
          git reset -q --hard "$RESTART"
          git clean -qfd
          rm -f build/rebaseline-summary.md
          "$RUNNER_TEMP/rebaseline-merge.sh" "$RESTART"
          # The toolchain and corpora above were provisioned from the first merge's pins and scripts.
          if ! git diff --quiet "$PROVISIONED" HEAD -- scripts .github/actions; then
            echo "the provisioning scripts moved under the recorders; apply the label again" >&2
            exit 1
          fi

      - name: Re-record the baselines again
        if: steps.push.outputs.restart
        uses: ./.github/actions/rebaseline-record
        with:
          base: ${{ steps.remerge.outputs.base }}
          ours: ${{ steps.remerge.outputs.ours }}
          theirs: ${{ steps.remerge.outputs.theirs }}
          merged: ${{ steps.remerge.outputs.merged }}

      - name: Push the baselines re-recorded again
        id: repush
        if: steps.push.outputs.restart
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if ! git push origin "HEAD:$BRANCH"; then
            echo "the branch moved again under the recorders; apply the label again once it is still" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Remove the label
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --remove-label "$REBASELINE_LABEL"

      - name: Comment the movement for adjudication
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
          PUSHED_AS_ACTIONS: ${{ secrets.REBASELINE_TOKEN == '' }}
          PUSHED: ${{ steps.repush.outputs.sha || steps.push.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            if [ -n "$PUSHED" ]; then
              echo "**ci:rebaseline** merged \`origin/develop\` and re-recorded the baselines as $PUSHED ([run]($RUN_URL))."
              if [ "$PUSHED_AS_ACTIONS" = true ]; then
                echo "The push is the Actions token's, so CI on $PUSHED waits for a maintainer to approve it (the REBASELINE_TOKEN secret is not set)."
              fi
              echo
              echo "Movement to adjudicate:"
            else
              echo "**ci:rebaseline** stopped without pushing ([run]($RUN_URL), $OUTCOME). Movement seen so far:"
            fi
            echo
            cat build/rebaseline-summary.md 2>/dev/null || echo "_(no movement summary was produced; see the run log)_"
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      # A pull_request_target run is listed under the head it started from, which the push replaces: the
      # status puts a push on the head the pull request shows, and a failure on the head it last worked from.
      - name: Report the outcome on the pull request's head
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKED_FROM: ${{ steps.push.outputs.restart || github.event.pull_request.head.sha }}
          PUSHED: ${{ steps.repush.outputs.sha || steps.push.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$PUSHED" ]; then
            sha=$PUSHED state=success description="merged develop and re-recorded the baselines"
          else
            sha=$WORKED_FROM
            state=failure description="stopped without pushing; see the run and the comment"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" -f context="$REBASELINE_LABEL" \
            -f description="$description" -f target_url="$RUN_URL"
