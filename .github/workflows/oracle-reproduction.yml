name: Oracle reproduction

# The oracle baselines under docs/project/ are only as true as their last
# recorded run. Re-running the Java-backed oracles needs Java, the pinned pilot
# jar and the downloaded corpora — which is why neither pr.yml nor CircleCI's
# build-and-test does them on every change. pr.yml reproduces the Xpect baseline
# (no Java) on every pull request and the api-json baseline on the changes that
# can move it; every oracle is reproduced here, on a schedule and on demand, so
# a baseline that has stopped describing reality surfaces within a day instead
# of at the next audit. It is deliberately not a
# required check: it downloads from upstream and takes minutes, so a network
# failure here must not block a pull request.
#
# It lives in GitHub Actions rather than .circleci/config.yml because a
# CircleCI schedule is configured outside the repository (project settings or
# the API), so a fork of this repository would inherit the file without the
# trigger; `schedule` plus `workflow_dispatch` here need nothing but the file.
# pages.yml is guarded by `github.repository == 'Open-MBEE/OpenSysML'` and so
# never runs in a fork — this workflow carries no such guard on purpose, since a
# fork's baselines go stale the same way.
on:
  schedule:
    # 04:17 UTC daily, off the hour to avoid the scheduler's busiest minute.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Reproduce the committed oracle baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # The pinned pilot implementation is a Java artifact and the two bridges
      # are plain-Java programs compiled against it.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Report the pin and the toolchain
        run: |
          cat scripts/pilot-pin.sh
          java -version
          go version

      # The entry pull requests, merge groups and rebaseline.yml restore: read nightly, saved when absent.
      - name: Provision the pinned pilot validator, and save it when the cache holds none
        uses: ./.github/actions/pilot-validator
        with:
          save: 'true'

      - name: Download the pinned pilot validators
        run: |
          ./scripts/download-pilot-sysml-validator.sh
          ./scripts/download-pilot-kerml-validator.sh
          ./scripts/download-pilot-json-exporter.sh

      - name: Install poppler-utils
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends poppler-utils

      - name: Download the OMG corpora the oracles compare
        run: |
          ./scripts/download-training-examples.sh
          ./scripts/download-pilot-corpora.sh
          ./scripts/download-pilot-xpect.sh
          ./scripts/download-pssm-suite.sh
          ./scripts/download-sysml-v1tov2.sh
          ./scripts/download-spec-examples.sh

      # Each oracle's -check re-runs the comparison and diffs the fresh report
      # against its committed baseline, ignoring only a recording date. The
      # failure names whether the provenance moved (the pinned reference or an
      # input changed underneath the baseline: investigate the provisioning) or
      # only the counts did (an implementation movement: adjudicate, then
      # re-record with -update). Each step runs even if an earlier one failed,
      # so one run reports all three verdicts.
      - name: Reference differential reproduces its baseline
        run: go run -C tools ./cmd/pilot-diff -check

      - name: Xpect oracle reproduces its baseline
        if: ${{ !cancelled() }}
        run: go run -C tools ./cmd/pilot-xpect -check

      - name: Rejection oracle reproduces its baseline
        if: ${{ !cancelled() }}
        run: go run -C tools ./cmd/pilot-reject -check

      # Bucket counts only: the scorecard of derived properties against the
      # pilot's JSON export, see docs/project/api-json-differential.md.
      - name: Derived-property differential reproduces its baseline and records the pilot's export
        if: ${{ !cancelled() }}
        run: |
          rm -rf build/pilot-apijson-record
          go run -C tools ./cmd/pilot-apijson-diff -check -pilot-record build/pilot-apijson-record

      - name: Save the recorded pilot export
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/pilot-apijson-record
          key: pilot-apijson-record-${{ hashFiles('scripts/pilot-pin.sh', 'scripts/pilot-json-exporter/**', 'scripts/download-pilot-json-exporter.sh') }}-${{ github.run_id }}

      # The census's pilot column is re-exported and the committed records held to it: pull requests
      # re-measure our side alone against that column (derived-census -check -recorded-pilot).
      - name: Derived census reproduces its baseline, pilot column included
        if: ${{ !cancelled() }}
        run: go run -C tools ./cmd/derived-census -check -require-exporter

      # Bucket counts only: a pass is never evidence of SysML v2 conformance.
      - name: PSSM referee reproduces its baseline counts
        if: ${{ !cancelled() }}
        env:
          OPENSYSML_REQUIRE_PSSM_SUITE: "1"
        run: go run -C tools ./cmd/pssm-referee -check

      # The census baseline lists the constraint names the pinned jar's validator
      # classes declare; only here is the jar present to compare against.
      - name: Validation-constraint baseline lists what the pinned jar contains
        if: ${{ !cancelled() }}
        run: go run -C tools ./cmd/validation-census -check -require-jar

      # The transformation census's baseline lists the mapping classes the
      # pinned model declares; only here is the model present to compare against.
      - name: Transformation census lists what the pinned model contains
        if: ${{ !cancelled() }}
        run: go run -C tools ./cmd/transformation-census -check -require-xmi

      # The reports themselves, so a failing run can be read without
      # reproducing the environment.
      - name: Upload the fresh reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-reports
          path: |
            build/pilot-diff/
            build/pilot-xpect/
            build/pilot-reject/
            build/pilot-apijson-diff/
            build/derived-census/
          if-no-files-found: warn

  # The cross-MDK suite needs neither Java nor the pilot, so it runs beside the
  # job above rather than after it; see docs/project/hideo-suite.md.
  hideo-suite:
    name: Reproduce the cross-MDK conformance suite baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # make build-grpc stamps the binary with `git describe`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The suite's Python readers resolve their environment with uv.
      - name: Install uv
        uses: ./.github/actions/pip-install
        with:
          packages: uv==0.13.8

      - name: Report the pin and the toolchain
        run: |
          cat scripts/hideo-suite-pin.sh
          go version
          python --version
          uv --version

      - name: Download the pinned suite
        run: ./scripts/download-hideo-suite.sh

      # Per-case outcomes: a pass is agreement with the pilot on one read,
      # never evidence of SysML v2 conformance. Builds bin/sysml-grpc first.
      - name: Cross-MDK conformance suite reproduces its baseline
        env:
          OPENSYSML_REQUIRE_HIDEO_SUITE: "1"
        run: go run -C tools ./cmd/hideo-suite -check

      - name: Upload the suite's results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hideo-suite-results
          path: build/hideo-suite/test-suite/results/
          if-no-files-found: warn
