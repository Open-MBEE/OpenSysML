name: Maven dependency cache

# A cache saved by a pull request or merge group is private to its ref, so the Java jobs start
# warm only from an entry saved on develop: this resolves every Maven tree and saves one.
on:
  push:
    branches: [develop]
    paths:
      - '**/pom.xml'
      - .github/workflows/maven-cache.yml
      - .github/actions/maven-cache/**
  # An entry no run read for a week is evicted: the daily run reads it, or saves it again.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-cache
  cancel-in-progress: true

jobs:
  warm:
    name: Warm the Maven dependency cache
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      # No other job saves this entry, so it cannot be one tree's dependencies under the key.
      - name: Restore the Maven dependency cache, and save it after the job
        uses: ./.github/actions/maven-cache
        with:
          save: 'true'

      # Tests are compiled but not run: they need the service binary, and what is saved is ~/.m2.
      - name: Resolve the Java client
        run: mvn -B -q -f client/java/pom.xml install -DskipTests

      - name: Resolve the Magic MDK plugin
        run: mvn -B -q -f editors/mdk/pom.xml verify -DskipTests

      - name: Resolve the SysON backend
        run: mvn -B -q -f editors/syson/pom.xml install -DskipTests
