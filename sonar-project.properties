sonar.projectKey=Open-MBEE_OpenSysML
sonar.organization=openmbee

# Go sources and tests share directories, so the split is by pattern, not path.
# The clients keep theirs apart, so each language's test root is named too;
# without them a client's tests are measured as product code.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,clients/python/tests/**,clients/java/*/src/test/**,clients/node/test/**,clients/rust/opensysml/tests/**

# Fixtures, demos, the fetched OMG corpus, and generated code are not
# hand-written source; scripts/ and .github/ stay in scope on purpose. The
# clients' protobuf and Connect stubs are generated by buf and guarded by a
# drift check in CI, so they belong here with **/*.pb.go rather than in a
# quality profile no one can act on. The header partial is a verbatim copy of the
# theme's own, kept in step by scripts/mkdocs_header_menu.py, so it is not ours to
# edit either.
sonar.exclusions=overrides/partials/header.html,**/*_test.go,**/testdata/**,examples/**,clients/python/tests/**,**/*.pb.go,internal/core/rdf/ontology/table.go,clients/node/src/generated/**,clients/python/opensysml/proto/**,clients/java/opensysml-client/src/main/java/org/openmbee/opensysml/proto/**,clients/java/opensysml-client/src/main/java/org/openmbee/opensysml/internal/Protos.java,clients/rust/opensysml/src/proto/**
sonar.test.exclusions=**/testdata/**,examples/**,clients/python/tests/golden/**

# Each language's test job writes its report and persists it to the workspace,
# and the scan job requires those jobs; a language whose report is missing has
# every line counted as uncovered.
sonar.go.coverage.reportPaths=coverage.txt
sonar.python.coverage.reportPaths=coverage-python.xml
sonar.javascript.lcov.reportPaths=coverage-node.lcov
sonar.typescript.lcov.reportPaths=coverage-node.lcov
sonar.coverage.jacoco.xmlReportPaths=clients/java/opensysml-client/target/site/jacoco/jacoco.xml,clients/java/opensysml-conformance/target/site/jacoco/jacoco.xml

# The Java sensor resolves types from compiled classes, not from sources: with
# these absent it warns and degrades to a syntactic analysis. java-test builds
# them and copies the dependency jars beside them, then persists all four.
sonar.java.binaries=clients/java/opensysml-client/target/classes,clients/java/opensysml-conformance/target/classes
sonar.java.test.binaries=clients/java/opensysml-client/target/test-classes,clients/java/opensysml-conformance/target/test-classes
sonar.java.libraries=clients/java/opensysml-client/target/dependency/*.jar,clients/java/opensysml-conformance/target/dependency/*.jar
sonar.java.test.libraries=clients/java/opensysml-client/target/dependency/*.jar,clients/java/opensysml-conformance/target/dependency/*.jar

# Unset, the Python sensor assumes every Python 3 version and drops the rules
# that depend on one. The range is the client's own: pyproject requires >=3.10
# and classifies through 3.13.
sonar.python.version=3.10, 3.11, 3.12, 3.13

# Standalone drivers no test suite executes, launched as programs against a
# downloaded OMG toolchain. Excluded from coverage only; every rule still applies.
sonar.coverage.exclusions=scripts/pilot-evaluator/**,scripts/pilot-kerml-validator/**,scripts/pilot-sysml-validator/**,scripts/syside-validator/**

# Each entry below is a rule whose subject in that one file is the documented
# behaviour of a developer command, not a defect; the rule still reports
# everywhere else. Profiling flags are the REPL's feature. The conformance
# harnesses and the example runner build the working tree with the developer's
# own toolchain. The CLIs read and write the paths named on their command line.
# values.py compares against the exact 1.0 the service sent. The Python client
# states version ranges because pinning them would pin its consumers. A
# table-driven test's branching is its case list, so its cognitive complexity
# measures the table. The sealed sum types are one-method interfaces whose
# method is the marker closing the type, not a verb the -er convention names.
# The AST codec and the planners' errors switch exhaustively over a closed set
# (every node type, every error kind), so their branch count is the set's size.
sonar.issue.ignore.multicriteria=profiling,goToolchainGo,goToolchainNode,goToolchainExamples,cliPathsNode,cliPathsGenerate,cliPathsScripts,exactUnitDefaults,libraryVersions,tableDrivenTests,pinnedDigests,standaloneDrivers,exceptionDepth,restoredDiagnostics,mutationHooks,sealedValue,sealedEdit,sealedCell,sealedExpr,sealedStatement,sealedPass,sealedIR,closedSetCodec,closedSetDocplan,closedSetQueryplan
sonar.issue.ignore.multicriteria.profiling.ruleKey=go:S4507
sonar.issue.ignore.multicriteria.profiling.resourceKey=cmd/sysml/profile.go
sonar.issue.ignore.multicriteria.goToolchainGo.ruleKey=go:S4036
sonar.issue.ignore.multicriteria.goToolchainGo.resourceKey=cmd/conformance/service.go
sonar.issue.ignore.multicriteria.goToolchainNode.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.goToolchainNode.resourceKey=clients/node/conformance/main.ts
sonar.issue.ignore.multicriteria.goToolchainExamples.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.goToolchainExamples.resourceKey=clients/node/scripts/run-example.mjs
sonar.issue.ignore.multicriteria.cliPathsNode.ruleKey=tssecurity:S8707
sonar.issue.ignore.multicriteria.cliPathsNode.resourceKey=clients/node/conformance/main.ts
sonar.issue.ignore.multicriteria.cliPathsGenerate.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cliPathsGenerate.resourceKey=clients/python/opensysml/generate.py
sonar.issue.ignore.multicriteria.cliPathsScripts.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.cliPathsScripts.resourceKey=clients/python/scripts/*.py
sonar.issue.ignore.multicriteria.exactUnitDefaults.ruleKey=python:S1244
sonar.issue.ignore.multicriteria.exactUnitDefaults.resourceKey=clients/python/opensysml/values.py
sonar.issue.ignore.multicriteria.libraryVersions.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.libraryVersions.resourceKey=clients/python/pyproject.toml
