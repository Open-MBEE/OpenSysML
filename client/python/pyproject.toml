[build-system]
# setuptools 77 is the first release that accepts a PEP 639 SPDX `license`
# expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opensysml"
dynamic = ["version"]
description = "Python client library for OpenSysML, a SysML v2 parser and execution runtime"
readme = "README.md"
# grpcio 1.83 and protobuf 7.35 publish wheels for CPython 3.10 and later only,
# so anything older cannot install the dependency set below.
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Open-MBEE" }]
keywords = ["sysml", "sysmlv2", "kerml", "mbse", "systems-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    "grpcio>=1.83.0",
    "protobuf>=7.35.1",
    # Verifies the sigstore bundle a core release publishes over its checksum
    # manifest, which is what lets a release newer than this client install.
    "sigstore>=4.5.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    # Writes the coverage.xml the SonarCloud scan reads.
    "pytest-cov>=5.0.0",
    # The lifecycle tests inspect processes; the client itself signals only its
    # own child, through the Popen object that started it.
    "psutil>=5.9.0",
    "grpcio-tools>=1.83.0",
    "mypy>=1.8.0",
    # Stubs for the untyped dependencies, so `mypy opensysml` checks the calls
    # into them rather than reporting the imports.
    "types-protobuf>=4.24.0",
    "types-psutil>=5.9.0",
    "grpc-stubs>=1.53.0",
    "pandas-stubs>=2.0.0",
    # Pulled in by pandas-stubs; numpy 2.5's stubs use a PEP 695 `type`
    # statement, a syntax error at the python_version mypy targets below.
    "numpy<2.5",
]

[project.scripts]
opensysml-generate = "opensysml.generate:main"

[project.urls]
Homepage = "https://github.com/Open-MBEE/OpenSysML"
Repository = "https://github.com/Open-MBEE/OpenSysML"
Documentation = "https://github.com/Open-MBEE/OpenSysML/blob/main/clients/python/README.md"
Changelog = "https://github.com/Open-MBEE/OpenSysML/blob/main/CHANGELOG.md"
Issues = "https://github.com/Open-MBEE/OpenSysML/issues"

[tool.setuptools.dynamic]
version = { attr = "opensysml._version.VERSION" }

[tool.setuptools.packages.find]
include = ["opensysml*"]

[tool.setuptools.package-data]
# The marker that tells type checkers the shipped annotations are usable, and the
# pinned release digests a download is verified against.
opensysml = ["py.typed", "release-digests.json"]
# The generated protobuf stubs: the modules themselves build their classes at
# import time, so these are the only annotations for them.
"opensysml.proto" = ["*.pyi"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (requiring service/network)",
]

[tool.mypy]
python_version = "3.10"
files = ["opensysml"]
warn_unused_ignores = true

