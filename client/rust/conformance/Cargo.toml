[package]
name = "opensysml-conformance"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false

[dependencies]
opensysml = { path = "../opensysml" }
prost = "=0.14.1"
prost-reflect = { version = "0.16", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
