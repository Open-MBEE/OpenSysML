# sysml-mcp as a service: the MCP server from the openmbee/opensysml image
# behind Caddy, which terminates TLS and forwards /mcp, /health and /ready.
# The token comes from a secret file, the root filesystem is read-only, and
# the only writable paths are a tmpfs and the standard library's record cache.
# docs/guide/sysml-mcp-service.md walks through it.
services:
  sysml-mcp:
    image: ${OPENSYSML_IMAGE:-openmbee/opensysml:latest}
    entrypoint: ["/usr/local/bin/sysml-mcp"]
    # 0.0.0.0 is reachable from the proxy's network only; the port is not
    # published, so every client comes through Caddy and its TLS.
    command: ["-http", "0.0.0.0:8765", "-root", "/models"]
    environment:
      OPENSYSML_MCP_TOKEN_FILE: /run/secrets/mcp_token
      OPENSYSML_MCP_PUBLIC_URL: https://${MCP_HOST:-localhost}/mcp
      OPENSYSML_MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    secrets:
      - mcp_token
    volumes:
      - ./models:/models:ro
      - record-cache:/home/nonroot/.cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  proxy:
    image: caddy:2.9-alpine
    ports:
      - "${MCP_HTTPS_PORT:-8443}:443"
    environment:
      MCP_HOST: ${MCP_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - sysml-mcp
    restart: unless-stopped
secrets:
  mcp_token:
    file: ./secrets/mcp.token
volumes:
  record-cache:
  caddy-data:
  caddy-config:
