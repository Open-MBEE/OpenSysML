version: v2
# Every generated stub in the repository, Go and Java, with plugin versions pinned inline.
# Run via `make proto`.
#
# The proto declares no java_package, so managed mode supplies one. Those two Java options are
# part of the descriptor, hence the only Go-side change: two more bytes of file options.
managed:
  enabled: true
  # Managed mode rewrites file options in the descriptor every plugin sees, so only the two
  # the Java client needs are left on; the rest would change api/proto for nothing.
  disable:
    - file_option: java_outer_classname
    - file_option: objc_class_prefix
    - file_option: csharp_namespace
    - file_option: php_namespace
    - file_option: php_metadata_namespace
    - file_option: ruby_package
  override:
    - file_option: java_package
      value: org.openmbee.opensysml.proto
    - file_option: java_multiple_files
      value: true
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: api/proto
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0"]
    out: api/proto
    opt: paths=source_relative
  - local: ["go", "run", "connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0"]
    out: api/proto
    opt: paths=source_relative
  # Java message classes only: the client speaks the Connect protocol over java.net.http, so
  # grpc-java (and Netty) is not a dependency of it. The remote plugin needs network access.
  - remote: buf.build/protocolbuffers/java:v33.1
    out: client/java/opensysml-client/src/main/java
